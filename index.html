<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Маркер версии для GitHub Actions. Не удалять! -->
<meta name="build" content="DEV">
<title>Голова, Торс, Таз, Плечи, Руки и Ноги</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #2a2a2a;
    --text: #eee;
    --accent: #4a90d9;
    --border: #444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .wrap { display: flex; gap: 16px; align-items: flex-start; width: 100%; max-width: 1600px; }

  .panel {
    flex: 0 0 340px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--panel); padding: 12px; border-radius: 10px;
    max-height: 92vh; overflow-y: auto;
  }

  .accordion {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #222;
  }
  .accordion-header {
    background: #333; padding: 10px 14px;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 600; color: var(--accent);
    user-select: none;
  }
  .accordion-header:hover { background: #3a3a3a; }
  .accordion-header::after {
    content: '▼'; font-size: 10px; transition: transform 0.3s;
  }
  .accordion.open .accordion-header::after {
    transform: rotate(-180deg);
  }
  .accordion-content {
    display: none; padding: 12px;
    flex-direction: column; gap: 12px;
    border-top: 1px solid var(--border);
  }
  .accordion.open .accordion-content {
    display: flex;
  }

  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  label .row { display: flex; justify-content: space-between; align-items: center; color: #ccc; }
  label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer; }
  .chk { flex-direction: row; align-items: center; gap: 8px; cursor: pointer; }

  button {
    padding: 8px 12px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-size: 13px;
    cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #5aa0e9; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }

  .subhead {
    font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 4px 0 2px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }

  .stage {
    flex: 1; min-width: 0; max-height: 92vh; overflow: auto;
    border: 1px solid var(--border); border-radius: 8px;
    background: #000; display: flex; justify-content: center;
  }
  canvas { display: block; max-width: 100%; height: auto; }

  @media (max-width: 900px) {
    .wrap { flex-direction: column; align-items: center; }
    .panel { flex: 0 0 auto; width: 100%; max-height: 50vh; order: 2; }
    .stage { width: 100%; order: 1; max-height: 60vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">

    <!-- Блок 1: Общее -->
    <div class="accordion open">
      <div class="accordion-header">Общее и Подложка</div>
      <div class="accordion-content">
        <label class="chk"><input type="checkbox" id="showRef" checked> Показывать подложку</label>
        <label><span class="row">Прозрачность <span class="val" id="vRefOp">0.50</span></span><input type="range" id="refOp" min="0" max="1" step="0.05" value="0.5"></label>
        <button id="uploadBtn" class="sec">Загрузить картинку</button>
        <input type="file" id="fileInput" style="display:none;" accept="image/*">
        <label><span class="row">Рост в головах <span class="val" id="vHeads">5.0</span></span><input type="range" id="heads" min="3" max="12" step="0.1" value="5.0"></label>
        <label><span class="row">Цвет линий</span><input type="color" id="lineColor" value="#ff3b3b"></label>
        <label><span class="row">Толщина <span class="val" id="vWidth">5</span></span><input type="range" id="lineWidth" min="1" max="30" step="1" value="5"></label>

        <label class="chk"><input type="checkbox" id="showSub" checked> Показывать подсекции</label>
      </div>
    </div>

    <!-- Блок 2: Голова -->
    <div class="accordion">
      <div class="accordion-header">Голова (Череп и Челюсть)</div>
      <div class="accordion-content">

        <label><span class="row">Ширина черепа <span class="val" id="vSkullW">1.00</span></span><input type="range" id="skullW" min="0.5" max="1.6" step="0.01" value="1.0"></label>
        <label><span class="row">Смещение по X <span class="val" id="vSkullX">0.00</span></span><input type="range" id="skullX" min="-0.5" max="0.5" step="0.01" value="0"></label>
        <hr style="border-color:#444; width:100%;">
        <label><span class="row">Высота подбородка <span class="val" id="vChinY">0.30</span></span><input type="range" id="chinY" min="-0.5" max="1.0" step="0.01" value="0.30"></label>
        <label><span class="row">Ширина подбородка <span class="val" id="vChinW">0.00</span></span><input type="range" id="chinW" min="0" max="1" step="0.01" value="0.00"></label>

        <label><span class="row">Смещение шеи по X <span class="val" id="vNeckX">0.00</span></span><input type="range" id="neckX" min="-0.5" max="0.5" step="0.01" value="0.00"></label>

        <label><span class="row">Высота ключиц <span class="val" id="vClavY">0.80</span></span><input type="range" id="clavY" min="0" max="1" step="0.01" value="0.80"></label>

        <label><span class="row">Высота торса <span class="val" id="vTorsoH">0.85</span></span><input type="range" id="torsoH" min="0.5" max="1.3" step="0.01" value="0.85"></label>

        <label><span class="row">Сужение торса сверху <span class="val" id="vTorsoTop">0.60</span></span><input type="range" id="torsoTop" min="0.1" max="1" step="0.01" value="0.60"></label>

        <label><span class="row">Высота линии <span class="val" id="vNavelH">0.23</span></span><input type="range" id="navelH" min="0" max="1" step="0.01" value="0.23"></label>
        <label><span class="row">Смещение по Y <span class="val" id="vNavelY">-0.05</span></span><input type="range" id="navelY" min="-0.5" max="0.5" step="0.01" value="-0.05"></label>

        <label><span class="row">Толщина рук <span class="val" id="vArmLw">1.0</span></span><input type="range" id="armLw" min="0.3" max="2" step="0.1" value="1.0"></label>

        <hr style="border-color:#444; width:100%;">

        <label><span class="row">Позиция расширения <span class="val" id="vCrossPos">0.33</span></span><input type="range" id="crossPos" min="0.1" max="0.9" step="0.01" value="0.33"></label>

        <label><span class="row">Вогнутость <span class="val" id="vCrossRound">0.50</span></span><input type="range" id="crossRound" min="0" max="1" step="0.01" value="0.50"></label>

        <label><span class="row">Сгиб плеча <span class="val" id="vLShoulderAngle">0.00</span></span><input type="range" id="lShoulderAngle" min="-1.5" max="1.5" step="0.01" value="0.00"></label>
        <label><span class="row">Сгиб локтя <span class="val" id="vLElbowAngle">0.10</span></span><input type="range" id="lElbowAngle" min="-1.5" max="1.5" step="0.01" value="0.10"></label>
        <label><span class="row">Смещение запястья X <span class="val" id="vLWristX">-0.30</span></span><input type="range" id="lWristX" min="-0.5" max="0.5" step="0.01" value="-0.30"></label>
        <label><span class="row">Смещение запястья Y <span class="val" id="vLWristY">0.00</span></span><input type="range" id="lWristY" min="-0.5" max="0.5" step="0.01" value="0.00"></label>

        <hr style="border-color:#444; width:100%;">

        <!-- ПРАВАЯ РУКА -->
        <div class="subhead">Правая рука</div>
        <label><span class="row">Сгиб плеча <span class="val" id="vRShoulderAngle">0.00</span></span><input type="range" id="rShoulderAngle" min="-1.5" max="1.5" step="0.01" value="0.00"></label>
        <label><span class="row">Сгиб локтя <span class="val" id="vRElbowAngle">0.10</span></span><input type="range" id="rElbowAngle" min="-1.5" max="1.5" step="0.01" value="0.10"></label>
        <label><span class="row">Смещение запястья X <span class="val" id="vRWristX">0.30</span></span><input type="range" id="rWristX" min="-0.5" max="0.5" step="0.01" value="0.30"></label>
        <label><span class="row">Смещение запястья Y <span class="val" id="vRWristY">0.00</span></span><input type="range" id="rWristY" min="-0.5" max="0.5" step="0.01" value="0.00"></label>

    <!-- Блок 7: Ноги -->
    <div class="accordion open">
      <div class="accordion-header">Ноги</div>
      <div class="accordion-content">
        <label class="chk"><input type="checkbox" id="showLegs" checked> Показывать ноги</label>
        <label><span class="row">Толщина бедра <span class="val" id="vThighW">1.0</span></span><input type="range" id="thighW" min="0.3" max="2" step="0.1" value="1.0"></label>
        <label><span class="row">Толщина голени <span class="val" id="vCalfW">1.0</span></span><input type="range" id="calfW" min="0.3" max="2" step="0.1" value="1.0"></label>

        <div class="subhead">Левая нога</div>
        <label><span class="row">Смещение бедра X <span class="val" id="vLThighX">-0.20</span></span><input type="range" id="lThighX" min="-0.5" max="0.5" step="0.01" value="-0.20"></label>

        <label><span class="row">Смещение стопы Y <span class="val" id="vLFootY">0.50</span></span><input type="range" id="lFootY" min="-0.5" max="0.5" step="0.01" value="0.50"></label>
        
        <hr style="border-color:#444; width:100%;">

        <div class="subhead">Правая нога</div>
        <label><span class="row">Смещение бедра X <span class="val" id="vRThighX">0.20</span></span><input type="range" id="rThighX" min="-0.5" max="0.5" step="0.01" value="0.20"></label>
        <label><span class="row">Смещение стопы X <span class="val" id="vRFootX">0.30</span></span><input type="range" id="rFootX" min="-0.5" max="0.5" step="0.01" value="0.30"></label>
        <label><span class="row">Смещение стопы Y <span class="val" id="vRFootY">0.50</span></span><input type="range" id="rFootY" min="-0.5" max="0.5" step="0.01" value="0.50"></label>

  <div class="stage">
    <canvas id="cv" width="4096" height="4096"></canvas>
  </div>
</div>

<script>
/* ============================================================
   АВТО-ОБНОВЛЕНИЕ ВЕРСИИ
   ============================================================ */
(function autoUpdateCheck() {
  const currentBuild = document.querySelector('meta[name="build"]')?.content;
  if (!currentBuild || currentBuild === 'DEV') return;

  setInterval(async () => {
    try {
      const res = await fetch(window.location.href, { cache: 'no-store' });
      const text = await res.text();
      const match = text.match(/<meta name="build" content="([^"]+)"/);
      
      if (match && match[1] !== currentBuild) {
        console.log('Обнаружено обновление. Перезагрузка...');
        window.location.href = window.location.pathname + '?updated=' + Date.now();
      }
    } catch (e) {}
  }, 60000);
})();

// --- Аккордеоны ---
document.querySelectorAll('.accordion-header').forEach(header => {
  header.addEventListener('click', () => {
    header.parentElement.classList.toggle('open');
  });
});

// --- Основной код ---
let canvasW = 4096;
const canvasH = 4096;
let refImage = null;

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const ui = {
  showRef: document.getElementById('showRef'), refOp: document.getElementById('refOp'),
  heads: document.getElementById('heads'), lineColor: document.getElementById('lineColor'), lineWidth: document.getElementById('lineWidth'),
  showHeads: document.getElementById('showHeads'), showSub: document.getElementById('showSub'),
  skullH: document.getElementById('skullH'), skullW: document.getElementById('skullW'), skullX: document.getElementById('skullX'),
  chinY: document.getElementById('chinY'), chinW: document.getElementById('chinW'), chinR: document.getElementById('chinR'),
  jawY: document.getElementById('jawY'), jawW: document.getElementById('jawW'), jawB: document.getElementById('jawB'),
  neckW: document.getElementById('neckW'), neckX: document.getElementById('neckX'),
  torsoH: document.getElementById('torsoH'), torsoW: document.getElementById('torsoW'), torsoX: document.getElementById('torsoX'),
  torsoTop: document.getElementById('torsoTop'), torsoBot: document.getElementById('torsoBot'),
  shoulderY: document.getElementById('shoulderY'), clavY: document.getElementById('clavY'), trapY: document.getElementById('trapY'),
  pelvisR: document.getElementById('pelvisR'), pelvisX: document.getElementById('pelvisX'),
  showHipLines: document.getElementById('showHipLines'), 
  hipGap: document.getElementById('hipGap'), 
  hipGapW: document.getElementById('hipGapW'), 
  hipTopY: document.getElementById('hipTopY'), 
  hipMidY: document.getElementById('hipMidY'),
  showAbsLines: document.getElementById('showAbsLines'), absBend: document.getElementById('absBend'),
  showNavel: document.getElementById('showNavel'), navelType: document.getElementById('navelType'), 
  navelW: document.getElementById('navelW'), navelH: document.getElementById('navelH'), navelY: document.getElementById('navelY'),
  
  showArms: document.getElementById('showArms'), wristR: document.getElementById('wristR'),
  showWristBall: document.getElementById('showWristBall'), showElbowBall: document.getElementById('showElbowBall'),
  showElbow: document.getElementById('showElbow'), armLw: document.getElementById('armLw'),
  
  crossPos: document.getElementById('crossPos'), crossW: document.getElementById('crossW'), crossRound: document.getElementById('crossRound'),
  
  lShoulderAngle: document.getElementById('lShoulderAngle'), lElbowAngle: document.getElementById('lElbowAngle'),

// ============================================
// ГЕОМЕТРИЯ РУКИ
// ============================================
function buildArm(shoulder, wristBase, shoulderAngle, elbowAngle, ballRadius) {
  const dx = wristBase.x - shoulder.x;
  const dy = wristBase.y - shoulder.y;

  const cosA = Math.cos(shoulderAngle);
  const sinA = Math.sin(shoulderAngle);
  const rx = dx * cosA - dy * sinA;
  const ry = dx * sinA + dy * cosA;
  const wrist = { x: shoulder.x + rx, y: shoulder.y + ry };

  const mx = (shoulder.x + wrist.x) / 2;
  const my = (shoulder.y + wrist.y) / 2;
  const len = Math.hypot(rx, ry) || 1;
  const px = -ry / len;
  const py =  rx / len;
  const elbow = {
    x: mx + px * elbowAngle * len * 0.5,
    y: my + py * elbowAngle * len * 0.5
  };

  return { shoulder, elbow, wrist, ballRadius };
}

// ============================================
// ГЕОМЕТРИЯ НОГИ
// ============================================
function buildLeg(hip, ankle, kneeAngle, legLw, kneeBallR, ankleBallR) {
  const dx = ankle.x - hip.x;
  const dy = ankle.y - hip.y;
  
  const mx = (hip.x + ankle.x) / 2;
  const my = (hip.y + ankle.y) / 2;
  
  const len = Math.hypot(dx, dy) || 1;
  const px = -dy / len;
  const py =  dx / len;
  
  const knee = {
    x: mx + px * kneeAngle * len * 0.1,
    y: my + py * kneeAngle * len * 0.1
  };

  return { hip, knee, ankle };
}

function draw() {
  const W = canvasW, H = canvasH;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (refImage && ui.showRef.checked) {
    ctx.save();
    ctx.globalAlpha = parseFloat(ui.refOp.value) || 0.5;
    ctx.drawImage(refImage, 0, 0, W, H);
    ctx.restore();
  }

  const n = parseFloat(ui.heads.value) || 5.0;
  const color = ui.lineColor.value;
  const lw = parseInt(ui.lineWidth.value) || 5;

  const headStep = H / n;
  const headLines = [];
  for (let i = 0; i <= n; i++) headLines.push(i * headStep);

  const cx = W / 2; 

  // Сетка секций
  if (ui.showHeads.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(180,180,180,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (const y of headLines) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  // --- Голова ---
  const skullTopBase = 0; 
  const skullBotBase = headStep * 3 / 5; 
  const baseR = (skullBotBase - skullTopBase) / 2;
  const skullCyBase  = skullTopBase + baseR; 

  const skullH = parseFloat(ui.skullH.value) || 1;
  const skullW = parseFloat(ui.skullW.value) || 1;
  const skullX = parseFloat(ui.skullX.value) || 0;

  const rY = baseR * skullH;
  const rX = baseR * skullW;
  const headCx = cx + skullX * rX; 
  const cy = skullCyBase;
  
  const skullTop = cy - rY;
  const skullBottom = cy + rY;

  const chinBaseY = headStep * 4 / 5;
  const chinYOffset = parseFloat(ui.chinY.value) || 0;
  const chinCenterY = chinBaseY + chinYOffset * (headStep / 5);

  const chinWParam = parseFloat(ui.chinW.value) || 0;
  const chinRParam = parseFloat(ui.chinR.value) || 0;
  const chinHalfW = chinWParam * rX * 0.7;
  const chinRound = chinRParam * chinHalfW;

  const jawYParam = parseFloat(ui.jawY.value) || 0.77;
  const jawAttachY = skullBottom - (skullBottom - cy) * jawYParam;

  const jawWParam = parseFloat(ui.jawW.value) || 0.78;
  const jawBParam = parseFloat(ui.jawB.value) || 0.73;

  const attachDx = Math.sqrt(Math.max(0, 1 - Math.pow((jawAttachY - cy) / rY, 2)));
  const attachLeft  = { x: headCx - rX * attachDx, y: jawAttachY };
  const attachRight = { x: headCx + rX * attachDx, y: jawAttachY };

  const cornerLeft  = { x: headCx - rX * jawWParam, y: jawAttachY + (chinCenterY - jawAttachY) * jawBParam };
  const cornerRight = { x: headCx + rX * jawWParam, y: jawAttachY + (chinCenterY - jawAttachY) * jawBParam };

  let chinLeft, chinRight;
  if (chinHalfW < 1.5) {
    chinLeft = { x: headCx, y: chinCenterY };
    chinRight = { x: headCx, y: chinCenterY };
  } else {
    chinLeft  = { x: headCx - chinHalfW, y: chinCenterY };
    chinRight = { x: headCx + chinHalfW, y: chinCenterY };
  }

  // --- Шея ---
  const neckWParam = parseFloat(ui.neckW.value) || 0.3;
  const neckXParam = parseFloat(ui.neckX.value) || 0;
  const neckHalfW = rX * neckWParam;
  const neckCx = headCx + neckXParam * rX;
  const neckTopY = chinCenterY - (headStep / 10); 
  const neckBotY = headStep; 

  // --- Торс ---
  const tH = parseFloat(ui.torsoH.value) || 0.85;
  const tW = parseFloat(ui.torsoW.value) || 1.5;
  const tX = parseFloat(ui.torsoX.value) || 0;
  const tTop = parseFloat(ui.torsoTop.value) || 0.6;
  const tBot = parseFloat(ui.torsoBot.value) || 0.8;

  const torsoTopY = headStep; 
  const torsoBotY = headStep * 2; 
  
  const baseTorsoH = torsoBotY - torsoTopY;
  const baseTorsoW = rX * 1.5; 

  const torsoCenterY = torsoTopY + (baseTorsoH * tH) / 2;
  const torsoRX = (baseTorsoW * tW) / 2;
  const torsoRY = (baseTorsoH * tH) / 2;
  const torsoCx = cx + tX * torsoRX;

  const torsoTopActualY = torsoCenterY - torsoRY;
  const torsoBottomY = torsoCenterY + torsoRY;

  // --- Плечи ---
  const shoulderYParam = parseFloat(ui.shoulderY.value) || 0;
  const clavYParam = parseFloat(ui.clavY.value) || 0.8;
  const trapYParam = parseFloat(ui.trapY.value) || 0.5;
  
  const torsoSubStep = (torsoBottomY - torsoTopActualY) / 3;
  
  const shoulderCy = torsoTopActualY + (torsoSubStep / 2) + (shoulderYParam * torsoSubStep);
  const shoulderRadius = torsoSubStep / 2;

  const dyNorm = (shoulderCy - torsoCenterY) / torsoRY;
  const torsoWidthAtShoulder = torsoRX * Math.sqrt(Math.max(0, 1 - dyNorm * dyNorm));
  
  const shoulderLeftCx = torsoCx - torsoWidthAtShoulder - shoulderRadius;
  const shoulderRightCx = torsoCx + torsoWidthAtShoulder + shoulderRadius;

  // --- Ключицы и Трапеции ---
  const neckBaseY = neckBotY - (headStep * 0.1 * (1 - trapYParam)); 
  const neckBaseLeftX = neckCx - neckHalfW;
  const neckBaseRightX = neckCx + neckHalfW;

  const trapLeftAttach = { x: shoulderLeftCx + shoulderRadius * 0.2, y: shoulderCy - shoulderRadius };
  const trapRightAttach = { x: shoulderRightCx - shoulderRadius * 0.2, y: shoulderCy - shoulderRadius };

  const clavLeftAttach = { x: shoulderLeftCx + shoulderRadius * 0.9, y: shoulderCy - shoulderRadius * clavYParam };
  const clavRightAttach = { x: shoulderRightCx - shoulderRadius * 0.9, y: shoulderCy - shoulderRadius * clavYParam };

  const clavTorsoAttachY = torsoTopActualY + torsoRY * 0.2;

  // --- Таз ---
  const torsoWidth = torsoRX * 2;
  const torsoHeight = torsoRY * 2;

  const pelvisW = torsoHeight; 
  const pelvisH = torsoWidth;  
  
  const pelvisR = parseFloat(ui.pelvisR.value) || 0.85;
  const pelvisX = parseFloat(ui.pelvisX.value) || 0;
  
  const pelvisTopY = torsoBottomY;
  const pelvisCx = torsoCx + pelvisX * pelvisW; 
  
  const pelvisXPos = pelvisCx - pelvisW / 2;
  const pelvisYPos = pelvisTopY;
  
  const maxRadius = Math.min(pelvisW, pelvisH) / 2;
  const cornerRadius = maxRadius * pelvisR;

  // ============================================
  // ПУПОК
  // ============================================
  const totalTorsoPelvisH = (pelvisYPos + pelvisH) - torsoTopActualY;
  const navelThird = totalTorsoPelvisH / 3;
  
  let navelCenterY = torsoTopActualY + navelThird * 2;
  navelCenterY += (parseFloat(ui.navelY.value) || 0) * totalTorsoPelvisH;
  
  const navelType = parseFloat(ui.navelType.value) || 0; 
  const navelLineW = (parseFloat(ui.navelW.value) || 0.2) * torsoRX * navelType; 
  const navelLineH = (parseFloat(ui.navelH.value) || 0.2) * torsoRY * navelType; 

  // ============================================
  // ЛИНИИ БЕДЕР
  // ============================================
  const pelvisBottomY = pelvisYPos + pelvisH;
  const hipGapParam = parseFloat(ui.hipGap.value) || 0.5;
  const hipGapWParam = parseFloat(ui.hipGapW.value) || 0.2; 
  
  const hipGapCenterX = pelvisXPos + pelvisW * hipGapParam; 
  const hipGapWidth = pelvisW * hipGapWParam;
  
  const hipGapLeftPoint = { x: hipGapCenterX - hipGapWidth / 2, y: pelvisBottomY };
  const hipGapRightPoint = { x: hipGapCenterX + hipGapWidth / 2, y: pelvisBottomY };

  const hipTopYParam = parseFloat(ui.hipTopY.value) || 0;
  const hipTopOffsetY = hipTopYParam * pelvisH;
  
  const hipTopLeftPoint = { x: pelvisXPos + cornerRadius * 0.5, y: pelvisYPos + hipTopOffsetY };
  const hipTopRightPoint = { x: pelvisXPos + pelvisW - cornerRadius * 0.5, y: pelvisYPos + hipTopOffsetY };

  const hipMidYParam = parseFloat(ui.hipMidY.value) || 0.5;
  const hipMidLeftPoint = { x: pelvisXPos, y: pelvisYPos + pelvisH * hipMidYParam };
  const hipMidRightPoint = { x: pelvisXPos + pelvisW, y: pelvisYPos + pelvisH * hipMidYParam };

  // ============================================
  // РУКИ
  // ============================================
  const showArms = ui.showArms.checked;
  const wristRParam  = parseFloat(ui.wristR.value)  || 0.12;
  const armLwMul     = parseFloat(ui.armLw.value)   || 1.0;

  const wristRadius = Math.max(1, pelvisH * wristRParam);

  const lWristXParam = parseFloat(ui.lWristX.value) || 0;
  const lWristYParam = parseFloat(ui.lWristY.value) || 0;
  const rWristXParam = parseFloat(ui.rWristX.value) || 0;
  const rWristYParam = parseFloat(ui.rWristY.value) || 0;

  const lShoulderAngle = parseFloat(ui.lShoulderAngle.value) || 0;
  const lElbowAngle    = parseFloat(ui.lElbowAngle.value)    || 0;
  const rShoulderAngle = parseFloat(ui.rShoulderAngle.value) || 0;
  const rElbowAngle    = parseFloat(ui.rElbowAngle.value)    || 0;

  const lWristBaseX = pelvisXPos - wristRadius + lWristXParam * pelvisW;
  const lWristBaseY = pelvisBottomY - wristRadius + lWristYParam * pelvisH;
  const rWristBaseX = pelvisXPos + pelvisW + wristRadius + rWristXParam * pelvisW;
  const rWristBaseY = pelvisBottomY - wristRadius + rWristYParam * pelvisH;

  const shoulderL = { x: shoulderLeftCx, y: shoulderCy };
  const shoulderR = { x: shoulderRightCx, y: shoulderCy };
  const wristLBase = { x: lWristBaseX, y: lWristBaseY };
  const wristRBase = { x: rWristBaseX, y: rWristBaseY };

  const armL = buildArm(shoulderL, wristLBase, -lShoulderAngle, -lElbowAngle, wristRadius);
  const armR = buildArm(shoulderR, wristRBase,  rShoulderAngle,  rElbowAngle, wristRadius);

  const crossPosParam = parseFloat(ui.crossPos.value) || 0.33;
  const crossWParam   = parseFloat(ui.crossW.value) || 1.5;
  const crossRoundParam = parseFloat(ui.crossRound.value) || 0.5; 

  // ============================================
  // НОГИ
  // ============================================
  const showLegs = ui.showLegs.checked;
  const thighWParam = parseFloat(ui.thighW.value) || 1.0;
  const calfWParam = parseFloat(ui.calfW.value) || 1.0;
  const calfConcaveParam = parseFloat(ui.calfConcave.value) || 0.5;
  
  const kneeBallRadius = shoulderRadius * 1.1;
  const ankleBallRadius = wristRadius * 0.8;

  const lThighXParam = parseFloat(ui.lThighX.value) || 0;
  const lFootXParam = parseFloat(ui.lFootX.value) || 0;
  const lFootYParam = parseFloat(ui.lFootY.value) || 0;
  
  const rThighXParam = parseFloat(ui.rThighX.value) || 0;
  const rFootXParam = parseFloat(ui.rFootX.value) || 0;
  const rFootYParam = parseFloat(ui.rFootY.value) || 0;

  const hipLeftJoint = { x: pelvisXPos + pelvisW * 0.25 + lThighXParam * pelvisW, y: pelvisBottomY };
  const hipRightJoint = { x: pelvisXPos + pelvisW * 0.75 + rThighXParam * pelvisW, y: pelvisBottomY };

  const ankleLeftJoint = { x: pelvisXPos + pelvisW * 0.25 + lFootXParam * pelvisW, y: pelvisBottomY + H * 0.25 + lFootYParam * pelvisH };
  const ankleRightJoint = { x: pelvisXPos + pelvisW * 0.75 + rFootXParam * pelvisW, y: pelvisBottomY + H * 0.25 + rFootYParam * pelvisH };

  const legL = buildLeg(hipLeftJoint, ankleLeftJoint, 0, thighWParam, kneeBallRadius, ankleBallRadius);
  const legR = buildLeg(hipRightJoint, ankleRightJoint, 0, thighWParam, kneeBallRadius, ankleBallRadius);

  // ============================================
  // ПОДСЕКЦИИ
  // ============================================
  if (ui.showSub.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100,150,255,0.8)'; 
    ctx.lineWidth = 2; 
    ctx.setLineDash([10, 15]);

    const headTopSubY = skullTop;
    const headBotSubY = chinCenterY;
    const headSubCount = 5;
    const headSubStep = (headBotSubY - headTopSubY) / headSubCount;
    ctx.beginPath();
    for (let i = 1; i < headSubCount; i++) {
      const y = headTopSubY + headSubStep * i;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    const torsoTopSubY = torsoTopActualY;
    const torsoBotSubY = torsoBottomY;
    const torsoSubCount = 3;
    const torsoSubStepDraw = (torsoBotSubY - torsoTopSubY) / torsoSubCount;
    ctx.beginPath();
    for (let i = 1; i < torsoSubCount; i++) {
      const y = torsoTopSubY + torsoSubStepDraw * i;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    const pelvisTopSubY = pelvisYPos;
    const pelvisBotSubY = pelvisYPos + pelvisH;
    const pelvisSubCount = 2;
    const pelvisSubStep = (pelvisBotSubY - pelvisTopSubY) / pelvisSubCount;
    ctx.beginPath();
    for (let i = 1; i < pelvisSubCount; i++) {
      const y = pelvisTopSubY + pelvisSubStep * i;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    ctx.restore();
  }

  // ============================================
  // ФИГУРЫ
  // ============================================
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // 1. Плечи
  ctx.beginPath();
  ctx.arc(shoulderLeftCx, shoulderCy, shoulderRadius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(shoulderRightCx, shoulderCy, shoulderRadius, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Трапеции
  ctx.beginPath();
  ctx.moveTo(trapLeftAttach.x, trapLeftAttach.y);
  ctx.lineTo(neckBaseLeftX, neckBaseY);
  ctx.moveTo(trapRightAttach.x, trapRightAttach.y);
  ctx.lineTo(neckBaseRightX, neckBaseY);
  ctx.stroke();

  // 3. Ключицы
  ctx.beginPath();
  ctx.moveTo(clavLeftAttach.x, clavLeftAttach.y);
  ctx.lineTo(torsoCx, clavTorsoAttachY);
  ctx.moveTo(clavRightAttach.x, clavRightAttach.y);
  ctx.lineTo(torsoCx, clavTorsoAttachY);
  ctx.stroke();

  // 4. Торс
  ctx.beginPath();
  ctx.moveTo(torsoCx, torsoCenterY - torsoRY);
  ctx.bezierCurveTo(torsoCx + torsoRX * tTop, torsoCenterY - torsoRY, torsoCx + torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx + torsoRX, torsoCenterY);
  ctx.bezierCurveTo(torsoCx + torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx + torsoRX * tBot, torsoCenterY + torsoRY, torsoCx, torsoCenterY + torsoRY);
  ctx.bezierCurveTo(torsoCx - torsoRX * tBot, torsoCenterY + torsoRY, torsoCx - torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx - torsoRX, torsoCenterY);
  ctx.bezierCurveTo(torsoCx - torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx - torsoRX * tTop, torsoCenterY - torsoRY, torsoCx, torsoCenterY - torsoRY);
  ctx.stroke();

  // 5. Таз
  ctx.beginPath();
  ctx.moveTo(pelvisXPos + cornerRadius, pelvisYPos);
  ctx.lineTo(pelvisXPos + pelvisW - cornerRadius, pelvisYPos);
  ctx.quadraticCurveTo(pelvisXPos + pelvisW, pelvisYPos, pelvisXPos + pelvisW, pelvisYPos + cornerRadius);
  ctx.lineTo(pelvisXPos + pelvisW, pelvisYPos + pelvisH - cornerRadius);
  ctx.quadraticCurveTo(pelvisXPos + pelvisW, pelvisYPos + pelvisH, pelvisXPos + pelvisW - cornerRadius, pelvisYPos + pelvisH);
  ctx.lineTo(pelvisXPos + cornerRadius, pelvisYPos + pelvisH);
  ctx.quadraticCurveTo(pelvisXPos, pelvisYPos + pelvisH, pelvisXPos, pelvisYPos + pelvisH - cornerRadius);
  ctx.lineTo(pelvisXPos, pelvisYPos + cornerRadius);
  ctx.quadraticCurveTo(pelvisXPos, pelvisYPos, pelvisXPos + cornerRadius, pelvisYPos);
  ctx.stroke();

  // 6. Линии бедер
  if (ui.showHipLines.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,100,100,0.8)'; 
    ctx.lineWidth = Math.max(1, lw * 0.6); 

    const bottomStep = pelvisW / 5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    for (let i = 1; i < 5; i++) {
      const x = pelvisXPos + bottomStep * i;
      ctx.moveTo(x, pelvisBottomY - 15);
      ctx.lineTo(x, pelvisBottomY + 15);
    }
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(hipGapLeftPoint.x, hipGapLeftPoint.y);
    ctx.lineTo(hipTopLeftPoint.x, hipTopLeftPoint.y);
    ctx.moveTo(hipGapRightPoint.x, hipGapRightPoint.y);
    ctx.lineTo(hipTopRightPoint.x, hipTopRightPoint.y);
    ctx.stroke();

    ctx.setLineDash([10, 5]);
    ctx.beginPath();
    ctx.moveTo(hipGapLeftPoint.x, hipGapLeftPoint.y);
    ctx.lineTo(hipMidLeftPoint.x, hipMidLeftPoint.y);
    ctx.moveTo(hipGapRightPoint.x, hipGapRightPoint.y);
    ctx.lineTo(hipMidRightPoint.x, hipMidRightPoint.y);
    ctx.stroke();

    ctx.restore();
  }

  // 7. Линии пресса
  if (ui.showAbsLines.checked) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(torsoCx, torsoCenterY - torsoRY);
    ctx.bezierCurveTo(torsoCx + torsoRX * tTop, torsoCenterY - torsoRY, torsoCx + torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx + torsoRX, torsoCenterY);
    ctx.bezierCurveTo(torsoCx + torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx + torsoRX * tBot, torsoCenterY + torsoRY, torsoCx, torsoCenterY + torsoRY);
    ctx.bezierCurveTo(torsoCx - torsoRX * tBot, torsoCenterY + torsoRY, torsoCx - torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx - torsoRX, torsoCenterY);
    ctx.bezierCurveTo(torsoCx - torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx - torsoRX * tTop, torsoCenterY - torsoRY, torsoCx, torsoCenterY - torsoRY);
    ctx.closePath();
    ctx.clip();

    const absBendParam = parseFloat(ui.absBend.value) || 0.3;
    
    ctx.beginPath();
    ctx.moveTo(torsoCx, navelCenterY);
    const ctrlLeftX = torsoCx - (torsoCx - trapLeftAttach.x) * absBendParam;
    const ctrlLeftY = navelCenterY - (navelCenterY - trapLeftAttach.y) * 0.5;
    ctx.quadraticCurveTo(ctrlLeftX, ctrlLeftY, trapLeftAttach.x, trapLeftAttach.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(torsoCx, navelCenterY);
    const ctrlRightX = torsoCx + (trapRightAttach.x - torsoCx) * absBendParam;
    const ctrlRightY = navelCenterY - (navelCenterY - trapRightAttach.y) * 0.5;
    ctx.quadraticCurveTo(ctrlRightX, ctrlRightY, trapRightAttach.x, trapRightAttach.y);
    ctx.stroke();
    
    ctx.restore();
  }

  // 8. Пупок
  if (ui.showNavel.checked) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lw;

    if (navelType < 0.05) {
      ctx.beginPath();
      ctx.arc(torsoCx, navelCenterY, Math.max(3, lw * 1.5), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.ellipse(torsoCx, navelCenterY, Math.max(1, navelLineW / 2), Math.max(1, navelLineH / 2), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 9. Шея
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, neckBotY); 
  ctx.ellipse(headCx, cy, rX, rY, 0, 0, Math.PI * 2);
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  if (chinHalfW < 1.5) {
    ctx.lineTo(headCx, chinCenterY);
    ctx.lineTo(cornerRight.x, cornerRight.y);
  } else {
    ctx.lineTo(chinLeft.x, chinLeft.y);
    ctx.lineTo(chinRight.x, chinRight.y);
    ctx.lineTo(cornerRight.x, cornerRight.y);
  }
  ctx.lineTo(attachRight.x, attachRight.y);
  ctx.closePath();
  ctx.clip('evenodd');

  ctx.beginPath();
  ctx.moveTo(neckCx - neckHalfW, neckTopY);
  ctx.lineTo(neckCx - neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckTopY);
  ctx.stroke();
  ctx.restore(); 

  // 10. Голова
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw;

  ctx.beginPath(); ctx.ellipse(headCx, cy, rX, rY, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  ctx.lineTo(chinHalfW < 1.5 ? headCx : chinLeft.x, chinHalfW < 1.5 ? chinCenterY : chinLeft.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachRight.x, attachRight.y);
  ctx.lineTo(cornerRight.x, cornerRight.y);
  ctx.lineTo(chinHalfW < 1.5 ? headCx : chinRight.x, chinHalfW < 1.5 ? chinCenterY : chinRight.y);
  ctx.stroke();

  if (chinHalfW < 1.5) {
    ctx.beginPath(); ctx.arc(headCx, chinCenterY, Math.max(3, lw), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(chinLeft.x, chinLeft.y);
    if (chinRound < 1) ctx.lineTo(chinRight.x, chinRight.y);
    else ctx.quadraticCurveTo(headCx, chinCenterY + (chinRound / chinHalfW) * chinHalfW * 0.8, chinRight.x, chinRight.y);
    ctx.stroke();
  }
  ctx.restore();

  // 11. РУКИ
  if (showArms) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, lw * armLwMul);
    ctx.setLineDash([]);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const drawArm = (arm, isLeft) => {
      const { shoulder, elbow, wrist, ballRadius: br } = arm;
      const innerSign = isLeft ? 1 : -1;

      // Плечо
      const dx1 = elbow.x - shoulder.x;
      const dy1 = elbow.y - shoulder.y;
      const len1 = Math.hypot(dx1, dy1) || 1;
      const nx1 = -dy1 / len1;
      const ny1 =  dx1 / len1;

      const p1Outer = { x: shoulder.x + nx1 * innerSign * shoulderRadius, y: shoulder.y + ny1 * innerSign * shoulderRadius };
      const p1Inner = { x: shoulder.x - nx1 * innerSign * shoulderRadius, y: shoulder.y - ny1 * innerSign * shoulderRadius };
      
      const p2Outer = { x: elbow.x + nx1 * innerSign * br, y: elbow.y + ny1 * innerSign * br };
      const p2Inner = { x: elbow.x - nx1 * innerSign * br, y: elbow.y - ny1 * innerSign * br };

      ctx.beginPath(); ctx.moveTo(p1Outer.x, p1Outer.y); ctx.lineTo(p2Outer.x, p2Outer.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p1Inner.x, p1Inner.y); ctx.lineTo(p2Inner.x, p2Inner.y); ctx.stroke();

      // Предплечье
      const dx2 = wrist.x - elbow.x;
      const dy2 = wrist.y - elbow.y;
      const len2 = Math.hypot(dx2, dy2) || 1;
      
      const ux = dx2 / len2;
      const uy = dy2 / len2;
      
      const px = -uy;
      const py =  ux;

      const peakT = crossPosParam; 
      const peakX = elbow.x + dx2 * peakT;
      const peakY = elbow.y + dy2 * peakT;
      
      const maxWidth = br * crossWParam;

      const elbowOuter = { x: elbow.x + px * innerSign * br, y: elbow.y + py * innerSign * br };
      const elbowInner = { x: elbow.x - px * innerSign * br, y: elbow.y - py * innerSign * br };
      
      const peakOuter = { x: peakX + px * innerSign * maxWidth, y: peakY + py * innerSign * maxWidth };
      const peakInner = { x: peakX - px * innerSign * maxWidth, y: peakY - py * innerSign * maxWidth };

      const wristOuter = { x: wrist.x + px * innerSign * br, y: wrist.y + py * innerSign * br };
      const wristInner = { x: wrist.x - px * innerSign * br, y: wrist.y - py * innerSign * br };

      ctx.beginPath();
      ctx.moveTo(elbowOuter.x, elbowOuter.y);
      ctx.quadraticCurveTo(
        elbow.x + dx2 * (peakT * 0.5) + px * innerSign * maxWidth * 0.8, 
        elbow.y + dy2 * (peakT * 0.5) + py * innerSign * maxWidth * 0.8, 
        peakOuter.x, peakOuter.y
      );
      ctx.quadraticCurveTo(
        peakX + dx2 * (1 - peakT) * 0.5 + px * innerSign * br * 1.1, 
        peakY + dy2 * (1 - peakT) * 0.5 + py * innerSign * br * 1.1,
        wristOuter.x, wristOuter.y
      );
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(elbowInner.x, elbowInner.y);
      ctx.quadraticCurveTo(
        elbow.x + dx2 * (peakT * 0.5) - px * innerSign * maxWidth * (1 - crossRoundParam * 0.5), 
        elbow.y + dy2 * (peakT * 0.5) - py * innerSign * maxWidth * (1 - crossRoundParam * 0.5), 
        peakInner.x, peakInner.y
      );
      ctx.quadraticCurveTo(
        peakX + dx2 * (1 - peakT) * 0.5 - px * innerSign * br * (1 - crossRoundParam), 
        peakY + dy2 * (1 - peakT) * 0.5 - py * innerSign * br * (1 - crossRoundParam),
        wristInner.x, wristInner.y
      );
      ctx.stroke();

      if (ui.showElbow.checked) {
        ctx.beginPath(); ctx.arc(elbow.x, elbow.y, Math.max(3, lw * 0.8), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      }
      if (ui.showElbowBall.checked) {
        ctx.beginPath(); ctx.arc(elbow.x, elbow.y, br, 0, Math.PI * 2); ctx.stroke();
      }
      if (ui.showWristBall.checked) {
        ctx.beginPath(); ctx.arc(wrist.x, wrist.y, br, 0, Math.PI * 2); ctx.stroke();
      }
    };

    drawArm(armL, true);
    drawArm(armR, false);

    ctx.restore();
  }

  // 12. НОГИ
  if (showLegs) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.setLineDash([]);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const drawLeg = (leg, isLeft) => {
      const { hip, knee, ankle } = leg;
      const innerSign = isLeft ? -1 : 1;

      const dxT = knee.x - hip.x;
      const dyT = knee.y - hip.y;
      const lenT = Math.hypot(dxT, dyT) || 1;
      
      const dxC = ankle.x - knee.x;
      const dyC = ankle.y - knee.y;
      const lenC = Math.hypot(dxC, dyC) || 1;

      const thighW = Math.max(1, shoulderRadius * 1.3 * thighWParam);
      const calfW = Math.max(1, wristRadius * 1.1 * calfWParam);

      const nxT = -dyT / lenT;
      const nyT =  dxT / lenT;

      const hipOuter = { x: hip.x + nxT * -innerSign * thighW, y: hip.y + nyT * -innerSign * thighW };
      const hipInner = { x: hip.x + nxT * innerSign * thighW, y: hip.y + nyT * innerSign * thighW };
      
      const kneeBallR = kneeBallRadius;
      const kneeInnerOffset = ui.showKneeInner.checked ? kneeBallR * 0.3 : 0;
      
      const kneeOuterPt = { x: knee.x - nxT * kneeBallR, y: knee.y - nyT * kneeBallR };
      const kneeInnerPt = { x: knee.x + nxT * kneeBallR + nxT * kneeInnerOffset, y: knee.y + nyT * kneeBallR + nyT * kneeInnerOffset };

      const dipT = 0.5;
      const hipDipInnerX = hip.x + dxT * dipT + nxT * innerSign * thighW * 0.85;
      const hipDipInnerY = hip.y + dyT * dipT + nyT * innerSign * thighW * 0.85;
      
      if (ui.showKneeInner.checked) {
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = Math.max(1, lw * 0.6);
        ctx.beginPath();
        ctx.moveTo(kneeInnerPt.x, kneeInnerPt.y);
        ctx.lineTo(hipDipInnerX, hipDipInnerY);
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.moveTo(hipOuter.x, hipOuter.y);
      ctx.quadraticCurveTo(
        hip.x + dxT * 0.5 - nxT * innerSign * thighW * 0.9, 
        hip.y + dyT * 0.5 - nyT * innerSign * thighW * 0.9, 
        kneeOuterPt.x, kneeOuterPt.y
      );
      
      const calfOuterW = calfW; 
      const ankleOuterPt = { x: ankle.x - nxT * ankleBallRadius, y: ankle.y - nyT * ankleBallRadius };

      ctx.quadraticCurveTo(
        knee.x + dxC * 0.33 - nxT * innerSign * calfOuterW, 
        knee.y + dyC * 0.33 - nyT * innerSign * calfOuterW, 
        ankleOuterPt.x, ankleOuterPt.y
      );
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(hipInner.x, hipInner.y);
      ctx.quadraticCurveTo(
        hipDipInnerX, hipDipInnerY,
        kneeInnerPt.x, kneeInnerPt.y
      );

      const calfInnerW = calfW * (1 - calfConcaveParam * 0.6);
      const ankleInnerPt = { x: ankle.x + nxT * ankleBallRadius, y: ankle.y + nyT * ankleBallRadius };

      ctx.quadraticCurveTo(
        knee.x + dxC * 0.33 + nxT * innerSign * calfInnerW * 0.5, 
        knee.y + dyC * 0.33 + nyT * innerSign * calfInnerW * 0.5, 
        ankleInnerPt.x, ankleInnerPt.y
      );
      ctx.stroke();

      ctx.save();
      ctx.lineWidth = Math.max(1, lw * 0.6);
      ctx.beginPath();
      ctx.moveTo(knee.x + nxT * kneeBallR * 0.5, knee.y + nyT * kneeBallR * 0.5);
      ctx.quadraticCurveTo(
        knee.x + dxC * 0.1 - nxT * kneeBallR * 0.3, 
        knee.y + dyC * 0.1 - nyT * kneeBallR * 0.3, 
        knee.x - nxT * kneeBallR * 0.5, knee.y - nyT * kneeBallR * 0.5
      );
      ctx.stroke();
      ctx.restore();

      if (ui.showKneeBall.checked) {
        ctx.beginPath(); ctx.arc(knee.x, knee.y, kneeBallR, 0, Math.PI * 2); ctx.stroke();
      }
      if (ui.showAnkleBall.checked) {
        ctx.beginPath(); ctx.arc(ankle.x, ankle.y, ankleBallRadius, 0, Math.PI * 2); ctx.stroke();
      }
    };

    drawLeg(legL, true);
    drawLeg(legR, false);

    ctx.restore();
  }

  ctx.restore(); 
  updateLabels();
}

function updateLabels() {
  vals.vRefOp.textContent  = parseFloat(ui.refOp.value).toFixed(2);
  vals.vHeads.textContent  = parseFloat(ui.heads.value).toFixed(1);
  vals.vWidth.textContent  = ui.lineWidth.value;
  vals.vSkullH.textContent = parseFloat(ui.skullH.value).toFixed(2);
  vals.vSkullW.textContent = parseFloat(ui.skullW.value).toFixed(2);
  vals.vSkullX.textContent = parseFloat(ui.skullX.value).toFixed(2);
  vals.vChinY.textContent  = parseFloat(ui.chinY.value).toFixed(2);
  vals.vChinW.textContent  = parseFloat(ui.chinW.value).toFixed(2);
  vals.vChinR.textContent  = parseFloat(ui.chinR.value).toFixed(2);
  vals.vJawY.textContent   = parseFloat(ui.jawY.value).toFixed(2);
  vals.vJawW.textContent   = parseFloat(ui.jawW.value).toFixed(2);
  vals.vJawB.textContent   = parseFloat(ui.jawB.value).toFixed(2);
  vals.vNeckW.textContent  = parseFloat(ui.neckW.value).toFixed(2);
  vals.vNeckX.textContent  = parseFloat(ui.neckX.value).toFixed(2);
  vals.vTorsoH.textContent = parseFloat(ui.torsoH.value).toFixed(2);
  vals.vTorsoW.textContent = parseFloat(ui.torsoW.value).toFixed(2);
  vals.vTorsoX.textContent = parseFloat(ui.torsoX.value).toFixed(2);
  vals.vTorsoTop.textContent = parseFloat(ui.torsoTop.value).toFixed(2);
  vals.vTorsoBot.textContent = parseFloat(ui.torsoBot.value).toFixed(2);
  vals.vShoulderY.textContent = parseFloat(ui.shoulderY.value).toFixed(2);
  vals.vClavY.textContent = parseFloat(ui.clavY.value).toFixed(2);
  vals.vTrapY.textContent = parseFloat(ui.trapY.value).toFixed(2);
  vals.vPelvisR.textContent = parseFloat(ui.pelvisR.value).toFixed(2);
  vals.vPelvisX.textContent = parseFloat(ui.pelvisX.value).toFixed(2);
  vals.vHipGap.textContent = parseFloat(ui.hipGap.value).toFixed(2);
  vals.vHipGapW.textContent = parseFloat(ui.hipGapW.value).toFixed(2);
  vals.vHipTopY.textContent = parseFloat(ui.hipTopY.value).toFixed(2);
  vals.vHipMidY.textContent = parseFloat(ui.hipMidY.value).toFixed(2);
  vals.vAbsBend.textContent = parseFloat(ui.absBend.value).toFixed(2);
  vals.vNavelType.textContent = parseFloat(ui.navelType.value).toFixed(2);
  vals.vNavelW.textContent = parseFloat(ui.navelW.value).toFixed(2);
  vals.vNavelH.textContent = parseFloat(ui.navelH.value).toFixed(2);
  vals.vNavelY.textContent = parseFloat(ui.navelY.value).toFixed(2);
  
  vals.vWristR.textContent = parseFloat(ui.wristR.value).toFixed(2);
  vals.vArmLw.textContent = parseFloat(ui.armLw.value).toFixed(1);
  vals.vCrossPos.textContent = parseFloat(ui.crossPos.value).toFixed(2);
  vals.vCrossW.textContent = parseFloat(ui.crossW.value).toFixed(2);
  vals.vCrossRound.textContent = parseFloat(ui.crossRound.value).toFixed(2);
  
  vals.vLShoulderAngle.textContent = parseFloat(ui.lShoulderAngle.value).toFixed(2);
  vals.vLElbowAngle.textContent = parseFloat(ui.lElbowAngle.value).toFixed(2);
  vals.vLWristX.textContent = parseFloat(ui.lWristX.value).toFixed(2);
  vals.vLWristY.textContent = parseFloat(ui.lWristY.value).toFixed(2);
  vals.vRShoulderAngle.textContent = parseFloat(ui.rShoulderAngle.value).toFixed(2);
  vals.vRElbowAngle.textContent = parseFloat(ui.rElbowAngle.value).toFixed(2);
  vals.vRWristX.textContent = parseFloat(ui.rWristX.value).toFixed(2);
  vals.vRWristY.textContent = parseFloat(ui.rWristY.value).toFixed(2);

  vals.vThighW.textContent = parseFloat(ui.thighW.value).toFixed(2);
  vals.vCalfW.textContent = parseFloat(ui.calfW.value).toFixed(2);
  vals.vCalfConcave.textContent = parseFloat(ui.calfConcave.value).toFixed(2);
  vals.vLThighX.textContent = parseFloat(ui.lThighX.value).toFixed(2);
  vals.vLFootX.textContent = parseFloat(ui.lFootX.value).toFixed(2);
  vals.vLFootY.textContent = parseFloat(ui.lFootY.value).toFixed(2);
  vals.vRThighX.textContent = parseFloat(ui.rThighX.value).toFixed(2);
  vals.vRFootX.textContent = parseFloat(ui.rFootX.value).toFixed(2);
  vals.vRFootY.textContent = parseFloat(ui.rFootY.value).toFixed(2);
}

Object.values(ui).forEach(el => { 
  if(el) {
    el.addEventListener('input', draw); 
    el.addEventListener('change', draw); 
  }
});

  ui.torsoTop.value = 0.60; ui.torsoBot.value = 0.80;
  ui.shoulderY.value = 0.00; ui.clavY.value = 0.80; ui.trapY.value = 0.50;
  ui.pelvisR.value = 0.85; ui.pelvisX.value = 0.00;
  ui.hipGap.value = 0.50; ui.hipGapW.value = 0.20; ui.hipTopY.value = 0.00; ui.hipMidY.value = 0.50;

  ui.showLegs.checked = true;

  ui.lThighX.value = -0.20; ui.lFootX.value = -0.30; ui.lFootY.value = 0.50;
  ui.rThighX.value = 0.20; ui.rFootX.value = 0.30; ui.rFootY.value = 0.50;

  draw();
});
