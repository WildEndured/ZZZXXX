<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Холст с зумом и разметкой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SVG Холст</h1>
        
        <!-- Обертка для зума (не дает SVG вылезти за края) -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <!-- Внутренний контейнер, который мы будем зумить -->
            <div class="zoom-container" id="zoomContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                    <rect id="bgRect" x="0" y="0" width="1" height="1" fill="#ffffff"/>
                    <g id="measureLayer"></g>
                    <g id="drawLayer" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <button id="clearBtn">Очистить рисунок</button>
            <button id="downloadSvgBtn">Скачать SVG</button>
            <button id="downloadPngBtn">Скачать PNG (4096×4096)</button>
            <button id="resetZoomBtn">Сбросить зум</button>
            
            <label>
                Фон:
                <input type="color" id="bgColor" value="#ffffff">
            </label>
            <label>
                Цвет:
                <input type="color" id="brushColor" value="#000000">
            </label>
            <label>
                Толщина:
                <input type="range" id="brushSize" min="1" max="100" value="10">
                <span id="brushSizeValue">10</span>
            </label>
            <label>
                <input type="checkbox" id="eraserMode"> Ластик
            </label>
            
            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <label>
                Отступ (0-10%):
                <input type="range" id="paddingSize" min="0" max="10" value="0">
                <span id="paddingSizeValue">0%</span>
            </label>
            <label>
                Рост (головы):
                <input type="range" id="headCount" min="2" max="8" value="4">
                <span id="headCountValue">4</span>
            </label>
            <label>
                <input type="checkbox" id="showGrid" checked> Показывать разметку
            </label>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
