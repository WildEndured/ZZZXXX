<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Голова</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SVG Холст</h1>
        
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="zoom-container" id="zoomContainer">
                <div id="bgColorLayer" class="layer bg-color-layer" style="background-color: #ffffff;"></div>
                <img id="bgImage" class="layer bg-image-layer" style="display: none;" alt="Подложка" draggable="false">
                
                <svg id="mainSvg" class="layer draw-svg-layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                    <g id="measureLayer"></g>
                    <!-- НОВЫЙ СЛОЙ ДЛЯ ГОЛОВЫ -->
                    <g id="headLayer"></g>
                    <g id="drawLayer" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="clearBtn">Очистить</button>
                <button id="downloadSvgBtn">Скачать SVG</button>
                <button id="downloadPngBtn">Скачать PNG</button>
                <button id="resetZoomBtn">Сбросить зум</button>
            </div>

            <div class="control-group">
                <label class="file-label">
                    Загрузить подложку
                    <input type="file" id="uploadBg" accept="image/*">
                </label>
                <button id="removeBgBtn" style="background: #d94a4a; display: none;">Удалить подложку</button>
            </div>

            <div class="control-group" id="bgControls" style="display: none;">
                <label>Прозрачность: <input type="range" id="bgOpacity" min="0" max="100" value="100"><span id="bgOpacityValue">100%</span></label>
                <label>Масштаб: <input type="range" id="bgScale" min="10" max="300" value="100"><span id="bgScaleValue">100%</span></label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>Цвет фона: <input type="color" id="bgColor" value="#ffffff"></label>
                <label>Цвет кисти: <input type="color" id="brushColor" value="#000000"></label>
                <label>Толщина: <input type="range" id="brushSize" min="1" max="100" value="10"><span id="brushSizeValue">10</span></label>
                <label><input type="checkbox" id="eraserMode"> Ластик</label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>Отступ: <input type="range" id="paddingSize" min="0" max="10" value="0"><span id="paddingSizeValue">0%</span></label>
                <label>Головы: <input type="range" id="headCount" min="2" max="8" value="4"><span id="headCountValue">4</span></label>
                <label><input type="checkbox" id="showGrid" checked> Разметка</label>
            </div>

            <!-- УПРАВЛЕНИЕ ГОЛОВОЙ -->
            <fieldset style="border: 1px solid #444; padding: 10px; border-radius: 6px; margin-top: 10px;">
                <legend><input type="checkbox" id="showHead" checked> Голова (болванка)</legend>
                <div class="control-group">
                    <label>Ширина: <input type="range" id="headWidth" min="10" max="100" value="30"><span id="headWidthValue">30</span></label>
                    <label>Высота: <input type="range" id="headHeight" min="10" max="100" value="40"><span id="headHeightValue">40</span></label>
                </div>
                <div class="control-group" style="margin-top: 10px;">
                    <label>Подбородок: <input type="range" id="chinWidth" min="10" max="100" value="20"><span id="chinWidthValue">20</span></label>
                    <label>Сдвиг Y: <input type="range" id="chinY" min="-20" max="20" value="0"><span id="chinYValue">0</span></label>
                </div>
            </fieldset>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
