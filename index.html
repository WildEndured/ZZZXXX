<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Анекорды — конструктор пропорций</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ХОЛСТ -->
    <main class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 4096 4096" preserveAspectRatio="xMidYMid meet">
          <defs>
            <clipPath id="canvasClip">
              <rect x="0" y="0" width="4096" height="4096"/>
            </clipPath>
          </defs>

          <!-- Подложка (не попадает в экспорт) -->
          <g id="backdropLayer" clip-path="url(#canvasClip)">
            <image id="backdropImage" href="" x="0" y="0" width="4096" height="4096"
                   preserveAspectRatio="xMidYMid meet" opacity="0.5"
                   style="display:none; pointer-events:none;"/>
          </g>

          <!-- Сетка (не попадает в экспорт) -->
          <g id="gridLayer" clip-path="url(#canvasClip)"></g>

          <!-- Фигура -->
          <g id="figureLayer" clip-path="url(#canvasClip)"></g>
        </svg>
      </div>
    </main>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <aside class="panel" id="panel">
      <div class="panel-inner">

        <!-- ОБЩЕЕ -->
        <section class="group">
          <h2>Общее</h2>

          <label class="row">
            <span>Рост в головах</span>
            <output id="headsCountVal">5.0</output>
          </label>
          <input type="range" id="headsCount" min="1" max="12" step="0.5" value="5">

          <label class="row">
            <span>Отступ сверху/снизу</span>
            <output id="marginVal">0%</output>
          </label>
          <input type="range" id="margin" min="0" max="10" step="0.5" value="0">

          <label class="row">
            <span>Толщина линий</span>
            <output id="strokeWidthVal">6</output>
          </label>
          <input type="range" id="strokeWidth" min="1" max="30" step="1" value="6">

          <label class="row">
            <span>Цвет линий</span>
            <input type="color" id="strokeColor" value="#000000">
          </label>
        </section>

        <!-- ПОДЛОЖКА -->
        <section class="group">
          <h2>Подложка</h2>

          <label class="file-btn">
            <input type="file" id="backdropFile" accept="image/*" hidden>
            Загрузить изображение
          </label>

          <label class="row">
            <span>Прозрачность</span>
            <output id="backdropOpacityVal">50%</output>
          </label>
          <input type="range" id="backdropOpacity" min="0" max="100" step="1" value="50">

          <label class="row">
            <span>Масштаб</span>
            <output id="backdropScaleVal">100%</output>
          </label>
          <input type="range" id="backdropScale" min="10" max="300" step="1" value="100">

          <button class="btn danger" id="backdropRemove" disabled>Удалить подложку</button>
        </section>

        <!-- ПРЕСЕТЫ -->
        <section class="group">
          <h2>Пресеты</h2>

          <div class="preset-save">
            <input type="text" id="presetName" placeholder="Название пресета" maxlength="40">
            <button class="btn primary" id="presetSave">Сохранить</button>
          </div>

          <ul class="preset-list" id="presetList">
            <!-- заполняется из localStorage -->
          </ul>
        </section>

        <!-- ЭКСПОРТ -->
        <section class="group">
          <h2>Экспорт</h2>
          <div class="export-row">
            <button class="btn primary" id="exportSVG">SVG</button>
            <button class="btn primary" id="exportPNG">PNG</button>
          </div>
        </section>

      </div>
    </aside>
  </div>

  <script src="js/main.js" type="module"></script>
</body>
</html>
