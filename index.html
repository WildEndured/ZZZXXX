<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canvas Painter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Рабочая область -->
    <main id="workspace">
      <div id="viewport">
        <div id="zoomContainer">
          <div id="bgLayer"></div>
          <img id="overlayLayer" alt="">
          <svg id="drawLayer" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
            <g id="drawGroup"></g>
            <g id="gridGroup"></g>
          </svg>
        </div>
      </div>
    </main>

    <!-- Боковая панель -->
    <aside id="panel">
      <h1>Painter</h1>

      <section>
        <label>Подложка
          <input type="file" id="fileInput" accept="image/*">
        </label>
        <label>Масштаб подложки: <span id="scaleVal">100</span>%
          <input type="range" id="imgScale" min="10" max="300" value="100">
        </label>
        <label>Прозрачность подложки: <span id="opacityVal">100</span>%
          <input type="range" id="imgOpacity" min="0" max="100" value="100">
        </label>
        <label>Цвет фона
          <input type="color" id="bgColor" value="#ffffff">
        </label>
      </section>

      <section>
        <label>Отступ сетки: <span id="marginVal">0</span>%
          <input type="range" id="marginRange" min="0" max="10" value="0" step="0.5">
        </label>
        <label>Количество голов: <span id="headsVal">2</span>
          <input type="range" id="headsRange" min="2" max="8" value="2">
        </label>
      </section>

      <section id="headSection">
        <label>Ширина черепа: <span id="skullWVal">100</span>%
          <input type="range" id="skullW" min="30" max="100" value="100">
        </label>
        <label>Высота черепа: <span id="skullHVal">100</span>%
          <input type="range" id="skullH" min="30" max="130" value="100">
        </label>
        <label>Ширина подбородка: <span id="chinWVal">60</span>%
          <input type="range" id="chinW" min="10" max="150" value="60">
        </label>
        <label>Высота подбородка: <span id="chinHVal">80</span>%
          <input type="range" id="chinH" min="60" max="95" value="80">
        </label>
        <label>Высота крепления челюсти: <span id="jawAttachVal">70</span>%
          <input type="range" id="jawAttach" min="60" max="80" value="70" step="0.5">
        </label>
        <label>Ширина челюсти: <span id="jawWVal">60</span>%
          <input type="range" id="jawW" min="10" max="150" value="60">
        </label>
        <label>Скругление челюсти: <span id="jawRoundVal">30</span>%
          <input type="range" id="jawRound" min="0" max="100" value="30">
        </label>
      </section>

      <section>
        <label>Толщина кисти: <span id="brushVal">2</span>
          <input type="range" id="brushSize" min="1" max="20" value="2">
        </label>
        <label>Цвет кисти
          <input type="color" id="brushColor" value="#000000">
        </label>
      </section>

      <section class="row">
        <button id="undoBtn">Undo</button>
        <button id="clearBtn">Очистить</button>
      </section>

      <section class="row">
        <button id="exportSvg">Скачать SVG</button>
        <button id="exportPng">Скачать PNG</button>
      </section>
    </aside>
  </div>
  <script src="script.js"></script>
</body>
</html>
