<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анатомический конструктор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Панель управления -->
    <aside class="panel">
      <h1>Конструктор</h1>

      <section class="group">
        <h2>Общее</h2>

        <label>Рост в головах: <output id="outHeads">5</output></label>
        <input type="range" id="inpHeads" min="1" max="12" step="0.5" value="5">

        <label>Отступ сверху/снизу: <output id="outPad">0</output>%</label>
        <input type="range" id="inpPad" min="0" max="10" step="0.5" value="0">
      </section>

      <section class="group">
        <h2>Подложка</h2>
        <input type="file" id="inpImage" accept="image/*">
        <label>Прозрачность: <output id="outOpacity">100</output>%</label>
        <input type="range" id="inpOpacity" min="0" max="100" step="1" value="100">
        <label>Масштаб: <output id="outImgScale">100</output>%</label>
        <input type="range" id="inpImgScale" min="10" max="300" step="1" value="100">
        <button id="btnRemoveImage">Удалить подложку</button>
      </section>

      <section class="group">
        <h2>Пресеты</h2>
        <input type="text" id="inpPresetName" placeholder="Название пресета">
        <button id="btnSavePreset">Сохранить</button>
        <ul id="presetList"></ul>
      </section>

      <section class="group">
        <h2>Фигура</h2>
        <div id="figureControls"><!-- сюда модули добавят свои контролы --></div>
      </section>

      <section class="group">
        <h2>Экспорт</h2>
        <button id="btnExportSvg">SVG</button>
        <button id="btnExportPng">PNG</button>
      </section>
    </aside>

    <!-- Холст -->
    <main class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="stage"
             xmlns="http://www.w3.org/2000/svg"
             width="4096" height="4096"
             viewBox="0 0 4096 4096">
          <!-- слой подложки -->
          <g id="layerBackdrop"></g>
          <!-- слой построений (сетка голов) -->
          <g id="layerGuides"></g>
          <!-- слой фигуры (модули) -->
          <g id="layerFigure"></g>
        </svg>
      </div>
    </main>
  </div>

  <script src="js/head.js"></script>
  <script src="js/torso.js"></script>
  <script src="js/arm.js"></script>
  <script src="js/leg.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
