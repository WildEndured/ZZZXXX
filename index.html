<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SVG Редактор 4096x4096</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="viewportWrapper">
    <div id="viewport">
      <div id="stage">
        <div id="layerBg"></div>
        <div id="layerUnderlay">
          <img id="underlayImg" alt="" style="display:none">
        </div>
        <div id="layerDraw">
          <svg id="drawSvg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
            <!-- Слой с подсказками (не перехватывает клики) -->
            <g id="guideGroup" pointer-events="none"></g>
            <!-- Новая группа для круга головы -->
            <g id="headGuideGroup" pointer-events="none"></g>
            <!-- Слой с рисунком -->
            <g id="drawGroup"></g>
          </svg>
        </div>
      </div>
      <div id="zoomInfo">100%</div>
    </div>
  </div>
  
  <div id="sidebar">
    <h3>Подложка</h3>
    <button id="btnLoadImage" class="secondary">Загрузить картинку</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <div class="control">
      <label>Масштаб: <span id="underlayScaleVal">100</span>%</label>
      <input type="range" id="underlayScale" min="10" max="300" value="100">
    </div>
    <div class="control">
      <label>Прозрачность: <span id="underlayOpacityVal">100</span>%</label>
      <input type="range" id="underlayOpacity" min="0" max="100" value="100">
    </div>
    
    <h3>Фон</h3>
    <div class="control">
      <label>Цвет фона</label>
      <input type="color" id="bgColor" value="#ffffff">
    </div>
    
    <h3>Сетка "голов"</h3>
    <div class="control" style="flex-direction: row; align-items: center; gap: 8px; margin-bottom: 8px;">
      <input type="checkbox" id="showHeadCircle" style="width: 18px; height: 18px; cursor: pointer;">
      <label for="showHeadCircle" style="font-size: 13px; cursor: pointer; display: inline;">Разметка головы (5 частей)</label>
    </div>
    <div class="control">
      <label>Отступ: <span id="paddingVal">0</span>%</label>
      <input type="range" id="padding" min="0" max="10" value="0" step="0.5">
    </div>
    <div class="control">
      <label>Количество голов: <span id="headsVal">3</span></label>
      <input type="range" id="heads" min="2" max="8" value="3" step="1">
    </div>
    
    <h3>Инструменты</h3>
    <div class="control">
      <label>Толщина: <span id="brushSizeVal">4</span></label>
      <input type="range" id="brushSize" min="1" max="40" value="4">
    </div>
    <div class="control">
      <label>Цвет кисти</label>
      <input type="color" id="brushColor" value="#ff0000">
    </div>
    <button id="btnUndo" class="secondary">Отменить (Undo)</button>
    <button id="btnClear" class="danger">Очистить всё</button>
    
    <h3>Экспорт</h3>
    <button id="btnExportSVG">Скачать SVG</button>
    <button id="btnExportPNG">Скачать PNG (4096x4096)</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
