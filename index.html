<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Построение фигуры — Этап 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    
    <!-- Холст (теперь идет первым в разметке для мобилок) -->
    <main class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="svg"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 4096 4096"
             preserveAspectRatio="xMidYMid meet">
          <!-- подложка -->
          <image id="bgImage" x="0" y="0" width="4096" height="4096"
                 preserveAspectRatio="xMidYMid meet" style="display:none"></image>

          <!-- группа сетки -->
          <g id="gridLayer" fill="none" stroke="#d0d0d0" stroke-width="2"></g>

          <!-- группа фигуры -->
          <g id="figureLayer" fill="none"></g>
        </svg>
      </div>
    </main>

    <!-- Панель управления (теперь идет второй в разметке) -->
    <aside class="panel" id="panel">
      <h1 class="panel__title">Построение фигуры</h1>

      <!-- 1. Общее -->
      <section class="section">
        <h2 class="section__title">Общее</h2>
        <!-- ... остальной код панели без изменений ... -->
        <label class="field">
          <span class="field__label">
            Рост в головах
            <output class="field__value" id="headsOut">5</output>
          </span>
          <input type="range" id="headsRange" min="1" max="10" step="0.5" value="5">
        </label>

        <label class="field">
          <span class="field__label">
            Отступ сверху/снизу
            <output class="field__value" id="paddingOut">0%</output>
          </span>
          <input type="range" id="paddingRange" min="0" max="10" step="0.5" value="0">
        </label>

        <label class="field">
          <span class="field__label">
            Цвет контура
          </span>
          <input type="color" id="strokeColor" value="#222222">
        </label>

        <label class="field">
          <span class="field__label">
            Толщина контура
            <output class="field__value" id="strokeWidthOut">3</output>
          </span>
          <input type="range" id="strokeWidthRange" min="1" max="12" step="0.5" value="3">
        </label>
      </section>

      <!-- 2. Подложка -->
      <section class="section">
        <h2 class="section__title">Подложка</h2>
        <div class="file-btn-wrap">
          <input type="file" id="bgInput" accept="image/*" class="file-btn__input">
          <label for="bgInput" class="file-btn">Загрузить изображение</label>
        </div>
        <label class="field">
          <span class="field__label">
            Прозрачность
            <output class="field__value" id="bgOpacityOut">50%</output>
          </span>
          <input type="range" id="bgOpacityRange" min="0" max="100" step="1" value="50" disabled>
        </label>
        <label class="field">
          <span class="field__label">
            Масштаб
            <output class="field__value" id="bgScaleOut">100%</output>
          </span>
          <input type="range" id="bgScaleRange" min="10" max="300" step="1" value="100" disabled>
        </label>
        <button type="button" class="btn btn--danger" id="bgRemoveBtn" disabled>Удалить подложку</button>
      </section>

      <!-- 3. Пресеты -->
      <section class="section">
        <h2 class="section__title">Пресеты</h2>
        <div class="preset-save">
          <input type="text" id="presetName" placeholder="Название пресета" maxlength="40">
          <button type="button" class="btn" id="presetSaveBtn">Сохранить</button>
        </div>
        <ul class="preset-list" id="presetList">
          <li class="preset-list__empty">Пресетов пока нет</li>
        </ul>
      </section>

      <!-- 4. Экспорт -->
      <section class="section">
        <h2 class="section__title">Экспорт</h2>
        <div class="export-buttons">
          <button type="button" class="btn" id="exportSvgBtn">Экспорт SVG</button>
          <button type="button" class="btn" id="exportPngBtn">Экспорт PNG</button>
        </div>
      </section>
    </aside>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
