<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Холст с подложкой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SVG Холст</h1>
        
        <!-- Обертка для зума -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="zoom-container" id="zoomContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                    <!-- Фон -->
                    <rect id="bgRect" x="0" y="0" width="1" height="1" fill="#ffffff"/>
                    
                    <!-- Подложка (изображение) -->
                    <image id="bgImage" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid meet" style="display: none;" />
                    
                    <!-- Разметка -->
                    <g id="measureLayer"></g>
                    
                    <!-- Рисование -->
                    <g id="drawLayer" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="clearBtn">Очистить</button>
                <button id="downloadSvgBtn">Скачать SVG</button>
                <button id="downloadPngBtn">Скачать PNG</button>
                <button id="resetZoomBtn">Сбросить зум</button>
            </div>

            <div class="control-group">
                <label class="file-label">
                    Загрузить подложку
                    <input type="file" id="uploadBg" accept="image/*">
                </label>
                <button id="removeBgBtn" style="background: #d94a4a; display: none;">Удалить подложку</button>
            </div>

            <div class="control-group" id="bgControls" style="display: none;">
                <label>
                    Прозрачность:
                    <input type="range" id="bgOpacity" min="0" max="100" value="100">
                    <span id="bgOpacityValue">100%</span>
                </label>
                <label>
                    Масштаб:
                    <input type="range" id="bgScale" min="10" max="200" value="100">
                    <span id="bgScaleValue">100%</span>
                </label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>Фон: <input type="color" id="bgColor" value="#ffffff"></label>
                <label>Цвет: <input type="color" id="brushColor" value="#000000"></label>
                <label>
                    Толщина:
                    <input type="range" id="brushSize" min="1" max="100" value="10">
                    <span id="brushSizeValue">10</span>
                </label>
                <label><input type="checkbox" id="eraserMode"> Ластик</label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>
                    Отступ:
                    <input type="range" id="paddingSize" min="0" max="10" value="0">
                    <span id="paddingSizeValue">0%</span>
                </label>
                <label>
                    Головы:
                    <input type="range" id="headCount" min="2" max="8" value="4">
                    <span id="headCountValue">4</span>
                </label>
                <label><input type="checkbox" id="showGrid" checked> Разметка</label>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
