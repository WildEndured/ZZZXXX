<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Голова (Референс)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SVG Холст</h1>
        
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="zoom-container" id="zoomContainer">
                <div id="bgColorLayer" class="layer bg-color-layer" style="background-color: #ffffff;"></div>
                <img id="bgImage" class="layer bg-image-layer" style="display: none;" alt="Подложка" draggable="false">
                
                <svg id="mainSvg" class="layer draw-svg-layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                    <g id="measureLayer"></g>
                    <g id="headLayer"></g>
                    <g id="drawLayer" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="clearBtn">Очистить рисунок</button>
                <button id="downloadSvgBtn">Скачать SVG</button>
                <button id="downloadPngBtn">Скачать PNG</button>
                <button id="resetZoomBtn">Сбросить зум</button>
            </div>

            <div class="control-group">
                <label class="file-label">
                    Загрузить подложку
                    <input type="file" id="uploadBg" accept="image/*">
                </label>
                <button id="removeBgBtn" style="background: #d94a4a; display: none;">Удалить подложку</button>
            </div>

            <div class="control-group" id="bgControls" style="display: none;">
                <label>Прозрачность: <input type="range" id="bgOpacity" min="0" max="100" value="100"><span id="bgOpacityValue">100%</span></label>
                <label>Масштаб: <input type="range" id="bgScale" min="10" max="300" value="100"><span id="bgScaleValue">100%</span></label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>Фон: <input type="color" id="bgColor" value="#ffffff"></label>
                <label>Цвет линий: <input type="color" id="lineColor" value="#ff3b3b"></label>
                <label>Толщина: <input type="range" id="lineWidth" min="1" max="20" value="4"><span id="lineWidthValue">4</span></label>
            </div>

            <hr style="width: 100%; border-color: #444; margin: 5px 0;">

            <div class="control-group">
                <label>Отступ: <input type="range" id="paddingSize" min="0" max="10" value="0"><span id="paddingSizeValue">0%</span></label>
                <label>Головы: <input type="range" id="headCount" min="2" max="8" value="5"><span id="headCountValue">5</span></label>
                <label><input type="checkbox" id="showGrid" checked> Разметка</label>
            </div>

            <!-- УПРАВЛЕНИЕ ГОЛОВОЙ ИЗ ТВОЕГО СТАРОГО КОДА -->
            <fieldset style="border: 1px solid #444; padding: 10px; border-radius: 6px; margin-top: 10px;">
                <legend><input type="checkbox" id="showHead" checked> Голова</legend>
                
                <div class="control-group">
                    <label>Высота черепа: <input type="range" id="skullH" min="0.3" max="1.6" step="0.01" value="1.0"><span id="vSkullH">1.00</span></label>
                    <label>Ширина черепа: <input type="range" id="skullW" min="0.5" max="1.6" step="0.01" value="1.0"><span id="vSkullW">1.00</span></label>
                </div>
                
                <div class="control-group" style="margin-top: 10px;">
                    <label>Высота подбородка: <input type="range" id="chinY" min="-0.5" max="1.0" step="0.01" value="0.30"><span id="vChinY">0.30</span></label>
                    <label>Ширина подбородка: <input type="range" id="chinW" min="0" max="1" step="0.01" value="0.40"><span id="vChinW">0.40</span></label>
                    <label>Округлость: <input type="range" id="chinR" min="0" max="1" step="0.01" value="0.30"><span id="vChinR">0.30</span></label>
                </div>

                <div class="control-group" style="margin-top: 10px;">
                    <label>Крепление челюсти: <input type="range" id="jawY" min="0" max="1" step="0.01" value="0.77"><span id="vJawY">0.77</span></label>
                    <label>Ширина угла: <input type="range" id="jawW" min="0.3" max="1.2" step="0.01" value="0.78"><span id="vJawW">0.78</span></label>
                    <label>Высота угла: <input type="range" id="jawB" min="0" max="1" step="0.01" value="0.73"><span id="vJawB">0.73</span></label>
                </div>
            </fieldset>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
