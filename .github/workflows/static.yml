name: Deploy with Cache Bust

on:
  push:
    branches: ["V1.3", "main",] # Добавлены популярные ветки на всякий случай
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Cache Bust
        run: |
          # 1. Создаем папку для сборки
          mkdir -p dist
          
          # 2. Копируем все файлы в dist (исключая системные папки)
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/
          
          # 3. Генерируем уникальный хэш на основе времени
          HASH=$(date +%s)
          echo "Version: $HASH"
          
          # 4. Так как у нас один HTML-файл, мы внедрим мета-теги для запрета кэширования 
          # прямо в <head> файла index.html
          sed -i "s|<head>|<head>\n    <meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n    <meta http-equiv=\"Pragma\" content=\"no-cache\">\n    <meta http-equiv=\"Expires\" content=\"0\">|g" dist/index.html

          # Опционально: если вы хотите добавить хэш в название файла (например, index.html?v=123),
          # это можно сделать только если у вас есть ссылки на этот файл извне. 
          # Для GitHub Pages достаточно мета-тегов выше.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
