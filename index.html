<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Адаптивный холст для рисования</title>
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="zoomContainer">
      <div id="bgLayer"></div>
      <img id="underlayLayer" alt="" draggable="false">
      <svg id="drawLayer" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="gridGroup"></g>
        <g id="drawGroup"></g>
      </svg>
    </div>
  </div>

  <aside id="panel">
    <div class="panel-inner">
      <section class="block">
        <h3>Подложка</h3>
        <input type="file" id="fileInput" accept="image/*">
        <label>Масштаб: <span id="underlayScaleVal">100%</span>
          <input type="range" id="underlayScale" min="10" max="300" value="100">
        </label>
        <label>Прозрачность: <span id="underlayOpacityVal">100%</span>
          <input type="range" id="underlayOpacity" min="0" max="100" value="100">
        </label>
      </section>

      <section class="block">
        <h3>Фон</h3>
        <label>Цвет фона
          <input type="color" id="bgColor" value="#ffffff">
        </label>
      </section>

      <section class="block">
        <h3>Сетка</h3>
        <label>Отступ (0–10%): <span id="gridPadVal">5%</span>
          <input type="range" id="gridPad" min="0" max="10" value="5">
        </label>
        <label>Голов (2–8): <span id="headsVal">4</span>
          <input type="range" id="heads" min="2" max="8" value="4">
        </label>
      </section>

      <section class="block">
        <h3>Голова</h3>
        <label>Ширина: <span id="headWidthVal">65%</span>
          <input type="range" id="headWidth" min="10" max="100" value="65">
        </label>
        <label>Высота: <span id="headHeightVal">65%</span>
          <input type="range" id="headHeight" min="10" max="100" value="65">
        </label>
        <label>Смещение от верха: <span id="headOffsetVal">0%</span>
          <input type="range" id="headOffset" min="-50" max="100" value="0">
        </label>
      </section>

      <section class="block">
        <h3>Челюсть и подбородок</h3>
        <label>Подбородок (Y): <span id="chinYVal">85%</span>
          <input type="range" id="chinY" min="0" max="100" value="85">
        </label>
        <label>Ширина подбородка: <span id="chinWidthVal">1%</span>
          <input type="range" id="chinWidth" min="0" max="10" value="1">
        </label>
        <label>Высота крепления к кругу: <span id="jawAttachYVal">55%</span>
          <input type="range" id="jawAttachY" min="0" max="100" value="55">
        </label>
        <label>Высота челюсти (спуск): <span id="jawHeightVal">80%</span>
          <input type="range" id="jawHeight" min="0" max="100" value="80">
        </label>
        <label>Угол челюсти (скулы): <span id="jawAngleVal">20%</span>
          <input type="range" id="jawAngle" min="-50" max="50" value="20">
        </label>
        <label>Скругление челюсти: <span id="jawRoundVal">0%</span>
          <input type="range" id="jawRound" min="0" max="100" value="0">
        </label>
      </section>

      <section class="block">
        <h3>Кисть</h3>
        <label>Цвет кисти
          <input type="color" id="brushColor" value="#000000">
        </label>
        <label>Толщина: <span id="brushWidthVal">3</span>
          <input type="range" id="brushWidth" min="1" max="20" value="3">
        </label>
      </section>

      <section class="block">
        <h3>Действия</h3>
        <div class="btn-row">
          <button id="undoBtn">Undo</button>
          <button id="clearBtn">Очистить всё</button>
        </div>
        <div class="btn-row">
          <button id="exportSvgBtn">Скачать SVG</button>
          <button id="exportPngBtn">Скачать PNG</button>
        </div>
      </section>
    </div>
  </aside>
</div>
<script src="script.js?v=dev"></script>
</body>
</html>
