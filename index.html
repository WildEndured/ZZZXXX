<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фигура — Этап 2</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="app">
    <main class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"
             width="100%" height="100%"
             viewBox="0 0 4096 4096"
             preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="gridPattern" width="256" height="256"
                     patternUnits="userSpaceOnUse">
              <path d="M 256 0 L 0 0 0 256" fill="none"
                    stroke="#d0d0d0" stroke-width="2" />
            </pattern>
          </defs>

          <g id="underlayLayer" class="no-export">
            <image id="underlayImage" href="" x="0" y="0"
                   width="4096" height="4096"
                   preserveAspectRatio="xMidYMid meet"
                   opacity="0.5" style="display:none;" />
          </g>

          <g id="gridLayer" class="no-export">
            <rect id="gridRect" x="0" y="0" width="4096" height="4096"
                  fill="url(#gridPattern)" opacity="0.6" />
          </g>

          <g id="headsLayer" class="no-export"></g>

          <g id="figureLayer" stroke="#000000" stroke-width="6"
             fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g id="headGroup"></g>
            <g id="torsoGroup"></g>
            <g id="armLeftGroup"></g>
            <g id="armRightGroup"></g>
            <g id="legLeftGroup"></g>
            <g id="legRightGroup"></g>
          </g>
        </svg>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="panel-inner">

        <section class="block">
          <h2>Общее</h2>
          <label class="row">
            <span>Рост в головах: <b id="headsVal">5</b></span>
            <input type="range" id="headsRange" min="1" max="10" step="0.5" value="5" />
          </label>
          <label class="row">
            <span>Отступ сверху/снизу: <b id="marginVal">0</b>%</span>
            <input type="range" id="marginRange" min="0" max="10" step="1" value="0" />
          </label>
        </section>

        <section class="block">
          <h2>Голова</h2>
          <label class="row">
            <span>Верх головы: <b id="headTopShiftVal">0</b>%</span>
            <input type="range" id="headTopShift" min="0" max="0.20" step="0.01" value="0" />
          </label>
          <label class="row">
            <span>Низ головы: <b id="headBottomShiftVal">0</b>%</span>
            <input type="range" id="headBottomShift" min="-0.20" max="0.20" step="0.01" value="0" />
          </label>
          <label class="row">
            <span>Ширина головы: <b id="headWidthMulVal">100</b>%</span>
            <input type="range" id="headWidthMul" min="0.50" max="1.50" step="0.01" value="1" />
          </label>
          <label class="row">
            <span>Радиус головы: <b id="headRadiusMulVal">100</b>%</span>
            <input type="range" id="headRadiusMul" min="0.50" max="1.50" step="0.01" value="1" />
          </label>
          <label class="row">
            <span>Высота подбородка: <b id="headChinShiftVal">0</b>%</span>
            <input type="range" id="headChinShift" min="-0.15" max="0.15" step="0.005" value="0" />
          </label>
          <label class="row">
            <span>Ширина подбородка: <b id="headChinWidthVal">10</b>%</span>
            <input type="range" id="headChinWidth" min="0.10" max="0.60" step="0.01" value="0.10" />
          </label>
          <label class="row">
            <span>Высота крепления к голове: <b id="headJawAttachVal">+50</b>%</span>
            <input type="range" id="headJawAttach" min="-0.5" max="0.5" step="0.01" value="0.5" />
          </label>
          <label class="row">
            <span>Длина челюсти: <b id="headJawLengthVal">35</b>%</span>
            <input type="range" id="headJawLength" min="0.05" max="0.35" step="0.01" value="0.35" />
          </label>
          <label class="row">
            <span>Ширина углов челюсти: <b id="headJawAngleWidthVal">-8</b>%</span>
            <input type="range" id="headJawAngleWidth" min="-0.5" max="0.5" step="0.01" value="-0.08" />
          </label>
        </section>

        <section class="block">
          <h2>Подложка</h2>
          <label class="file-btn">
            <input type="file" id="underlayFile" accept="image/*" hidden />
            Загрузить изображение
          </label>
          <label class="row">
            <span>Прозрачность: <b id="opacityVal">50</b>%</span>
            <input type="range" id="opacityRange" min="0" max="100" step="1" value="50" />
          </label>
          <label class="row">
            <span>Масштаб: <b id="scaleVal">100</b>%</span>
            <input type="range" id="scaleRange" min="10" max="300" step="1" value="100" />
          </label>
          <button id="removeUnderlay" class="btn-danger" disabled>Удалить подложку</button>
        </section>

        <section class="block">
          <h2>Пресеты</h2>
          <div class="row-inline">
            <input type="text" id="presetName" placeholder="Название пресета" />
            <button id="savePreset">Сохранить</button>
          </div>
          <ul id="presetList" class="preset-list"></ul>
        </section>

        <section class="block">
          <h2>Экспорт</h2>
          <div class="row-inline">
            <button id="exportSvg">Экспорт SVG</button>
            <button id="exportPng">Экспорт PNG</button>
          </div>
        </section>

      </div>
    </aside>
  </div>

  <script src="js/head.js?v=4"></script>
  <script src="js/torso.js?v=4"></script>
  <script src="js/arm.js?v=4"></script>
  <script src="js/leg.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
