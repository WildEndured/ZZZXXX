<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SVG Векторный редактор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======================= ПАНЕЛЬ УПРАВЛЕНИЯ ======================= -->
<div class="toolbar">
  <div class="group">
    <label>Цвет кисти</label>
    <input type="color" id="brushColor" value="#e63946">
  </div>

  <div class="group">
    <label>Толщина: <span id="brushSizeVal">0.005</span></label>
    <input type="range" id="brushSize" min="0.00025" max="0.025" step="0.00025" value="0.005">
  </div>

  <div class="group">
    <label>Цвет фона</label>
    <input type="color" id="bgColor" value="#ffffff">
  </div>

  <div class="group">
    <label>
      <input type="checkbox" id="eraserMode"> Ластик
    </label>
  </div>

  <div class="group">
    <button id="btnUndo">↶ Отменить</button>
    <button id="btnClear">✕ Очистить</button>
  </div>
</div>

<div class="toolbar">
  <div class="group">
    <label>Подложка</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="group">
    <label>Масштаб: <span id="imgScaleVal">100%</span></label>
    <input type="range" id="imgScale" min="10" max="300" step="1" value="100">
  </div>

  <div class="group">
    <label>Прозрачность: <span id="imgOpacityVal">100%</span></label>
    <input type="range" id="imgOpacity" min="0" max="100" step="1" value="100">
  </div>
</div>

<div class="toolbar">
  <div class="group">
    <label>Отступ: <span id="marginVal">0%</span></label>
    <input type="range" id="marginSize" min="0" max="10" step="0.5" value="0">
  </div>

  <div class="group">
    <label>Голов: <span id="headsVal">4</span></label>
    <input type="range" id="headsCount" min="2" max="8" step="1" value="4">
  </div>

  <div class="group">
    <button id="btnExportSvg">⬇ SVG</button>
    <button id="btnExportPng">⬇ PNG 4096</button>
  </div>
</div>

<!-- ======================= ХОЛСТ ======================= -->
<div class="canvas-wrapper">
  <div class="canvas-container" id="canvasContainer">

    <!-- Слой зума/панорамирования -->
    <div class="zoom-layer" id="zoomLayer">

      <!-- 1. Слой фона -->
      <div class="layer layer-bg" id="bgLayer"></div>

      <!-- 2. Слой подложки -->
      <div class="layer layer-image" id="imgLayer">
        <img id="backImage" alt="">
      </div>

      <!-- 3. Слой рисования -->
      <div class="layer layer-draw">
        <svg id="drawSvg" viewBox="0 0 1 1"
             preserveAspectRatio="xMidYMid meet"
             xmlns="http://www.w3.org/2000/svg">
          <g id="drawGroup"></g>
          <g id="guidesGroup"></g>
        </svg>
      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
