<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анекорды — конструктор фигуры</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

    <!-- ЛЕВАЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <aside class="panel" id="panel">

        <section class="group">
            <h2>Общее</h2>

            <label class="row">
                <span>Рост в головах</span>
                <input type="range" id="growth" min="1" max="12" step="0.5" value="5" />
                <output id="growthOut">5</output>
            </label>

            <label class="row">
                <span>Отступы сверху/снизу, %</span>
                <input type="range" id="padding" min="0" max="10" step="0.1" value="0" />
                <output id="paddingOut">0</output>
            </label>
        </section>

        <section class="group">
            <h2>Подложка</h2>

            <div class="row buttons">
                <input type="file" id="bgFile" accept="image/*" />
            </div>

            <label class="row">
                <span>Прозрачность</span>
                <input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1" disabled />
                <output id="bgOpacityOut">1</output>
            </label>

            <label class="row">
                <span>Масштаб</span>
                <input type="range" id="bgScale" min="0.1" max="3" step="0.01" value="1" disabled />
                <output id="bgScaleOut">1</output>
            </label>

            <div class="row buttons">
                <button id="bgRemove" disabled>Удалить подложку</button>
            </div>
        </section>

        <section class="group">
            <h2>Пресеты</h2>

            <div class="row buttons">
                <input type="text" id="presetName" placeholder="Имя пресета" />
                <button id="presetSave">Сохранить</button>
            </div>

            <ul id="presetList" class="preset-list"></ul>
        </section>

    </aside>

    <!-- ОБЛАСТЬ ХОЛСТА -->
    <main class="stage">
        <div class="stage-toolbar">
            <button id="exportSvg">Экспорт SVG</button>
            <button id="exportPng">Экспорт PNG</button>
        </div>

        <div class="canvas-wrap">
            <!-- Вся отрисовка — внутри SVG -->
            <svg id="canvas"
                 xmlns="http://www.w3.org/2000/svg"
                 width="4096"
                 height="4096"
                 viewBox="0 0 4096 4096"
                 preserveAspectRatio="xMidYMid meet">
                <defs id="defs"></defs>
                <g id="layerBg"></g>
                <g id="layerGrid"></g>
                <g id="layerFigure">
                    <g id="figureHead"></g>
                    <g id="figureTorso"></g>
                    <g id="figureArms"></g>
                    <g id="figureLegs"></g>
                </g>
            </svg>
        </div>
    </main>

</div>

<script src="js/main.js" type="module"></script>
</body>
</html>
