<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SVG Векторный Редактор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Панель управления -->
    <aside class="panel">
      <h2>Инструменты</h2>

      <div class="group">
        <label>Кисть / Ластик</label>
        <div class="btn-row">
          <button id="toolBrush" class="active">Кисть</button>
          <button id="toolEraser">Ластик</button>
        </div>
      </div>

      <div class="group">
        <label>Толщина: <span id="sizeVal">0.00500</span></label>
        <input type="range" id="sizeRange" min="0.00025" max="0.025" step="0.00025" value="0.005">
      </div>

      <div class="group">
        <label>Цвет кисти</label>
        <input type="color" id="brushColor" value="#000000">
      </div>

      <div class="group">
        <button id="undoBtn">Отменить</button>
        <button id="clearBtn">Очистить</button>
      </div>

      <hr>

      <h2>Фон и подложка</h2>
      <div class="group">
        <label>Цвет фона</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>

      <div class="group">
        <button id="uploadBtn">Загрузить картинку</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div class="group">
        <label>Масштаб подложки: <span id="imgScaleVal">100</span>%</label>
        <input type="range" id="imgScale" min="10" max="300" value="100">
      </div>

      <div class="group">
        <label>Прозрачность: <span id="imgOpacityVal">100</span>%</label>
        <input type="range" id="imgOpacity" min="0" max="100" value="100">
      </div>

      <hr>

      <h2>Разметка</h2>
      <div class="group">
        <label>Отступ: <span id="marginVal">5</span>%</label>
        <input type="range" id="marginRange" min="0" max="10" value="5">
      </div>

      <div class="group">
        <label>Голов: <span id="headsVal">4</span></label>
        <input type="range" id="headsRange" min="2" max="8" value="4">
      </div>

      <hr>

      <h2>Экспорт</h2>
      <div class="group">
        <button id="exportSvg">Скачать SVG</button>
        <button id="exportPng">Скачать PNG (4096)</button>
      </div>
    </aside>

    <!-- Контейнер зума -->
    <main class="stage" id="stage">
      <div class="zoom-container" id="zoomContainer">
        <!-- Слой 1: фон -->
        <div class="layer-bg" id="bgLayer"></div>
        <!-- Слой 2: подложка -->
        <img class="layer-img" id="imgLayer" alt="" draggable="false">
        <!-- Слой 3: рисование -->
        <svg class="layer-svg" id="svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
          <g id="gridGroup"></g>
          <g id="drawGroup"></g>
        </svg>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
