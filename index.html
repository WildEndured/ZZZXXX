<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Head Builder — SVG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="canvas-wrap">
      <svg id="stage" viewBox="0 0 4096 4096" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>Голова в частях</span>
        <span id="xVal" class="badge">6</span>
      </div>

      <label class="row">
        <span>X (делений роста)</span>
        <input id="xParts" type="range" min="3" max="12" step="1" value="6" />
      </label>

      <div class="panel-head"><span>Череп</span></div>
      <label class="row">
        <span>Высота круга</span>
        <input id="skullH" type="range" min="0.6" max="1.6" step="0.01" value="1" />
      </label>
      <label class="row">
        <span>Ширина круга</span>
        <input id="skullW" type="range" min="0.6" max="1.6" step="0.01" value="1" />
      </label>

      <div class="panel-head"><span>Подбородок</span></div>
      <label class="row">
        <span>Ширина</span>
        <input id="chinW" type="range" min="0" max="1" step="0.01" value="0.35" />
      </label>
      <label class="row">
        <span>Высота</span>
        <input id="chinH" type="range" min="-0.5" max="0.5" step="0.01" value="0" />
      </label>
      <label class="row">
        <span>Тип: точка ↔ линия</span>
        <input id="chinType" type="range" min="0" max="1" step="0.01" value="0" />
      </label>

      <div class="panel-head"><span>Челюсть</span></div>
      <label class="row">
        <span>Высота крепления</span>
        <input id="jawH" type="range" min="0.4" max="1.2" step="0.01" value="0.9" />
      </label>
      <label class="row">
        <span>Угол челюсти</span>
        <input id="jawAngle" type="range" min="5" max="60" step="1" value="25" />
      </label>
      <label class="row">
        <span>Ширина челюсти</span>
        <input id="jawW" type="range" min="0.4" max="1.4" step="0.01" value="1" />
      </label>

      <button id="exportBtn">Скачать SVG</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
