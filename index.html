<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анекорды — конструктор пропорций</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ХОЛСТ -->
    <main class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <svg
          id="stage"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 4096 4096"
          preserveAspectRatio="xMidYMid meet"
          width="100%" height="100%"
        >
          <defs>
            <!-- клип подложки (чтобы не выходила за холст) -->
            <clipPath id="canvasClip">
              <rect x="0" y="0" width="4096" height="4096" />
            </clipPath>
          </defs>

          <!-- слой подложки (не экспортируется) -->
          <g id="layer-underlay" clip-path="url(#canvasClip)"></g>

          <!-- слой сетки голов (не экспортируется) -->
          <g id="layer-grid"></g>

          <!-- слой фигуры (экспортируется) -->
          <g id="layer-figure"></g>
        </svg>
      </div>
    </main>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <aside class="panel" id="panel">
      <div class="panel-inner">

        <h1 class="panel-title">Анекорды</h1>

        <!-- ОБЩЕЕ -->
        <section class="block">
          <h2 class="block-title">Общее</h2>

          <label class="row">
            <span class="row-label">Рост в головах</span>
            <span class="row-value" id="valHeads">5</span>
          </label>
          <input type="range" id="inpHeads" min="1" max="10" step="0.5" value="5" />

          <label class="row">
            <span class="row-label">Отступ сверху/снизу</span>
            <span class="row-value" id="valMargin">0%</span>
          </label>
          <input type="range" id="inpMargin" min="0" max="10" step="0.5" value="0" />

          <label class="row">
            <span class="row-label">Толщина линий</span>
            <span class="row-value" id="valStroke">6</span>
          </label>
          <input type="range" id="inpStroke" min="1" max="40" step="1" value="6" />

          <label class="row">
            <span class="row-label">Цвет линий</span>
            <input type="color" id="inpColor" value="#000000" />
          </label>
        </section>

        <!-- ПОДЛОЖКА -->
        <section class="block">
          <h2 class="block-title">Подложка</h2>

          <div class="file-btn-wrap">
            <input type="file" id="inpUnderlay" accept="image/*" hidden />
            <button type="button" class="btn" id="btnUnderlay">Загрузить изображение</button>
          </div>

          <label class="row">
            <span class="row-label">Прозрачность</span>
            <span class="row-value" id="valUnderlayOpacity">50%</span>
          </label>
          <input type="range" id="inpUnderlayOpacity" min="0" max="100" step="1" value="50" />

          <label class="row">
            <span class="row-label">Масштаб</span>
            <span class="row-value" id="valUnderlayScale">100%</span>
          </label>
          <input type="range" id="inpUnderlayScale" min="10" max="300" step="1" value="100" />

          <button type="button" class="btn btn-danger" id="btnUnderlayRemove">Удалить подложку</button>
        </section>

        <!-- ПРЕСЕТЫ -->
        <section class="block">
          <h2 class="block-title">Пресеты</h2>

          <div class="preset-save">
            <input type="text" id="inpPresetName" placeholder="Название пресета" />
            <button type="button" class="btn" id="btnPresetSave">Сохранить</button>
          </div>

          <ul class="preset-list" id="presetList">
            <li class="preset-empty">Пресетов пока нет</li>
          </ul>
        </section>

        <!-- ЭКСПОРТ -->
        <section class="block">
          <h2 class="block-title">Экспорт</h2>
          <div class="export-btns">
            <button type="button" class="btn" id="btnExportSvg">Скачать SVG</button>
            <button type="button" class="btn" id="btnExportPng">Скачать PNG</button>
          </div>
        </section>

      </div>
    </aside>

  </div>

  <!-- модули подключаются как ES-модули -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
