<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Адаптивный холст для рисования</title>
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="zoomContainer">
      <div id="bgLayer"></div>
      <img id="underlayLayer" alt="" draggable="false">
      <svg id="drawLayer" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="gridGroup"></g>
        <g id="drawGroup"></g>
      </svg>
    </div>
  </div>

  <aside id="panel">
    <div class="panel-inner">
      <!-- ... остальные блоки (Подложка, Фон, Сетка, Голова, Торс) без изменений ... -->
      
      <details class="accordion" open>
        <summary>Руки</summary>
        <div class="accordion-content">
          <section class="block border-none">
            <h4>Локти</h4>
            <label>Левое X: <span id="elbowLeftXVal">0%</span>
              <input type="range" id="elbowLeftX" min="-50" max="50" value="0">
            </label>
            <label>Левое Y: <span id="elbowLeftYVal">0%</span>
              <input type="range" id="elbowLeftY" min="-50" max="50" value="0">
            </label>
            <label>Левое радиус: <span id="elbowLeftRVal">8%</span>
              <input type="range" id="elbowLeftR" min="5" max="30" value="8">
            </label>
            <label>Правое X: <span id="elbowRightXVal">0%</span>
              <input type="range" id="elbowRightX" min="-50" max="50" value="0">
            </label>
            <label>Правое Y: <span id="elbowRightYVal">0%</span>
              <input type="range" id="elbowRightY" min="-50" max="50" value="0">
            </label>
            <label>Правое радиус: <span id="elbowRightRVal">8%</span>
              <input type="range" id="elbowRightR" min="5" max="30" value="8">
            </label>
          </section>
          <section class="block border-none">
            <h4>Запястья</h4>
            <label>Левое X: <span id="wristLeftXVal">-20%</span>
              <input type="range" id="wristLeftX" min="-50" max="50" value="-20">
            </label>
            <label>Левое Y: <span id="wristLeftYVal">0%</span>
              <input type="range" id="wristLeftY" min="-50" max="50" value="0">
            </label>
            <label>Левое радиус: <span id="wristLeftRVal">10%</span>
              <input type="range" id="wristLeftR" min="5" max="30" value="10">
            </label>
            <label>Правое X: <span id="wristRightXVal">20%</span>
              <input type="range" id="wristRightX" min="-50" max="50" value="20">
            </label>
            <label>Правое Y: <span id="wristRightYVal">0%</span>
              <input type="range" id="wristRightY" min="-50" max="50" value="0">
            </label>
            <label>Правое радиус: <span id="wristRightRVal">10%</span>
              <input type="range" id="wristRightR" min="5" max="30" value="10">
            </label>
          </section>
          <section class="block border-none">
            <h4>Мышцы предплечья</h4>
            <label>Крепление (высота): <span id="forearmAttachVal">50%</span>
              <input type="range" id="forearmAttach" min="0" max="100" value="50">
            </label>
            <label>Выпуклость: <span id="forearmBulgeVal">20%</span>
              <input type="range" id="forearmBulge" min="-50" max="100" value="20">
            </label>
          </section>
        </div>
      </details>

      <!-- ... остальные блоки (Ноги, Кисть, Действия) без изменений ... -->
    </div>
  </aside>
</div>
<script src="script.js?v=dev"></script>
</body>
  </html>
