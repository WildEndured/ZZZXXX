<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фигура — Этап 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Панель управления -->
    <aside class="panel" id="panel">
      <h1 class="panel__title">Управление</h1>

      <!-- Общее -->
      <section class="group">
        <h2 class="group__title">Общее</h2>

        <label class="field">
          <span class="field__label">Рост в головах: <b id="headsVal">5</b></span>
          <input type="range" id="heads" min="1" max="10" step="0.5" value="5">
        </label>

        <label class="field">
          <span class="field__label">Отступ сверху/снизу: <b id="marginVal">0</b>%</span>
          <input type="range" id="margin" min="0" max="10" step="0.5" value="0">
        </label>

        <label class="field">
          <span class="field__label">Цвет контура</span>
          <input type="color" id="strokeColor" value="#222222">
        </label>

        <label class="field">
          <span class="field__label">Толщина контура: <b id="strokeWidthVal">4</b></span>
          <input type="range" id="strokeWidth" min="1" max="20" step="1" value="4">
        </label>
      </section>

      <!-- Подложка -->
      <section class="group">
        <h2 class="group__title">Подложка</h2>

        <label class="btn-file">
          <input type="file" id="bgFile" accept="image/*">
          <span>Загрузить изображение</span>
        </label>

        <label class="field">
          <span class="field__label">Прозрачность: <b id="bgOpacityVal">50</b>%</span>
          <input type="range" id="bgOpacity" min="0" max="100" step="1" value="50">
        </label>

        <label class="field">
          <span class="field__label">Масштаб: <b id="bgScaleVal">100</b>%</span>
          <input type="range" id="bgScale" min="10" max="300" step="1" value="100">
        </label>

        <button class="btn btn--danger" id="bgRemove">Удалить подложку</button>
      </section>

      <!-- Пресеты -->
      <section class="group">
        <h2 class="group__title">Пресеты</h2>

        <div class="preset-save">
          <input type="text" id="presetName" placeholder="Название пресета" maxlength="40">
          <button class="btn" id="presetSave">Сохранить</button>
        </div>

        <ul class="preset-list" id="presetList"></ul>
      </section>

      <!-- Экспорт -->
      <section class="group">
        <h2 class="group__title">Экспорт</h2>
        <button class="btn" id="exportSvg">Экспорт SVG</button>
        <button class="btn" id="exportPng">Экспорт PNG (белый фон)</button>
      </section>
    </aside>

    <!-- Холст -->
    <main class="canvas-wrap" id="canvasWrap">
      <svg id="stage" viewBox="0 0 4096 4096" preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg">
        <!-- Подложка (не в экспорте) -->
        <image id="bgImage" x="0" y="0" width="4096" height="4096"
               preserveAspectRatio="xMidYMid meet" style="display:none"></image>

        <!-- Сетка "головы" -->
        <g id="headGrid" stroke="#c9c9c9" stroke-width="2" fill="none"
           stroke-dasharray="12 12" style="pointer-events:none"></g>

        <!-- Фигура (Этап-1: пустая группа-заглушка) -->
        <g id="figure" fill="none" stroke="#222222" stroke-width="4"
           stroke-linecap="round" stroke-linejoin="round"></g>
      </svg>
    </main>
  </div>

  <script src="js/head.js"></script>
  <script src="js/torso.js"></script>
  <script src="js/arm.js"></script>
  <script src="js/leg.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
