<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Голова, Торс и Таз Loomis — 4096×4096 @300dpi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1e1e1e; color: #eee;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .wrap { display: flex; gap: 16px; align-items: flex-start; width: 100%; max-width: 1600px; }
  .panel {
    flex: 0 0 320px; display: flex; flex-direction: column; gap: 10px;
    background: #2a2a2a; padding: 14px; border-radius: 10px;
    max-height: 88vh; overflow-y: auto;
  }
  .panel h3 { margin: 6px 0 2px; font-size: 14px; color: #8ec4ff; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .panel label .row { display: flex; justify-content: space-between; align-items: center; }
  .panel label .val { color: #8ec4ff; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; }
  input[type="color"] { width: 42px; height: 28px; border: none; background: none; cursor: pointer; }
  button { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; background: #4a90d9; color: #fff; font-size: 13px; }
  button:hover { background: #5aa0e9; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }
  .stage { flex: 1; min-width: 0; max-height: 88vh; overflow: auto; border: 1px solid #444; border-radius: 8px; background: #000; display: flex; justify-content: center;}
  canvas { display: block; max-width: 100%; height: auto; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .file-input { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <h3>Общее и Подложка</h3>
    <label class="chk"><input type="checkbox" id="showRef" checked> Показывать подложку</label>
    <label>
      <span class="row">Прозрачность подложки <span class="val" id="vRefOp">0.50</span></span>
      <input type="range" id="refOp" min="0" max="1" step="0.05" value="0.5">
    </label>
    <button id="uploadBtn" class="sec">Загрузить картинку</button>
    <input type="file" id="fileInput" class="file-input" accept="image/*">
    
    <label>
      <span class="row">Рост в головах <span class="val" id="vHeads">5.0</span></span>
      <input type="range" id="heads" min="3" max="12" step="0.1" value="5.0">
    </label>
    <label>
      <span class="row">Цвет линий</span>
      <input type="color" id="lineColor" value="#ff3b3b">
    </label>
    <label>
      <span class="row">Толщина линий <span class="val" id="vWidth">5</span></span>
      <input type="range" id="lineWidth" min="1" max="30" step="1" value="5">
    </label>
    <label class="chk"><input type="checkbox" id="showHeads" checked> Показывать линии голов</label>
    <label class="chk"><input type="checkbox" id="showSub" checked> Показывать подсекции</label>

    <h3>Череп (Круг)</h3>
    <label><span class="row">Высота <span class="val" id="vSkullH">1.00</span></span><input type="range" id="skullH" min="0.3" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Ширина <span class="val" id="vSkullW">1.00</span></span><input type="range" id="skullW" min="0.5" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Смещение по X <span class="val" id="vSkullX">0.00</span></span><input type="range" id="skullX" min="-0.5" max="0.5" step="0.01" value="0"></label>

    <h3>Подбородок (C)</h3>
    <label><span class="row">Высота <span class="val" id="vChinY">0.30</span></span><input type="range" id="chinY" min="-0.5" max="1.0" step="0.01" value="0.30"></label>
    <label><span class="row">Ширина <span class="val" id="vChinW">0.00</span></span><input type="range" id="chinW" min="0" max="1" step="0.01" value="0.00"></label>
    <label><span class="row">Округлость <span class="val" id="vChinR">0.30</span></span><input type="range" id="chinR" min="0" max="1" step="0.01" value="0.30"></label>

    <h3>Челюсть (A-B-C)</h3>
    <label><span class="row">Высота крепления (A) <span class="val" id="vJawY">0.77</span></span><input type="range" id="jawY" min="0" max="1" step="0.01" value="0.77"></label>
    <label><span class="row">Ширина угла (B) <span class="val" id="vJawW">0.78</span></span><input type="range" id="jawW" min="0.3" max="1.2" step="0.01" value="0.78"></label>
    <label><span class="row">Высота угла (B) <span class="val" id="vJawB">0.73</span></span><input type="range" id="jawB" min="0" max="1" step="0.01" value="0.73"></label>

    <h3>Шея</h3>
    <label><span class="row">Ширина шеи <span class="val" id="vNeckW">0.30</span></span><input type="range" id="neckW" min="0.1" max="0.8" step="0.01" value="0.30"></label>
    <label><span class="row">Смещение по X <span class="val" id="vNeckX">0.00</span></span><input type="range" id="neckX" min="-0.5" max="0.5" step="0.01" value="0.00"></label>

    <h3>Торс (Яйцо)</h3>
    <label><span class="row">Высота <span class="val" id="vTorsoH">0.85</span></span><input type="range" id="torsoH" min="0.5" max="1.3" step="0.01" value="0.85"></label>
    <label><span class="row">Ширина <span class="val" id="vTorsoW">1.50</span></span><input type="range" id="torsoW" min="0.5" max="2.00" step="0.01" value="1.50"></label>
    <label><span class="row">Смещение по X <span class="val" id="vTorsoX">0.00</span></span><input type="range" id="torsoX" min="-0.5" max="0.5" step="0.01" value="0.00"></label>
    <label><span class="row">Сужение сверху <span class="val" id="vTorsoTop">0.60</span></span><input type="range" id="torsoTop" min="0.1" max="1" step="0.01" value="0.60"></label>
    <label><span class="row">Сужение снизу <span class="val" id="vTorsoBot">0.80</span></span><input type="range" id="torsoBot" min="0.1" max="1" step="0.01" value="0.80"></label>

    <h3>Таз (Прямоугольник)</h3>
    <label><span class="row">Скругление углов <span class="val" id="vPelvisR">0.20</span></span><input type="range" id="pelvisR" min="0" max="0.5" step="0.01" value="0.20"></label>
    <label><span class="row">Смещение по X <span class="val" id="vPelvisX">0.00</span></span><input type="range" id="pelvisX" min="-0.5" max="0.5" step="0.01" value="0.00"></label>

    <button id="resetBtn" class="sec">Сбросить ползунки</button>
    <button id="downloadBtn">Скачать PNG</button>
  </div>

  <div class="stage">
    <canvas id="cv" width="4096" height="4096"></canvas>
  </div>
</div>

<script>
let canvasW = 4096;
const canvasH = 4096;
let refImage = null;

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const ui = {
  showRef: document.getElementById('showRef'), refOp: document.getElementById('refOp'),
  heads: document.getElementById('heads'), lineColor: document.getElementById('lineColor'), lineWidth: document.getElementById('lineWidth'),
  showHeads: document.getElementById('showHeads'), showSub: document.getElementById('showSub'),
  skullH: document.getElementById('skullH'), skullW: document.getElementById('skullW'), skullX: document.getElementById('skullX'),
  chinY: document.getElementById('chinY'), chinW: document.getElementById('chinW'), chinR: document.getElementById('chinR'),
  jawY: document.getElementById('jawY'), jawW: document.getElementById('jawW'), jawB: document.getElementById('jawB'),
  neckW: document.getElementById('neckW'), neckX: document.getElementById('neckX'),
  torsoH: document.getElementById('torsoH'), torsoW: document.getElementById('torsoW'), torsoX: document.getElementById('torsoX'),
  torsoTop: document.getElementById('torsoTop'), torsoBot: document.getElementById('torsoBot'),
  pelvisR: document.getElementById('pelvisR'), pelvisX: document.getElementById('pelvisX')
};

const vals = {
  vRefOp: document.getElementById('vRefOp'),
  vHeads: document.getElementById('vHeads'), vWidth: document.getElementById('vWidth'),
  vSkullH: document.getElementById('vSkullH'), vSkullW: document.getElementById('vSkullW'), vSkullX: document.getElementById('vSkullX'),
  vChinY: document.getElementById('vChinY'), vChinW: document.getElementById('vChinW'), vChinR: document.getElementById('vChinR'),
  vJawY: document.getElementById('vJawY'), vJawW: document.getElementById('vJawW'), vJawB: document.getElementById('vJawB'),
  vNeckW: document.getElementById('vNeckW'), vNeckX: document.getElementById('vNeckX'),
  vTorsoH: document.getElementById('vTorsoH'), vTorsoW: document.getElementById('vTorsoW'), vTorsoX: document.getElementById('vTorsoX'),
  vTorsoTop: document.getElementById('vTorsoTop'), vTorsoBot: document.getElementById('vTorsoBot'),
  vPelvisR: document.getElementById('vPelvisR'), vPelvisX: document.getElementById('vPelvisX')
};

document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      refImage = img;
      const ratio = img.width / img.height;
      canvasW = Math.round(canvasH * ratio);
      
      canvas.width = canvasW;
      canvas.height = canvasH;
      
      draw();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

function draw() {
  const W = canvasW, H = canvasH;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (refImage && ui.showRef.checked) {
    ctx.save();
    ctx.globalAlpha = parseFloat(ui.refOp.value) || 0.5;
    ctx.drawImage(refImage, 0, 0, W, H);
    ctx.restore();
  }

  const n = parseFloat(ui.heads.value) || 5.0;
  const color = ui.lineColor.value;
  const lw = parseInt(ui.lineWidth.value) || 5;

  const headStep = H / n;
  const headLines = [];
  for (let i = 0; i <= n; i++) headLines.push(i * headStep);

  const subs0 = [];
  for (let i = 0; i <= 5; i++) subs0.push((headStep / 5) * i);
  
  const subs1 = [];
  for (let i = 0; i <= 3; i++) subs1.push(headLines[1] + (headStep / 3) * i);

  const subs2 = [];
  for (let i = 0; i <= 3; i++) subs2.push(headLines[2] + (headStep / 3) * i);

  const cx = W / 2; 

  // Сетка
  if (ui.showHeads.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(180,180,180,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (const y of headLines) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  if (ui.showSub.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100,150,255,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([8, 12]);
    ctx.beginPath();
    for (let i = 1; i <= 4; i++) { ctx.moveTo(0, subs0[i]); ctx.lineTo(W, subs0[i]); }
    for (let i = 1; i <= 2; i++) { ctx.moveTo(0, subs1[i]); ctx.lineTo(W, subs1[i]); }
    for (let i = 1; i <= 2; i++) { ctx.moveTo(0, subs2[i]); ctx.lineTo(W, subs2[i]); }
    ctx.stroke();
    ctx.restore();
  }

  // --- Голова ---
  const skullTopBase = subs0[0]; 
  const skullBotBase = subs0[3]; 
  const baseR = (skullBotBase - skullTopBase) / 2;
  const skullCyBase  = skullTopBase + baseR; 

  const skullH = parseFloat(ui.skullH.value) || 1;
  const skullW = parseFloat(ui.skullW.value) || 1;
  const skullX = parseFloat(ui.skullX.value) || 0;

  const rY = baseR * skullH;
  const rX = baseR * skullW;
  const headCx = cx + skullX * rX; 
  const cy = skullCyBase;
  const skullBottom = cy + rY;

  const chinBaseY = subs0[4];
  const chinYOffset = parseFloat(ui.chinY.value) || 0;
  const chinCenterY = chinBaseY + chinYOffset * (headStep / 5);

  const chinWParam = parseFloat(ui.chinW.value) || 0;
  const chinRParam = parseFloat(ui.chinR.value) || 0;
  const chinHalfW = chinWParam * rX * 0.7;
  const chinRound = chinRParam * chinHalfW;

  const jawYParam = parseFloat(ui.jawY.value) || 0.77;
  const jawAttachY = skullBottom - (skullBottom - cy) * jawYParam;

  const jawWParam = parseFloat(ui.jawW.value) || 0.78;
  const jawBParam = parseFloat(ui.jawB.value) || 0.73;

  const attachDx = Math.sqrt(Math.max(0, 1 - Math.pow((jawAttachY - cy) / rY, 2)));
  const attachLeft  = { x: headCx - rX * attachDx, y: jawAttachY };
  const attachRight = { x: headCx + rX * attachDx, y: jawAttachY };

  const cornerLeft  = { x: headCx - rX * jawWParam, y: jawAttachY + (chinCenterY - jawAttachY) * jawBParam };
  const cornerRight = { x: headCx + rX * jawWParam, y: jawAttachY + (chinCenterY - jawAttachY) * jawBParam };

  let chinLeft, chinRight;
  if (chinHalfW < 1.5) {
    chinLeft = { x: headCx, y: chinCenterY };
    chinRight = { x: headCx, y: chinCenterY };
  } else {
    chinLeft  = { x: headCx - chinHalfW, y: chinCenterY };
    chinRight = { x: headCx + chinHalfW, y: chinCenterY };
  }

  // --- Шея ---
  const neckWParam = parseFloat(ui.neckW.value) || 0.3;
  const neckXParam = parseFloat(ui.neckX.value) || 0;
  const neckHalfW = rX * neckWParam;
  const neckCx = headCx + neckXParam * rX;
  const neckTopY = chinCenterY - (headStep / 10); 
  const neckBotY = headLines[1]; 

  // --- Торс ---
  const tH = parseFloat(ui.torsoH.value) || 0.85;
  const tW = parseFloat(ui.torsoW.value) || 1.5;
  const tX = parseFloat(ui.torsoX.value) || 0;
  const tTop = parseFloat(ui.torsoTop.value) || 0.6;
  const tBot = parseFloat(ui.torsoBot.value) || 0.8;

  const torsoTopY = subs1[0]; 
  const torsoBotY = subs1[3]; 
  
  const baseTorsoH = torsoBotY - torsoTopY;
  const baseTorsoW = rX * 1.5; 

  const torsoCenterY = torsoTopY + (baseTorsoH * tH) / 2;
  const torsoRX = (baseTorsoW * tW) / 2;
  const torsoRY = (baseTorsoH * tH) / 2;
  const torsoCx = cx + tX * torsoRX;

  // --- Таз ---
  // Высота таза = ширина торса (torsoRX * 2)
  // Ширина таза = высоте таза
  const pelvisSide = torsoRX * 2; 
  
  const pelvisR = parseFloat(ui.pelvisR.value) || 0.2;
  const pelvisX = parseFloat(ui.pelvisX.value) || 0;
  
  // Начинаем таз от конца торса (subs1[3]), добавляем небольшой отступ
  const pelvisTopY = torsoBotY;
  const pelvisCx = cx + pelvisX * pelvisSide;
  
  const pelvisXPos = pelvisCx - pelvisSide / 2;
  const pelvisYPos = pelvisTopY;
  const cornerRadius = pelvisSide * pelvisR;

  /* ---------- Отрисовка ---------- */
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // 1. Торс (Яйцо)
  ctx.beginPath();
  ctx.moveTo(torsoCx, torsoCenterY - torsoRY);
  ctx.bezierCurveTo(torsoCx + torsoRX * tTop, torsoCenterY - torsoRY, torsoCx + torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx + torsoRX, torsoCenterY);
  ctx.bezierCurveTo(torsoCx + torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx + torsoRX * tBot, torsoCenterY + torsoRY, torsoCx, torsoCenterY + torsoRY);
  ctx.bezierCurveTo(torsoCx - torsoRX * tBot, torsoCenterY + torsoRY, torsoCx - torsoRX, torsoCenterY + torsoRY * 0.5, torsoCx - torsoRX, torsoCenterY);
  ctx.bezierCurveTo(torsoCx - torsoRX, torsoCenterY - torsoRY * 0.2, torsoCx - torsoRX * tTop, torsoCenterY - torsoRY, torsoCx, torsoCenterY - torsoRY);
  ctx.stroke();

  // 2. Таз (Скругленный квадрат)
  ctx.beginPath();
  // Рисуем прямоугольник вручную через дуги, чтобы не зависеть от поддержки roundRect
  ctx.moveTo(pelvisXPos + cornerRadius, pelvisYPos);
  ctx.lineTo(pelvisXPos + pelvisSide - cornerRadius, pelvisYPos);
  ctx.quadraticCurveTo(pelvisXPos + pelvisSide, pelvisYPos, pelvisXPos + pelvisSide, pelvisYPos + cornerRadius);
  ctx.lineTo(pelvisXPos + pelvisSide, pelvisYPos + pelvisSide - cornerRadius);
  ctx.quadraticCurveTo(pelvisXPos + pelvisSide, pelvisYPos + pelvisSide, pelvisXPos + pelvisSide - cornerRadius, pelvisYPos + pelvisSide);
  ctx.lineTo(pelvisXPos + cornerRadius, pelvisYPos + pelvisSide);
  ctx.quadraticCurveTo(pelvisXPos, pelvisYPos + pelvisSide, pelvisXPos, pelvisYPos + pelvisSide - cornerRadius);
  ctx.lineTo(pelvisXPos, pelvisYPos + cornerRadius);
  ctx.quadraticCurveTo(pelvisXPos, pelvisYPos, pelvisXPos + cornerRadius, pelvisYPos);
  ctx.stroke();

  // 3. Шея (с обрезкой)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, neckBotY); 
  ctx.ellipse(headCx, cy, rX, rY, 0, 0, Math.PI * 2);
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  if (chinHalfW < 1.5) {
    ctx.lineTo(headCx, chinCenterY);
    ctx.lineTo(cornerRight.x, cornerRight.y);
  } else {
    ctx.lineTo(chinLeft.x, chinLeft.y);
    ctx.lineTo(chinRight.x, chinRight.y);
    ctx.lineTo(cornerRight.x, cornerRight.y);
  }
  ctx.lineTo(attachRight.x, attachRight.y);
  ctx.closePath();
  ctx.clip('evenodd');

  ctx.beginPath();
  ctx.moveTo(neckCx - neckHalfW, neckTopY);
  ctx.lineTo(neckCx - neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckTopY);
  ctx.stroke();
  ctx.restore(); 

  // 4. Контуры головы
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw;

  ctx.beginPath(); ctx.ellipse(headCx, cy, rX, rY, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  ctx.lineTo(chinHalfW < 1.5 ? headCx : chinLeft.x, chinHalfW < 1.5 ? chinCenterY : chinLeft.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachRight.x, attachRight.y);
  ctx.lineTo(cornerRight.x, cornerRight.y);
  ctx.lineTo(chinHalfW < 1.5 ? headCx : chinRight.x, chinHalfW < 1.5 ? chinCenterY : chinRight.y);
  ctx.stroke();

  if (chinHalfW < 1.5) {
    ctx.beginPath(); ctx.arc(headCx, chinCenterY, Math.max(3, lw), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(chinLeft.x, chinLeft.y);
    if (chinRound < 1) ctx.lineTo(chinRight.x, chinRight.y);
    else ctx.quadraticCurveTo(headCx, chinCenterY + (chinRound / chinHalfW) * chinHalfW * 0.8, chinRight.x, chinRight.y);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore(); 
  updateLabels();
}

function updateLabels() {
  vals.vRefOp.textContent  = parseFloat(ui.refOp.value).toFixed(2);
  vals.vHeads.textContent  = parseFloat(ui.heads.value).toFixed(1);
  vals.vWidth.textContent  = ui.lineWidth.value;
  vals.vSkullH.textContent = parseFloat(ui.skullH.value).toFixed(2);
  vals.vSkullW.textContent = parseFloat(ui.skullW.value).toFixed(2);
  vals.vSkullX.textContent = parseFloat(ui.skullX.value).toFixed(2);
  vals.vChinY.textContent  = parseFloat(ui.chinY.value).toFixed(2);
  vals.vChinW.textContent  = parseFloat(ui.chinW.value).toFixed(2);
  vals.vChinR.textContent  = parseFloat(ui.chinR.value).toFixed(2);
  vals.vJawY.textContent   = parseFloat(ui.jawY.value).toFixed(2);
  vals.vJawW.textContent   = parseFloat(ui.jawW.value).toFixed(2);
  vals.vJawB.textContent   = parseFloat(ui.jawB.value).toFixed(2);
  vals.vNeckW.textContent  = parseFloat(ui.neckW.value).toFixed(2);
  vals.vNeckX.textContent  = parseFloat(ui.neckX.value).toFixed(2);
  vals.vTorsoH.textContent = parseFloat(ui.torsoH.value).toFixed(2);
  vals.vTorsoW.textContent = parseFloat(ui.torsoW.value).toFixed(2);
  vals.vTorsoX.textContent = parseFloat(ui.torsoX.value).toFixed(2);
  vals.vTorsoTop.textContent = parseFloat(ui.torsoTop.value).toFixed(2);
  vals.vTorsoBot.textContent = parseFloat(ui.torsoBot.value).toFixed(2);
  vals.vPelvisR.textContent = parseFloat(ui.pelvisR.value).toFixed(2);
  vals.vPelvisX.textContent = parseFloat(ui.pelvisX.value).toFixed(2);
}

Object.values(ui).forEach(el => { el.addEventListener('input', draw); el.addEventListener('change', draw); });

document.getElementById('resetBtn').addEventListener('click', () => {
  ui.heads.value = 5.0; ui.lineWidth.value = 5;
  ui.skullH.value = 1.0; ui.skullW.value = 1.0; ui.skullX.value = 0;
  ui.chinY.value = 0.30; ui.chinW.value = 0.00; ui.chinR.value = 0.30;
  ui.jawY.value = 0.77; ui.jawW.value = 0.78; ui.jawB.value = 0.73;
  ui.neckW.value = 0.30; ui.neckX.value = 0.00;
  ui.torsoH.value = 0.85; ui.torsoW.value = 1.50; ui.torsoX.value = 0.00;
  ui.torsoTop.value = 0.60; ui.torsoBot.value = 0.80;
  ui.pelvisR.value = 0.20; ui.pelvisX.value = 0.00;
  ui.showHeads.checked = true; ui.showSub.checked = true;
  draw();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `body_${canvasW}x${canvasH}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

canvas.width = canvasW;
canvas.height = canvasH;
draw();
