<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Голова (С нуля)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Голова (С нуля)</h1>
        
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="zoom-container" id="zoomContainer">
                <div id="bgColorLayer" class="layer bg-color-layer" style="background-color: #ffffff;"></div>
                <svg id="mainSvg" class="layer draw-svg-layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                    <g id="measureLayer"></g>
                    <g id="headLayer"></g>
                    <g id="drawLayer" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="clearBtn">Очистить рисунок</button>
                <button id="resetZoomBtn">Сбросить зум</button>
                <button id="downloadPngBtn">Скачать PNG</button>
            </div>

            <div class="control-group">
                <label>Фон: <input type="color" id="bgColor" value="#ffffff"></label>
                <label>Цвет линий: <input type="color" id="lineColor" value="#ff0000"></label>
                <label>Толщина: <input type="range" id="lineWidth" min="1" max="20" value="4"><span id="lineWidthValue">4</span></label>
            </div>

            <div class="control-group">
                <label>Отступ: <input type="range" id="paddingSize" min="0" max="10" value="0"><span id="paddingSizeValue">0%</span></label>
                <label>Головы: <input type="range" id="headCount" min="2" max="8" value="4"><span id="headCountValue">4</span></label>
                <label><input type="checkbox" id="showGrid" checked> Разметка</label>
            </div>

            <fieldset style="border: 1px solid #444; padding: 10px; border-radius: 6px; margin-top: 10px; width: 100%;">
                <legend><input type="checkbox" id="showHead" checked> Параметры головы</legend>
                
                <div class="control-group">
                    <label>Ширина черепа: <input type="range" id="skullW" min="0.5" max="1.5" step="0.01" value="1.0"><span id="vSkullW">1.00</span></label>
                    <label>Высота черепа: <input type="range" id="skullH" min="0.5" max="1.5" step="0.01" value="1.0"><span id="vSkullH">1.00</span></label>
                </div>
                
                <div class="control-group" style="margin-top: 10px;">
                    <label>Ширина подбородка: <input type="range" id="chinW" min="0" max="1" step="0.01" value="0.4"><span id="vChinW">0.40</span></label>
                    <label>Сдвиг подбородка: <input type="range" id="chinY" min="-0.5" max="0.5" step="0.01" value="0"><span id="vChinY">0.00</span></label>
                </div>

                <div class="control-group" style="margin-top: 10px;">
                    <label>Точка излома Y: <input type="range" id="jawBreakY" min="0" max="1" step="0.01" value="0.5"><span id="vJawBreakY">0.50</span></label>
                    <label>Точка излома X: <input type="range" id="jawBreakX" min="0" max="1" step="0.01" value="0.8"><span id="vJawBreakX">0.80</span></label>
                </div>

                <div class="control-group" style="margin-top: 10px;">
                    <label>Крепление к черепу Y: <input type="range" id="jawAttachY" min="0" max="1" step="0.01" value="0.5"><span id="vJawAttachY">0.50</span></label>
                    <label>Крепление к черепу X: <input type="range" id="jawAttachX" min="0" max="1" step="0.01" value="1.0"><span id="vJawAttachX">1.00</span></label>
                </div>
            </fieldset>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
