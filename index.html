<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="build" content="DEV">
<title>Голова, Торс, Таз, Плечи, Руки и Ноги</title>
<style>
  :root { --bg: #1e1e1e; --panel: #2a2a2a; --text: #eee; --accent: #4a90d9; --border: #444; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .wrap { display: flex; gap: 16px; align-items: flex-start; width: 100%; max-width: 1600px; }
  .panel { flex: 0 0 340px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); padding: 12px; border-radius: 10px; max-height: 92vh; overflow-y: auto; }
  .accordion { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #222; }
  .accordion-header { background: #333; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--accent); user-select: none; }
  .accordion-header:hover { background: #3a3a3a; }
  .accordion-header::after { content: '▼'; font-size: 10px; transition: transform 0.3s; }
  .accordion.open .accordion-header::after { transform: rotate(-180deg); }
  .accordion-content { display: none; padding: 12px; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); }
  .accordion.open .accordion-content { display: flex; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  label .row { display: flex; justify-content: space-between; align-items: center; color: #ccc; }
  label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer; }
  .chk { flex-direction: row; align-items: center; gap: 8px; cursor: pointer; }
  button { padding: 8px 12px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #5aa0e9; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }
  .subhead { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin: 4px 0 2px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .sep { border: none; border-top: 1px solid #444; width: 100%; }
  .stage { flex: 1; min-width: 0; max-height: 92vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: #000; display: flex; justify-content: center; }
  canvas { display: block; max-width: 100%; height: auto; }
  @media (max-width: 900px) {
    .wrap { flex-direction: column; align-items: center; }
    .panel { flex: 0 0 auto; width: 100%; max-height: 50vh; order: 2; }
    .stage { width: 100%; order: 1; max-height: 60vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel" id="panel"></div>
  <div class="stage">
    <canvas id="cv" width="2048" height="3072"></canvas>
  </div>
</div>

<script>
// 1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ХОЛСТА (ОБЪЯВЛЯЕМ СРАЗУ)
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let canvasWidth = canvas.width;
let canvasHeight = canvas.height;
let refImage = null;
let rafPending = false;

const panel = document.getElementById('panel');
const ui = {};
const valEls = {};

const PROPORTIONS = { skullHeight: 3 / 5, chinLine: 4 / 5, torsoTop: 1.0, torsoBottom: 2.0 };

// 2. СХЕМА ПАРАМЕТРОВ
const SCHEMA = (() => {
  const S = {};
  S.showRef = { type: 'checkbox', def: true, label: 'Показывать подложку', group: 'common' };
  S.refOp = { type: 'range', def: 0.5, min: 0, max: 1, step: 0.05, fmt: 2, label: 'Прозрачность', group: 'common' };
  S.heads = { type: 'range', def: 5.0, min: 3, max: 12, step: 0.1, fmt: 1, label: 'Рост в головах', group: 'common' };
  S.lineColor = { type: 'color', def: '#ff3b3b', label: 'Цвет линий', group: 'common' };
  S.lineWidth = { type: 'range', def: 5, min: 1, max: 30, step: 1, fmt: 0, label: 'Толщина', group: 'common' };
  S.showHeads = { type: 'checkbox', def: true, label: 'Показывать секции', group: 'common' };
  S.showSub = { type: 'checkbox', def: true, label: 'Показывать подсекции', group: 'common' };

  S.skullH = { type: 'range', def: 1.0, min: 0.3, max: 1.6, step: 0.01, fmt: 2, label: 'Высота черепа', group: 'head' };
  S.skullW = { type: 'range', def: 1.0, min: 0.5, max: 1.6, step: 0.01, fmt: 2, label: 'Ширина черепа', group: 'head' };
  S.skullX = { type: 'range', def: 0, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение по X', group: 'head' };
  S.chinY  = { type: 'range', def: 0.30, min: -0.5, max: 1.0, step: 0.01, fmt: 2, label: 'Высота подбородка', group: 'head' };
  S.chinW  = { type: 'range', def: 0.00, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Ширина подбородка', group: 'head' };
  S.chinR  = { type: 'range', def: 0.30, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Округлость', group: 'head' };
  S.jawY   = { type: 'range', def: 0.77, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Крепление челюсти (A)', group: 'head' };
  S.jawW   = { type: 'range', def: 0.78, min: 0.3, max: 1.2, step: 0.01, fmt: 2, label: 'Ширина угла (B)', group: 'head' };
  S.jawB   = { type: 'range', def: 0.73, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Высота угла (B)', group: 'head' };

  S.neckW = { type: 'range', def: 0.30, min: 0.1, max: 0.8, step: 0.01, fmt: 2, label: 'Ширина шеи', group: 'neck' };
  S.neckX = { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение шеи по X', group: 'neck' };
  S.shoulderY = { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение плеч по Y', group: 'neck' };
  S.clavY = { type: 'range', def: 0.80, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Высота ключиц', group: 'neck' };
  S.trapY = { type: 'range', def: 0.50, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Трапеция (у шеи)', group: 'neck' };

  S.torsoH   = { type: 'range', def: 0.85, min: 0.5, max: 1.3, step: 0.01, fmt: 2, label: 'Высота торса', group: 'torso' };
  S.torsoW   = { type: 'range', def: 1.50, min: 0.5, max: 2.00, step: 0.01, fmt: 2, label: 'Ширина торса', group: 'torso' };
  S.torsoX   = { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение торса по X', group: 'torso' };
  S.torsoTop = { type: 'range', def: 0.60, min: 0.1, max: 1, step: 0.01, fmt: 2, label: 'Сужение торса сверху', group: 'torso' };
  S.torsoBot = { type: 'range', def: 0.80, min: 0.1, max: 1, step: 0.01, fmt: 2, label: 'Сужение торса снизу', group: 'torso' };
  S.pelvisR  = { type: 'range', def: 0.85, min: 0, max: 1.00, step: 0.01, fmt: 2, label: 'Скругление таза', group: 'torso' };
  S.pelvisX  = { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение таза по X', group: 'torso' };
  S.showAbsLines = { type: 'checkbox', def: true, label: 'Линии от пупка к плечам', group: 'torso' };
  S.absBend = { type: 'range', def: 0.30, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Изгиб линий', group: 'torso' };

  S.showNavel = { type: 'checkbox', def: true, label: 'Показывать пупок', group: 'navel' };
  S.navelType = { type: 'range', def: 0.50, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Тип (Точка → Линия)', group: 'navel' };
  S.navelW    = { type: 'range', def: 0.04, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Ширина линии', group: 'navel' };
  S.navelH    = { type: 'range', def: 0.23, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Высота линии', group: 'navel' };
  S.navelY    = { type: 'range', def: -0.05, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение по Y', group: 'navel' };

  S.showArms = { type: 'checkbox', def: true, label: 'Показывать руки', group: 'arms' };
  S.wristR   = { type: 'range', def: 0.12, min: 0.05, max: 0.40, step: 0.01, fmt: 2, label: 'Радиус запястья', group: 'arms' };
  S.armLw    = { type: 'range', def: 1.0, min: 0.3, max: 2, step: 0.1, fmt: 1, label: 'Толщина рук', group: 'arms' };
  S.showWristBall = { type: 'checkbox', def: true, label: 'Шар запястья', group: 'arms' };
  S.showElbowBall = { type: 'checkbox', def: true, label: 'Шар локтя', group: 'arms' };
  S.showElbow     = { type: 'checkbox', def: true, label: 'Точка локтя', group: 'arms' };
  S.crossPos   = { type: 'range', def: 0.33, min: 0.1, max: 0.9, step: 0.01, fmt: 2, label: 'Позиция метки', group: 'arms' };
  S.crossW     = { type: 'range', def: 1.5, min: 0, max: 3, step: 0.01, fmt: 2, label: 'Ширина расширения', group: 'arms' };
  S.crossRound = { type: 'range', def: 0.50, min: 0, max: 1, step: 0.01, fmt: 2, label: 'Вогнутость', group: 'arms' };

  const armSide = (side, defSign) => ({
    [`${side}ShoulderAngle`]: { type: 'range', def: 0.00, min: -1.5, max: 1.5, step: 0.01, fmt: 2, label: 'Сгиб плеча', group: 'arms' },
    [`${side}ElbowAngle`]:    { type: 'range', def: 0.10, min: -1.5, max: 1.5, step: 0.01, fmt: 2, label: 'Сгиб локтя', group: 'arms' },
    [`${side}WristX`]:        { type: 'range', def: defSign * 0.30, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение запястья X', group: 'arms' },
    [`${side}WristY`]:        { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение запястья Y', group: 'arms' },
  });
  Object.assign(S, armSide('l', -1), armSide('r', +1));

  S.showLegs = { type: 'checkbox', def: true, label: 'Показывать ноги', group: 'legs' };
  S.legR = { type: 'range', def: 0.15, min: 0.05, max: 0.5, step: 0.01, fmt: 2, label: 'Радиус бедра/голени', group: 'legs' };
  S.legLw = { type: 'range', def: 1.0, min: 0.3, max: 2, step: 0.1, fmt: 1, label: 'Толщина ног', group: 'legs' };
  S.showKneeBall = { type: 'checkbox', def: true, label: 'Шар колена', group: 'legs' };
  S.showAnkleBall = { type: 'checkbox', def: true, label: 'Шар стопы', group: 'legs' };
  S.showKneePoint = { type: 'checkbox', def: true, label: 'Точка колена', group: 'legs' };

  const legSide = (side, defSign) => ({
    [`${side}HipAngle`]:   { type: 'range', def: defSign * 0.3, min: -1.5, max: 1.5, step: 0.01, fmt: 2, label: 'Сгиб бедра', group: 'legs' },
    [`${side}KneeAngle`]:  { type: 'range', def: defSign * -0.3, min: -1.5, max: 1.5, step: 0.01, fmt: 2, label: 'Сгиб колена', group: 'legs' },
    [`${side}FootX`]:      { type: 'range', def: defSign * 0.1, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение стопы X', group: 'legs' },
    [`${side}FootY`]:      { type: 'range', def: 0.00, min: -0.5, max: 0.5, step: 0.01, fmt: 2, label: 'Смещение стопы Y', group: 'legs' },
  });
  Object.assign(S, legSide('l', -1), legSide('r', +1));

  return S;
})();

const GROUPS = [
  { id: 'common', title: 'Общее и Подложка', open: true },
  { id: 'head',   title: 'Голова (Череп и Челюсть)' },
  { id: 'neck',   title: 'Шея, Плечи и Ключицы' },
  { id: 'torso',  title: 'Торс и Таз' },
  { id: 'navel',  title: 'Пупок' },
  { id: 'arms',   title: 'Руки', open: true },
  { id: 'legs',   title: 'Ноги', open: true },
];

// 3. ФУНКЦИИ ИНТЕРФЕЙСА
function buildPanel() {
  const containerByGroup = {};
  for (const g of GROUPS) {
    const acc = document.createElement('div');
    acc.className = 'accordion' + (g.open ? ' open' : '');
    acc.innerHTML = `<div class="accordion-header">${g.title}</div><div class="accordion-content"></div>`;
    panel.appendChild(acc);
    acc.querySelector('.accordion-header').addEventListener('click', () => acc.classList.toggle('open'));
    containerByGroup[g.id] = acc.querySelector('.accordion-content');
  }

  const orderCommon = ['showRef','refOp','__upload','heads','lineColor','lineWidth','showHeads','showSub'];
  const orderHead = ['skullH','skullW','skullX','__sep','chinY','chinW','chinR','__sep','jawY','jawW','jawB'];
  const orderNeck = ['neckW','neckX','__sep','shoulderY','clavY','trapY'];
  const orderTorso = ['torsoH','torsoW','torsoX','torsoTop','torsoBot','__sep','pelvisR','pelvisX','__sep','showAbsLines','absBend'];
  const orderNavel = ['showNavel','navelType','navelW','navelH','navelY'];
  const orderArms = ['showArms','wristR','armLw','showWristBall','showElbowBall','showElbow',
                     '__sub:Метка на предплечье','crossPos','crossW','crossRound',
                     '__sep','__sub:Левая рука','lShoulderAngle','lElbowAngle','lWristX','lWristY',
                     '__sep','__sub:Правая рука','rShoulderAngle','rElbowAngle','rWristX','rWristY'];
  const orderLegs = ['showLegs','legR','legLw','showKneeBall','showAnkleBall','showKneePoint',
                     '__sep','__sub:Левая нога','lHipAngle','lKneeAngle','lFootX','lFootY',
                     '__sep','__sub:Правая нога','rHipAngle','rKneeAngle','rFootX','rFootY'];

  const order = { common: orderCommon, head: orderHead, neck: orderNeck, torso: orderTorso, navel: orderNavel, arms: orderArms, legs: orderLegs };

  for (const g of GROUPS) {
    const box = containerByGroup[g.id];
    for (const item of order[g.id]) {
      if (item === '__sep') { box.appendChild(makeSep()); continue; }
      if (item === '__upload') { box.appendChild(makeUploadRow()); continue; }
      if (item.startsWith('__sub:')) { box.appendChild(makeSubhead(item.slice(6))); continue; }
      const cfg = SCHEMA[item];
      if (!cfg) continue;
      box.appendChild(makeField(item, cfg));
    }
  }
}

function makeSep() { const hr = document.createElement('hr'); hr.className = 'sep'; return hr; }
function makeSubhead(text) { const d = document.createElement('div'); d.className = 'subhead'; d.textContent = text; return d; }
function makeUploadRow() {
  const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex; flex-direction:column; gap:6px;';
  const btn = document.createElement('button'); btn.className = 'sec'; btn.textContent = 'Загрузить картинку';
  const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.style.display = 'none';
  btn.addEventListener('click', () => file.click());
  file.addEventListener('change', onFileChange);
  wrap.appendChild(btn); wrap.appendChild(file); return wrap;
}

function makeField(key, cfg) {
  if (cfg.type === 'checkbox') {
    const label = document.createElement('label'); label.className = 'chk';
    const input = document.createElement('input'); input.type = 'checkbox'; input.id = key; input.checked = !!cfg.def;
    input.addEventListener('input', scheduleDraw);
    label.appendChild(input); label.appendChild(document.createTextNode(cfg.label));
    ui[key] = input; return label;
  }
  if (cfg.type === 'color') {
    const label = document.createElement('label');
    const row = document.createElement('span'); row.className = 'row'; row.textContent = cfg.label;
    const input = document.createElement('input'); input.type = 'color'; input.id = key; input.value = cfg.def;
    input.addEventListener('input', scheduleDraw);
    label.appendChild(row); label.appendChild(input); ui[key] = input; return label;
  }
  const label = document.createElement('label');
  const row = document.createElement('span'); row.className = 'row';
  const txt = document.createElement('span'); txt.textContent = cfg.label;
  const val = document.createElement('span'); val.className = 'val'; val.id = 'v_' + key;
  val.textContent = formatVal(cfg.def, cfg.fmt);
  row.appendChild(txt); row.appendChild(val);
  const input = document.createElement('input'); input.type = 'range'; input.id = key;
  input.min = cfg.min; input.max = cfg.max; input.step = cfg.step; input.value = cfg.def;
  input.addEventListener('input', scheduleDraw); input.addEventListener('change', scheduleDraw);
  label.appendChild(row); label.appendChild(input);
  ui[key] = input; valEls[key] = { el: val, fmt: cfg.fmt };
  return label;
}

function formatVal(v, fmt) { if (fmt === 0) return String(Math.round(v)); return Number(v).toFixed(fmt ?? 2); }
function updateLabels() {
  for (const key in valEls) { const { el, fmt } = valEls[key]; el.textContent = formatVal(ui[key].value, fmt); }
}
function readParams() {
  const P = {};
  for (const key in SCHEMA) {
    const cfg = SCHEMA[key];
    if (cfg.type === 'checkbox') P[key] = ui[key].checked;
    else if (cfg.type === 'color') P[key] = ui[key].value;
    else P[key] = parseFloat(ui[key].value);
  }
  return P;
}

// 4. ГЕОМЕТРИЯ И СБОРКА СКЕЛЕТА
function ellipseDx(y, cy, rY) { const t = (y - cy) / rY; return Math.sqrt(Math.max(0, 1 - t * t)); }
function jawAttachPoint(skull, param) { return skull.bottom - (skull.bottom - skull.cy) * param; }

function buildArm(shoulder, wristBase, shoulderAngle, elbowAngle, ballRadius) {
  const dx = wristBase.x - shoulder.x;
  const dy = wristBase.y - shoulder.y;
  const cosA = Math.cos(shoulderAngle); const sinA = Math.sin(shoulderAngle);
  const rx = dx * cosA - dy * sinA; const ry = dx * sinA + dy * cosA;
  const wrist = { x: shoulder.x + rx, y: shoulder.y + ry };
  const mx = (shoulder.x + wrist.x) / 2; const my = (shoulder.y + wrist.y) / 2;
  const len = Math.hypot(rx, ry) || 1;
  const px = -ry / len; const py = rx / len;
  const elbow = { x: mx + px * elbowAngle * len * 0.5, y: my + py * elbowAngle * len * 0.5 };
  return { shoulder, elbow, wrist, ballRadius };
}

function computeSkeleton(P, W, H) {
  const sk = {};
  const cx = W / 2;
  const headStep = H / P.heads;

  // Голова
  const baseR = headStep * PROPORTIONS.skullHeight / 2;
  const rX = baseR * P.skullW; const rY = baseR * P.skullH;
  const cy = baseR; const headCx = cx + P.skullX * rX;
  const skullTop = cy - rY; const skullBottom = cy + rY;
  const chinBaseY = headStep * PROPORTIONS.chinLine;
  const chinCenterY = chinBaseY + P.chinY * (headStep / 5);
  const chinHalfW = P.chinW * rX * 0.7; const chinRound = P.chinR * chinHalfW;
  const jawAttachY = jawAttachPoint({ bottom: skullBottom, cy }, P.jawY);
  const attachDx = ellipseDx(jawAttachY, cy, rY);
  const attachLeft  = { x: headCx - rX * attachDx, y: jawAttachY };
  const attachRight = { x: headCx + rX * attachDx, y: jawAttachY };
  const cornerLeft  = { x: headCx - rX * P.jawW, y: jawAttachY + (chinCenterY - jawAttachY) * P.jawB };
  const cornerRight = { x: headCx + rX * P.jawW, y: jawAttachY + (chinCenterY - jawAttachY) * P.jawB };
  let chinLeft, chinRight;
  if (chinHalfW < 1.5) { chinLeft = chinRight = { x: headCx, y: chinCenterY }; }
  else { chinLeft = { x: headCx - chinHalfW, y: chinCenterY }; chinRight = { x: headCx + chinHalfW, y: chinCenterY }; }

  sk.head = {
    cx: headCx, cy, rX, rY, top: skullTop, bottom: skullBottom,
    chin: { centerY: chinCenterY, halfW: chinHalfW, round: chinRound, left: chinLeft, right: chinRight },
    jaw:  { attachY: jawAttachY, attachLeft, attachRight, cornerLeft, cornerRight },
  };

  // Шея
  const neckHalfW = rX * P.neckW; const neckCx = headCx + P.neckX * rX;
  const neckTopY = chinCenterY - headStep / 10; const neckBotY = headStep;

  // Торс
  const torsoTopY = headStep * PROPORTIONS.torsoTop; const torsoBotY = headStep * PROPORTIONS.torsoBottom;
  const baseTorsoH = torsoBotY - torsoTopY; const baseTorsoW = rX * 1.5;
  const torsoCenterY = torsoTopY + (baseTorsoH * P.torsoH) / 2;
  const torsoRX = (baseTorsoW * P.torsoW) / 2; const torsoRY = (baseTorsoH * P.torsoH) / 2;
  const torsoCx = cx + P.torsoX * torsoRX;
  const torsoTopActualY = torsoCenterY - torsoRY; const torsoBottomY = torsoCenterY + torsoRY;

  sk.torso = { cx: torsoCx, cy: torsoCenterY, rX: torsoRX, rY: torsoRY, topY: torsoTopActualY, botY: torsoBottomY, topSqueeze: P.torsoTop, botSqueeze: P.torsoBot };

  // Плечи
  const torsoSubStep = (torsoBottomY - torsoTopActualY) / 3;
  const shoulderCy = torsoTopActualY + torsoSubStep / 2 + P.shoulderY * torsoSubStep;
  const shoulderRadius = torsoSubStep / 2;
  const dyNorm = (shoulderCy - torsoCenterY) / torsoRY;
  const torsoWidthAtShoulder = torsoRX * Math.sqrt(Math.max(0, 1 - dyNorm * dyNorm));
  const shoulderLeftCx  = torsoCx - torsoWidthAtShoulder - shoulderRadius;
  const shoulderRightCx = torsoCx + torsoWidthAtShoulder + shoulderRadius;
  const neckBaseY = neckBotY - headStep * 0.1 * (1 - P.trapY);
  const neckBaseLeftX  = neckCx - neckHalfW; const neckBaseRightX = neckCx + neckHalfW;
  const trapLeftAttach  = { x: shoulderLeftCx + shoulderRadius * 0.2,  y: shoulderCy - shoulderRadius };
  const trapRightAttach = { x: shoulderRightCx - shoulderRadius * 0.2, y: shoulderCy - shoulderRadius };
  const clavLeftAttach  = { x: shoulderLeftCx + shoulderRadius * 0.9,  y: shoulderCy - shoulderRadius * P.clavY };
  const clavRightAttach = { x: shoulderRightCx - shoulderRadius * 0.9, y: shoulderCy - shoulderRadius * P.clavY };
  const clavTorsoAttachY = torsoTopActualY + torsoRY * 0.2;

  sk.neck = { cx: neckCx, halfW: neckHalfW, topY: neckTopY, botY: neckBotY, baseY: neckBaseY, baseLeftX: neckBaseLeftX, baseRightX: neckBaseRightX };
  sk.shoulders = {
    left:  { cx: shoulderLeftCx,  cy: shoulderCy, r: shoulderRadius },
    right: { cx: shoulderRightCx, cy: shoulderCy, r: shoulderRadius },
    trapLeftAttach, trapRightAttach, clavLeftAttach, clavRightAttach, clavTorsoAttachY,
  };

  // Таз
  const torsoWidth = torsoRX * 2; const torsoHeight = torsoRY * 2;
  const pelvisW = torsoHeight; const pelvisH = torsoWidth;
  const pelvisTopY = torsoBottomY; const pelvisCx = torsoCx + P.pelvisX * pelvisW;
  const pelvisXPos = pelvisCx - pelvisW / 2; const pelvisYPos = pelvisTopY;
  const maxRadius = Math.min(pelvisW, pelvisH) / 2; const cornerRadius = maxRadius * P.pelvisR;

  const pelvis = { x: pelvisXPos, y: pelvisYPos, w: pelvisW, h: pelvisH, cx: pelvisCx, r: cornerRadius, botY: pelvisYPos + pelvisH };
  sk.pelvis = pelvis;

  // Пупок
  const totalTorsoPelvisH = pelvis.botY - torsoTopActualY; const navelThird = totalTorsoPelvisH / 3;
  const navelCenterY = torsoTopActualY + navelThird * 2 + P.navelY * totalTorsoPelvisH;
  sk.navel = { x: torsoCx, y: navelCenterY, lineW: P.navelW * torsoRX * P.navelType, lineH: P.navelH * torsoRY * P.navelType, type: P.navelType };

  // Руки
  const wristRadius = Math.max(1, pelvisH * P.wristR);
  const lWristBase = { x: pelvisXPos - wristRadius + P.lWristX * pelvisW, y: pelvis.botY - wristRadius + P.lWristY * pelvisH };
  const rWristBase = { x: pelvisXPos + pelvisW + wristRadius + P.rWristX * pelvisW, y: pelvis.botY - wristRadius + P.rWristY * pelvisH };
  sk.arms = {
    wristRadius,
    l: buildArm({ x: shoulderLeftCx,  y: shoulderCy }, lWristBase, -P.lShoulderAngle, -P.lElbowAngle, wristRadius),
    r: buildArm({ x: shoulderRightCx, y: shoulderCy }, rWristBase,  P.rShoulderAngle,  P.rElbowAngle, wristRadius),
  };

  // Ноги
  const legRadius = Math.max(1, pelvisH * P.legR);
  const hipLeftAnchor  = { x: pelvisXPos + pelvis.w * 0.25, y: pelvis.botY };
  const hipRightAnchor = { x: pelvisXPos + pelvis.w * 0.75, y: pelvis.botY };
  
  const footBaseY = H * 0.90;

  const lFootBase = { x: hipLeftAnchor.x + P.lFootX * pelvisW, y: footBaseY + P.lFootY * pelvisH };
  const rFootBase = { x: hipRightAnchor.x + P.rFootX * pelvisW, y: footBaseY + P.rFootY * pelvisH };

  sk.legs = {
    legRadius,
    l: buildArm(hipLeftAnchor,  lFootBase, -P.lHipAngle, -P.lKneeAngle, legRadius),
    r: buildArm(hipRightAnchor, rFootBase,  P.rHipAngle,  P.rKneeAngle, legRadius),
  };

  sk.grid = { headLines: Array.from({ length: Math.floor(P.heads) + 1 }, (_, i) => i * headStep) };
  return sk;
}

// 5. ОТРИСОВКА
function renderReference(ctx, sk, P, W, H) {
  if (!refImage || !P.showRef) return;
  ctx.save(); ctx.globalAlpha = P.refOp || 0.5; ctx.drawImage(refImage, 0, 0, W, H); ctx.restore();
}

function renderGrid(ctx, sk, P, W) {
  if (P.showHeads) {
    ctx.save(); ctx.strokeStyle = 'rgba(180,180,180,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    ctx.beginPath(); for (const y of sk.grid.headLines) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke(); ctx.restore();
  }
  if (P.showSub) {
    ctx.save(); ctx.strokeStyle = 'rgba(100,150,255,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([10, 15]);
    const head = sk.head; const hStep = (head.chin.centerY - head.top) / 5;
    ctx.beginPath(); for (let i = 1; i < 5; i++) { ctx.moveTo(0, head.top + hStep * i); ctx.lineTo(W, head.top + hStep * i); } ctx.stroke();
    const t = sk.torso; const tStep = (t.botY - t.topY) / 3;
    ctx.beginPath(); for (let i = 1; i < 3; i++) { ctx.moveTo(0, t.topY + tStep * i); ctx.lineTo(W, t.topY + tStep * i); } ctx.stroke();
    const p = sk.pelvis; const pStep = p.h / 2;
    ctx.beginPath(); for (let i = 1; i < 2; i++) { ctx.moveTo(0, p.y + pStep * i); ctx.lineTo(W, p.y + pStep * i); } ctx.stroke();
    ctx.restore();
  }
}

function renderShoulders(ctx, sk) {
  ctx.save();
  ctx.beginPath(); ctx.arc(sk.shoulders.left.cx, sk.shoulders.left.cy, sk.shoulders.left.r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(sk.shoulders.right.cx, sk.shoulders.right.cy, sk.shoulders.right.r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function renderClavicles(ctx, sk) {
  const s = sk.shoulders; const n = sk.neck;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(s.trapLeftAttach.x, s.trapLeftAttach.y); ctx.lineTo(n.baseLeftX, n.baseY);
  ctx.moveTo(s.trapRightAttach.x, s.trapRightAttach.y); ctx.lineTo(n.baseRightX, n.baseY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s.clavLeftAttach.x, s.clavLeftAttach.y); ctx.lineTo(sk.torso.cx, s.clavTorsoAttachY);
  ctx.moveTo(s.clavRightAttach.x, s.clavRightAttach.y); ctx.lineTo(sk.torso.cx, s.clavTorsoAttachY);
  ctx.stroke(); ctx.restore();
}

function torsoPath(t) {
  const p = new Path2D();
  p.moveTo(t.cx, t.cy - t.rY);
  p.bezierCurveTo(t.cx + t.rX * t.topSqueeze, t.cy - t.rY, t.cx + t.rX, t.cy - t.rY * 0.2, t.cx + t.rX, t.cy);
  p.bezierCurveTo(t.cx + t.rX, t.cy + t.rY * 0.5, t.cx + t.rX * t.botSqueeze, t.cy + t.rY, t.cx, t.cy + t.rY);
  p.bezierCurveTo(t.cx - t.rX * t.botSqueeze, t.cy + t.rY, t.cx - t.rX, t.cy + t.rY * 0.5, t.cx - t.rX, t.cy);
  p.bezierCurveTo(t.cx - t.rX, t.cy - t.rY * 0.2, t.cx - t.rX * t.topSqueeze, t.cy - t.rY, t.cx, t.cy - t.rY);
  return p;
}

function renderTorso(ctx, sk) { ctx.save(); ctx.stroke(torsoPath(sk.torso)); ctx.restore(); }

function pelvisPath(p) {
  const path = new Path2D();
  path.moveTo(p.x + p.r, p.y); path.lineTo(p.x + p.w - p.r, p.y);
  path.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + p.r);
  path.lineTo(p.x + p.w, p.y + p.h - p.r);
  path.quadraticCurveTo(p.x + p.w, p.y + p.h, p.x + p.w - p.r, p.y + p.h);
  path.lineTo(p.x + p.r, p.y + p.h);
  path.quadraticCurveTo(p.x, p.y + p.h, p.x, p.y + p.h - p.r);
  path.lineTo(p.x, p.y + p.r);
  path.quadraticCurveTo(p.x, p.y, p.x + p.r, p.y);
  return path;
}

function renderPelvis(ctx, sk) { ctx.save(); ctx.stroke(pelvisPath(sk.pelvis)); ctx.restore(); }

function renderAbsLines(ctx, sk, P) {
  if (!P.showAbsLines) return;
  const t = sk.torso; const nav = sk.navel; const s = sk.shoulders;
  ctx.save(); ctx.clip(torsoPath(t));
  const bend = P.absBend;
  ctx.beginPath(); ctx.moveTo(t.cx, nav.y);
  ctx.quadraticCurveTo(t.cx - (t.cx - s.trapLeftAttach.x) * bend, nav.y - (nav.y - s.trapLeftAttach.y) * 0.5, s.trapLeftAttach.x, s.trapLeftAttach.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(t.cx, nav.y);
  ctx.quadraticCurveTo(t.cx + (s.trapRightAttach.x - t.cx) * bend, nav.y - (nav.y - s.trapRightAttach.y) * 0.5, s.trapRightAttach.x, s.trapRightAttach.y); ctx.stroke();
  ctx.restore();
}

function renderNavel(ctx, sk, P) {
  if (!P.showNavel) return;
  const nav = sk.navel; const lw = P.lineWidth;
  ctx.save(); ctx.strokeStyle = P.lineColor; ctx.fillStyle = P.lineColor; ctx.lineWidth = lw;
  if (nav.type < 0.05) {
    ctx.beginPath(); ctx.arc(nav.x, nav.y, Math.max(3, lw * 1.5), 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(nav.x, nav.y, Math.max(1, nav.lineW / 2), Math.max(1, nav.lineH / 2), 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function renderNeck(ctx, sk) {
  const head = sk.head; const neck = sk.neck;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, canvasWidth, neck.botY);
  ctx.clip();
  ctx.beginPath();
  ctx.ellipse(head.cx, head.cy, head.rX, head.rY, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.beginPath();
  ctx.moveTo(neck.cx - neck.halfW, neck.topY);
  ctx.lineTo(neck.cx - neck.halfW, neck.botY);
  ctx.lineTo(neck.cx + neck.halfW, neck.botY);
  ctx.lineTo(neck.cx + neck.halfW, neck.topY);
  ctx.stroke();
  ctx.restore();
}

function renderHead(ctx, sk, P) {
  const h = sk.head;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(h.cx, h.cy, h.rX, h.rY, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(h.jaw.attachLeft.x, h.jaw.attachLeft.y); ctx.lineTo(h.jaw.cornerLeft.x, h.jaw.cornerLeft.y);
  ctx.lineTo(h.chin.halfW < 1.5 ? h.cx : h.chin.left.x, h.chin.halfW < 1.5 ? h.chin.centerY : h.chin.left.y); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(h.jaw.attachRight.x, h.jaw.attachRight.y); ctx.lineTo(h.jaw.cornerRight.x, h.jaw.cornerRight.y);
  ctx.lineTo(h.chin.halfW < 1.5 ? h.cx : h.chin.right.x, h.chin.halfW < 1.5 ? h.chin.centerY : h.chin.right.y); ctx.stroke();
  if (h.chin.halfW < 1.5) {
    ctx.beginPath(); ctx.arc(h.cx, h.chin.centerY, Math.max(3, P.lineWidth), 0, Math.PI * 2);
    ctx.fillStyle = P.lineColor; ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(h.chin.left.x, h.chin.left.y);
    if (h.chin.round < 1) ctx.lineTo(h.chin.right.x, h.chin.right.y);
    else ctx.quadraticCurveTo(h.cx, h.chin.centerY + (h.chin.round / h.chin.halfW) * h.chin.halfW * 0.8, h.chin.right.x, h.chin.right.y);
    ctx.stroke();
  }
  ctx.restore();
}

function renderArms(ctx, sk, P) {
  if (!P.showArms) return;
  const lw = Math.max(1, P.lineWidth * P.armLw);
  ctx.save(); ctx.lineWidth = lw; ctx.setLineDash([]); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  drawOneArm(ctx, sk.arms.l, true, sk, P);
  drawOneArm(ctx, sk.arms.r, false, sk, P);
  ctx.restore();
}

function drawOneArm(ctx, arm, isLeft, sk, P) {
  const { shoulder, elbow, wrist, ballRadius: br } = arm;
  const innerSign = isLeft ? 1 : -1;
  const color = P.lineColor;
  const dx1 = elbow.x - shoulder.x, dy1 = elbow.y - shoulder.y;
  const len1 = Math.hypot(dx1, dy1) || 1;
  const nx1 = -dy1 / len1, ny1 = dx1 / len1;
  const p1Outer = { x: shoulder.x + nx1 * innerSign * sk.shoulders.left.r, y: shoulder.y + ny1 * innerSign * sk.shoulders.left.r };
  const p1Inner = { x: shoulder.x - nx1 * innerSign * sk.shoulders.left.r, y: shoulder.y - ny1 * innerSign * sk.shoulders.left.r };
  const p2Outer = { x: elbow.x + nx1 * innerSign * br, y: elbow.y + ny1 * innerSign * br };
  const p2Inner = { x: elbow.x - nx1 * innerSign * br, y: elbow.y - ny1 * innerSign * br };
  ctx.beginPath(); ctx.moveTo(p1Outer.x, p1Outer.y); ctx.lineTo(p2Outer.x, p2Outer.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p1Inner.x, p1Inner.y); ctx.lineTo(p2Inner.x, p2Inner.y); ctx.stroke();
  const dx2 = wrist.x - elbow.x, dy2 = wrist.y - elbow.y;
  const len2 = Math.hypot(dx2, dy2) || 1;
  const px = -dy2 / len2, py = dx2 / len2;
  const peakT = P.crossPos; const peakX = elbow.x + dx2 * peakT, peakY = elbow.y + dy2 * peakT;
  const maxWidth = br * P.crossW; const crossRound = P.crossRound;
  const elbowOuter = { x: elbow.x + px * innerSign * br, y: elbow.y + py * innerSign * br };
  const elbowInner = { x: elbow.x - px * innerSign * br, y: elbow.y - py * innerSign * br };
  const peakOuter  = { x: peakX + px * innerSign * maxWidth, y: peakY + py * innerSign * maxWidth };
  const peakInner  = { x: peakX - px * innerSign * maxWidth, y: peakY - py * innerSign * maxWidth };
  const wristOuter = { x: wrist.x + px * innerSign * br, y: wrist.y + py * innerSign * br };
  const wristInner = { x: wrist.x - px * innerSign * br, y: wrist.y - py * innerSign * br };
  ctx.beginPath(); ctx.moveTo(elbowOuter.x, elbowOuter.y);
  ctx.quadraticCurveTo(elbow.x + dx2 * (peakT * 0.5) + px * innerSign * maxWidth * 0.8, elbow.y + dy2 * (peakT * 0.5) + py * innerSign * maxWidth * 0.8, peakOuter.x, peakOuter.y);
  ctx.quadraticCurveTo(peakX + dx2 * (1 - peakT) * 0.5 + px * innerSign * br * 1.1, peakY + dy2 * (1 - peakT) * 0.5 + py * innerSign * br * 1.1, wristOuter.x, wristOuter.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(elbowInner.x, elbowInner.y);
  ctx.quadraticCurveTo(elbow.x + dx2 * (peakT * 0.5) - px * innerSign * maxWidth * (1 - crossRound * 0.5), elbow.y + dy2 * (peakT * 0.5) - py * innerSign * maxWidth * (1 - crossRound * 0.5), peakInner.x, peakInner.y);
  ctx.quadraticCurveTo(peakX + dx2 * (1 - peakT) * 0.5 - px * innerSign * br * (1 - crossRound), peakY + dy2 * (1 - peakT) * 0.5 - py * innerSign * br * (1 - crossRound), wristInner.x, wristInner.y); ctx.stroke();
  if (P.showElbow) {
    ctx.beginPath(); ctx.arc(elbow.x, elbow.y, Math.max(3, P.lineWidth * 0.8), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  if (P.showElbowBall) { ctx.beginPath(); ctx.arc(elbow.x, elbow.y, br, 0, Math.PI * 2); ctx.stroke(); }
  if (P.showWristBall) { ctx.beginPath(); ctx.arc(wrist.x, wrist.y, br, 0, Math.PI * 2); ctx.stroke(); }
}

function renderLegs(ctx, sk, P) {
  if (!P.showLegs) return;
  const lw = Math.max(1, P.lineWidth * P.legLw);
  ctx.save(); ctx.lineWidth = lw; ctx.setLineDash([]); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  drawOneLeg(ctx, sk.legs.l, true, sk, P);
  drawOneLeg(ctx, sk.legs.r, false, sk, P);
  ctx.restore();
}

function drawOneLeg(ctx, leg, isLeft, sk, P) {
  const { shoulder: hip, elbow: knee, wrist: ankle, ballRadius: br } = leg;
  const innerSign = isLeft ? 1 : -1;
  const color = P.lineColor;
  const dx1 = knee.x - hip.x, dy1 = knee.y - hip.y;
  const len1 = Math.hypot(dx1, dy1) || 1;
  const nx1 = -dy1 / len1, ny1 = dx1 / len1;
  const hipOuter = { x: hip.x + nx1 * innerSign * br, y: hip.y + ny1 * innerSign * br };
  const hipInner = { x: hip.x - nx1 * innerSign * br, y: hip.y - ny1 * innerSign * br };
  const kneeOuter = { x: knee.x + nx1 * innerSign * br, y: knee.y + ny1 * innerSign * br };
  const kneeInner = { x: knee.x - nx1 * innerSign * br, y: knee.y - ny1 * innerSign * br };
  ctx.beginPath(); ctx.moveTo(hipOuter.x, hipOuter.y); ctx.lineTo(kneeOuter.x, kneeOuter.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hipInner.x, hipInner.y); ctx.lineTo(kneeInner.x, kneeInner.y); ctx.stroke();
  const dx2 = ankle.x - knee.x, dy2 = ankle.y - knee.y;
  const len2 = Math.hypot(dx2, dy2) || 1;
  const px = -dy2 / len2, py = dx2 / len2;
  const ankleOuter = { x: ankle.x + px * innerSign * br, y: ankle.y + py * innerSign * br };
  const ankleInner = { x: ankle.x - px * innerSign * br, y: ankle.y - py * innerSign * br };
  ctx.beginPath(); ctx.moveTo(kneeOuter.x, kneeOuter.y); ctx.lineTo(ankleOuter.x, ankleOuter.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(kneeInner.x, kneeInner.y); ctx.lineTo(ankleInner.x, ankleInner.y); ctx.stroke();
  if (P.showKneePoint) {
    ctx.beginPath(); ctx.arc(knee.x, knee.y, Math.max(3, P.lineWidth * 0.8), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  if (P.showKneeBall) { ctx.beginPath(); ctx.arc(knee.x, knee.y, br, 0, Math.PI * 2); ctx.stroke(); }
  if (P.showAnkleBall) { ctx.beginPath(); ctx.arc(ankle.x, ankle.y, br, 0, Math.PI * 2); ctx.stroke(); }
}

// 6. ГЛАВНЫЙ ЦИКЛ
function draw() {
  const W = canvasWidth; const H = canvasHeight;
  const P = readParams();
  const sk = computeSkeleton(P, W, H);

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = P.lineColor; ctx.lineWidth = P.lineWidth; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const LAYERS = [
    ['reference',   renderReference],
    ['grid',        renderGrid],
    ['shoulders',   renderShoulders],
    ['clavicles',   renderClavicles],
    ['torso',       renderTorso],
    ['pelvis',      renderPelvis],
    ['absLines',    renderAbsLines],
    ['navel',       renderNavel],
    ['neck',        renderNeck],
    ['head',        renderHead],
    ['arms',        renderArms],
    ['legs',        renderLegs],
  ];

  for (const [name, fn] of LAYERS) {
    ctx.save(); fn(ctx, sk, P, W, H); ctx.restore();
  }
  ctx.restore();
  updateLabels();
}

function scheduleDraw() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; draw(); });
}

function onFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      refImage = img;
      const ratio = img.width / img.height;
      canvasWidth = Math.round(canvasHeight * ratio);
      canvas.width = canvasWidth; canvas.height = canvasHeight;
      draw();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function addButtons() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; gap:10px; margin-top:10px;';

  const resetBtn = document.createElement('button');
  resetBtn.className = 'sec'; resetBtn.style.flex = '1'; resetBtn.textContent = 'Сбросить';
  resetBtn.addEventListener('click', () => {
    for (const key in SCHEMA) {
      const cfg = SCHEMA[key];
      const el = ui[key];
      if (cfg.type === 'checkbox') el.checked = !!cfg.def;
      else el.value = cfg.def;
    }
    draw();
  });

  const dlBtn = document.createElement('button');
  dlBtn.style.flex = '1'; dlBtn.textContent = 'Скачать PNG';
  dlBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `body_${canvasWidth}x${canvasHeight}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  wrap.appendChild(resetBtn); wrap.appendChild(dlBtn);
  panel.appendChild(wrap);
}

// 7. ИНИЦИАЛИЗАЦИЯ
buildPanel();
addButtons();
draw();
</script>
</body>
