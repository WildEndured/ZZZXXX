<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Canvas 4096x4096</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <button id="btn-undo" class="tool-btn" title="Отменить">↶</button>
            <button id="btn-redo" class="tool-btn" title="Повторить">↷</button>
            <button id="btn-clear" class="tool-btn" title="Очистить">🗑</button>
            <button id="btn-eraser" class="tool-btn" title="Ластик">◻</button>
            <input type="color" id="color-picker" value="#000000" class="color-input">
            <input type="range" id="brush-size" min="1" max="100" value="5" class="size-slider">
            <span id="size-label">5</span>
            <button id="btn-download" class="tool-btn" title="Скачать">⬇</button>
        </header>

        <main class="canvas-container" id="canvas-container">
            <canvas id="canvas"></canvas>
        </main>

        <div class="info">
            <span id="coord-info">0, 0</span>
            <span id="zoom-info">100%</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
