name: Deploy with Cache Bust

on:
  push:
    branches: ["V1.3"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Cache Bust
        run: |
          # 1. Создаем папку для сборки
          mkdir -p dist
          
          # 2. Копируем все файлы в dist
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/
          
          # 3. Генерируем уникальный хэш
          HASH=$(date +%s)
          echo "Version: $HASH"
          
          # 4. Переименовываем все JS файлы, добавляя хэш
          find dist/js -name "*.js" | while read file; do
            dir=$(dirname "$file")
            filename=$(basename "$file" .js)
            mv "$file" "${dir}/${filename}.${HASH}.js"
          done
          
          # 5. Переименовываем CSS
          if [ -f dist/style.css ]; then
            mv dist/style.css dist/style.${HASH}.css
          fi
          
          # 6. Обновляем импорты внутри JS файлов
          find dist/js -name "*.js" | while read file; do
            sed -i -E "s|from ['\"](\.{1,2}/[^'\"]+)\.js['\"]|from '\1.${HASH}.js'|g" "$file"
          done
          
          # 7. Обновляем index.html
          sed -i "s|src=\"js/main.js\"|src=\"js/main.${HASH}.js\"|g" dist/index.html
          sed -i "s|href=\"style.css\"|href=\"style.${HASH}.css\"|g" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
