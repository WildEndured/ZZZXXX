<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Голова и Торс — 4096×4096 @300dpi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1e1e1e; color: #eee;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .wrap { display: flex; gap: 16px; align-items: flex-start; width: 100%; max-width: 1600px; }
  .panel {
    flex: 0 0 320px; display: flex; flex-direction: column; gap: 10px;
    background: #2a2a2a; padding: 14px; border-radius: 10px;
    max-height: 88vh; overflow-y: auto;
  }
  .panel h3 { margin: 6px 0 2px; font-size: 14px; color: #8ec4ff; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .panel label .row { display: flex; justify-content: space-between; align-items: center; }
  .panel label .val { color: #8ec4ff; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; }
  input[type="color"] { width: 42px; height: 28px; border: none; background: none; cursor: pointer; }
  button { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; background: #4a90d9; color: #fff; font-size: 13px; }
  button:hover { background: #5aa0e9; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }
  .stage { flex: 1; min-width: 0; max-height: 88vh; overflow: auto; border: 1px solid #444; border-radius: 8px; background: #000; }
  canvas { display: block; max-width: 100%; height: auto; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <h3>Общее</h3>
    <label>
      <span class="row">Рост в головах <span class="val" id="vHeads">8</span></span>
      <input type="range" id="heads" min="3" max="12" step="0.1" value="8">
    </label>
    <label>
      <span class="row">Цвет линий</span>
      <input type="color" id="lineColor" value="#ff3b3b">
    </label>
    <label>
      <span class="row">Толщина линий <span class="val" id="vWidth">5</span></span>
      <input type="range" id="lineWidth" min="1" max="30" step="1" value="5">
    </label>
    <label class="chk"><input type="checkbox" id="showHeads" checked> Показывать линии голов</label>
    <label class="chk"><input type="checkbox" id="showSub" checked> Показывать подсекции</label>

    <h3>Голова</h3>
    <label><span class="row">Высота черепа <span class="val" id="vSkullH">1.00</span></span><input type="range" id="skullH" min="0.3" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Ширина черепа <span class="val" id="vSkullW">1.00</span></span><input type="range" id="skullW" min="0.5" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Ширина челюсти <span class="val" id="vJawW">0.85</span></span><input type="range" id="jawW" min="0.3" max="1.2" step="0.01" value="0.85"></label>
    <label><span class="row">Высота угла челюсти <span class="val" id="vJawB">0.50</span></span><input type="range" id="jawB" min="0" max="1" step="0.01" value="0.5"></label>

    <h3>Шея</h3>
    <label><span class="row">Ширина шеи <span class="val" id="vNeckW">0.40</span></span><input type="range" id="neckW" min="0.1" max="0.8" step="0.01" value="0.4"></label>
    <label><span class="row">Смещение по X <span class="val" id="vNeckX">0.00</span></span><input type="range" id="neckX" min="-0.5" max="0.5" step="0.01" value="0"></label>

    <h3>Торс (Секция 1)</h3>
    <label><span class="row">Ширина: Плечи (верх) <span class="val" id="vTorsoW1">0.80</span></span><input type="range" id="torsoW1" min="0.2" max="2.0" step="0.01" value="0.8"></label>
    <label><span class="row">Ширина: Грудь (середина) <span class="val" id="vTorsoW2">1.20</span></span><input type="range" id="torsoW2" min="0.3" max="2.0" step="0.01" value="1.2"></label>
    <label><span class="row">Ширина: Талия (низ) <span class="val" id="vTorsoW3">0.70</span></span><input type="range" id="torsoW3" min="0.2" max="2.0" step="0.01" value="0.7"></label>

    <button id="resetBtn" class="sec">Сбросить</button>
    <button id="downloadBtn">Скачать PNG</button>
  </div>

  <div class="stage">
    <canvas id="cv" width="4096" height="4096"></canvas>
  </div>
</div>

<script>
const SIZE = 4096;
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const ui = {
  heads: document.getElementById('heads'), lineColor: document.getElementById('lineColor'), lineWidth: document.getElementById('lineWidth'),
  showHeads: document.getElementById('showHeads'), showSub: document.getElementById('showSub'),
  skullH: document.getElementById('skullH'), skullW: document.getElementById('skullW'), 
  jawW: document.getElementById('jawW'), jawB: document.getElementById('jawB'),
  neckW: document.getElementById('neckW'), neckX: document.getElementById('neckX'),
  torsoW1: document.getElementById('torsoW1'), torsoW2: document.getElementById('torsoW2'), torsoW3: document.getElementById('torsoW3')
};

const vals = {
  vHeads: document.getElementById('vHeads'), vWidth: document.getElementById('vWidth'),
  vSkullH: document.getElementById('vSkullH'), vSkullW: document.getElementById('vSkullW'), 
  vJawW: document.getElementById('vJawW'), vJawB: document.getElementById('vJawB'),
  vNeckW: document.getElementById('vNeckW'), vNeckX: document.getElementById('vNeckX'),
  vTorsoW1: document.getElementById('vTorsoW1'), vTorsoW2: document.getElementById('vTorsoW2'), vTorsoW3: document.getElementById('vTorsoW3')
};

function draw() {
  const W = SIZE, H = SIZE;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const n = parseFloat(ui.heads.value) || 8;
  const color = ui.lineColor.value;
  const lw = parseInt(ui.lineWidth.value) || 5;

  const headStep = H / n;
  const headLines = [];
  for (let i = 0; i <= n; i++) headLines.push(i * headStep);

  // Подсекции головы (s0..s5)
  const subs = [];
  for (let i = 0; i <= 5; i++) subs.push((headStep / 5) * i);
  
  // Подсекции торса (t0..t3) от s5 до s10
  const torsoStep = headStep / 3;
  const tSubs = [subs[5], subs[5] + torsoStep, subs[5] + torsoStep * 2, subs[5] + headStep];

  /* ---------- Сетка ---------- */
  if (ui.showHeads.checked) {
    ctx.save();
    ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (const y of headLines) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  if (ui.showSub.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100,150,255,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([8, 12]);
    ctx.beginPath();
    // Голова
    for (let i = 1; i <= 4; i++) { ctx.moveTo(0, subs[i]); ctx.lineTo(W, subs[i]); }
    // Торс
    for (let i = 1; i < 3; i++) { ctx.moveTo(0, tSubs[i]); ctx.lineTo(W, tSubs[i]); }
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(100,150,255,0.8)'; ctx.font = `bold ${Math.max(18, SIZE / (n * 20))}px system-ui, sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    for (let i = 1; i <= 4; i++) ctx.fillText('s' + i, W - 20, subs[i] - 6);
    for (let i = 1; i < 3; i++) ctx.fillText('t' + i, W - 20, tSubs[i] - 6);
    ctx.restore();
  }

  /* ============================================================
     ГОЛОВА
     ============================================================ */
  const skullTopBase = subs[0]; 
  const skullBotBase = subs[3]; 
  const baseR = (skullBotBase - skullTopBase) / 2;
  const skullCyBase  = skullTopBase + baseR; 

  const skullH = parseFloat(ui.skullH.value) || 1;
  const skullW = parseFloat(ui.skullW.value) || 1;

  const rY = baseR * skullH;
  const rX = baseR * skullW;
  const cx = W / 2; 
  const cy = skullCyBase;
  const skullBottom = cy + rY;

  // Подбородок (фиксируем по центру)
  const chinCenterY = subs[4];
  const chinHalfW = 0; // Точка

  // Челюсть
  const jawAttachY = skullBottom - (skullBottom - cy) * 0.6; // Фикс. высота
  const jawWParam = parseFloat(ui.jawW.value) || 0.85;
  const jawBParam = parseFloat(ui.jawB.value) || 0.5;

  const attachDx = Math.sqrt(Math.max(0, 1 - Math.pow((jawAttachY - cy) / rY, 2)));
  const attachLeft  = { x: cx - rX * attachDx,  y: jawAttachY };
  const attachRight = { x: cx + rX * attachDx, y: jawAttachY };

  const jawCornerLeftX = cx - rX * jawWParam;
  const jawCornerRightX = cx + rX * jawWParam;
  const jawCornerY = jawAttachY + (chinCenterY - jawAttachY) * jawBParam;
  
  const cornerLeft  = { x: jawCornerLeftX,  y: jawCornerY };
  const cornerRight = { x: jawCornerRightX, y: jawCornerY };

  // Шея
  const neckWParam = parseFloat(ui.neckW.value) || 0.4;
  const neckXParam = parseFloat(ui.neckX.value) || 0;
  const neckHalfW = rX * neckWParam;
  const neckCx = cx + neckXParam * rX;
  
  const neckTopY = cy; 
  const neckBotY = subs[5]; 

  /* ============================================================
     ТОРС
     ============================================================ */
  const t1W = parseFloat(ui.torsoW1.value) * rX;
  const t2W = parseFloat(ui.torsoW2.value) * rX;
  const t3W = parseFloat(ui.torsoW3.value) * rX;

  const t0 = tSubs[0]; // Верх (стык с шеей, s5)
  const t1 = tSubs[1]; // Плечи / грудь
  const t2 = tSubs[2]; // Талия
  const t3 = tSubs[3]; // Низ торса

  // Точки на левой стороне торса
  const p0L = { x: neckCx - neckHalfW, y: t0 }; // Начинаем от низа шеи
  const p1L = { x: neckCx - t1W,       y: t1 };
  const p2L = { x: neckCx - t2W,       y: t2 };
  const p3L = { x: neckCx - t3W,       y: t3 };

  // Точки на правой стороне торса
  const p0R = { x: neckCx + neckHalfW, y: t0 };
  const p1R = { x: neckCx + t1W,       y: t1 };
  const p2R = { x: neckCx + t2W,       y: t2 };
  const p3R = { x: neckCx + t3W,       y: t3 };

  /* ---------- 1. Рисуем Торс (с заливкой) ---------- */
  ctx.save();
  ctx.fillStyle = '#ffffff'; // Белая заливка, чтобы перекрыть сетку и шею
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.beginPath();
  
  // Левая сторона (сверху вниз)
  ctx.moveTo(p0L.x, p0L.y);
  // Безье от шеи к груди
  ctx.bezierCurveTo(p0L.x, (p0L.y + p1L.y)/2, p1L.x, (p0L.y + p1L.y)/2, p1L.x, p1L.y);
  // Безье от груди к талии
  ctx.bezierCurveTo(p1L.x, (p1L.y + p2L.y)/2, p2L.x, (p1L.y + p2L.y)/2, p2L.x, p2L.y);
  // Безье от талии к низу
  ctx.bezierCurveTo(p2L.x, (p2L.y + p3L.y)/2, p3L.x, (p2L.y + p3L.y)/2, p3L.x, p3L.y);

  // Низ торса (плоский)
  ctx.lineTo(p3R.x, p3R.y);

  // Правая сторона (снизу вверх)
  ctx.bezierCurveTo(p3R.x, (p2R.y + p3R.y)/2, p2R.x, (p2R.y + p3R.y)/2, p2R.x, p2R.y);
  ctx.bezierCurveTo(p2R.x, (p1R.y + p2R.y)/2, p1R.x, (p1R.y + p2R.y)/2, p1R.x, p1R.y);
  ctx.bezierCurveTo(p1R.x, (p0R.y + p1R.y)/2, p0R.x, (p0R.y + p1R.y)/2, p0R.x, p0R.y);

  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  /* ============================================================
     РИСОВАНИЕ ГОЛОВЫ ПОВЕРХ ТОРСА
     ============================================================ */
  // 1. Шея (просто линии, заходят в торс)
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'miter';
  ctx.beginPath();
  ctx.moveTo(neckCx - neckHalfW, neckTopY);
  ctx.lineTo(neckCx - neckHalfW, t0 + 10); // чуть ниже стыка
  ctx.moveTo(neckCx + neckHalfW, neckTopY);
  ctx.lineTo(neckCx + neckHalfW, t0 + 10);
  ctx.stroke();
  ctx.restore();

  // 2. Маска головы
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI * 2); ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  ctx.lineTo(cx, chinCenterY);
  ctx.lineTo(cornerRight.x, cornerRight.y);
  ctx.lineTo(attachRight.x, attachRight.y);
  ctx.closePath(); 
  ctx.fill();
  ctx.restore();

  // 3. Контуры головы
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // Череп
  ctx.beginPath(); ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI * 2); ctx.stroke();

  // Левая челюсть
  ctx.beginPath();
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  ctx.lineTo(cx, chinCenterY);
  ctx.stroke();

  // Правая челюсть
  ctx.beginPath();
  ctx.moveTo(attachRight.x, attachRight.y);
  ctx.lineTo(cornerRight.x, cornerRight.y);
  ctx.lineTo(cx, chinCenterY);
  ctx.stroke();
  ctx.restore();

  updateLabels();
}

function updateLabels() {
  vals.vHeads.textContent  = parseFloat(ui.heads.value).toFixed(1);
  vals.vWidth.textContent  = ui.lineWidth.value;
  vals.vSkullH.textContent = parseFloat(ui.skullH.value).toFixed(2);
  vals.vSkullW.textContent = parseFloat(ui.skullW.value).toFixed(2);
  vals.vJawW.textContent   = parseFloat(ui.jawW.value).toFixed(2);
  vals.vJawB.textContent   = parseFloat(ui.jawB.value).toFixed(2);
  vals.vNeckW.textContent  = parseFloat(ui.neckW.value).toFixed(2);
  vals.vNeckX.textContent  = parseFloat(ui.neckX.value).toFixed(2);
  vals.vTorsoW1.textContent = parseFloat(ui.torsoW1.value).toFixed(2);
  vals.vTorsoW2.textContent = parseFloat(ui.torsoW2.value).toFixed(2);
  vals.vTorsoW3.textContent = parseFloat(ui.torsoW3.value).toFixed(2);
}

Object.values(ui).forEach(el => { el.addEventListener('input', draw); el.addEventListener('change', draw); });

document.getElementById('resetBtn').addEventListener('click', () => {
  ui.heads.value = 8; ui.lineWidth.value = 5;
  ui.skullH.value = 1; ui.skullW.value = 1;
  ui.jawW.value = 0.85; ui.jawB.value = 0.5;
  ui.neckW.value = 0.4; ui.neckX.value = 0;
  ui.torsoW1.value = 0.8; ui.torsoW2.value = 1.2; ui.torsoW3.value = 0.7;
  ui.showHeads.checked = true; ui.showSub.checked = true;
  draw();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `body_4096_${ui.heads.value}heads.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

draw();
</script>
</body>
</html>
