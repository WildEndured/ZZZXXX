<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#26282c" />
    <title>Анекорды — конструктор фигуры</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">
    <button class="panel-toggle" id="panelToggle" aria-label="Открыть панель управления">
        <span class="panel-toggle__icon">☰</span>
        <span class="panel-toggle__label">Настройки</span>
    </button>

    <div class="panel-backdrop" id="panelBackdrop" hidden></div>

    <aside class="panel" id="panel" aria-label="Панель управления">
        <div class="panel__handle" aria-hidden="true"></div>

        <div class="panel__head">
            <h1 class="panel__title">Анекорды</h1>
            <button class="panel__close" id="panelClose" aria-label="Закрыть панель">✕</button>
        </div>

        <section class="group">
            <h2>Общее</h2>
            <label class="row">
                <span class="row__label">Рост в головах</span>
                <input type="range" id="growth" min="1" max="12" step="0.5" value="5" />
                <output id="growthOut">5</output>
            </label>
            <label class="row">
                <span class="row__label">Отступы сверху/снизу, %</span>
                <input type="range" id="padding" min="0" max="10" step="0.1" value="0" />
                <output id="paddingOut">0</output>
            </label>
        </section>

        <section class="group">
            <h2>Голова</h2>
            <details class="subgroup" open>
                <summary>Череп</summary>
                <label class="row"><span class="row__label">Верх головы</span><input type="range" id="head_top" min="-50" max="50" step="1" value="0" /><output id="head_top_out">0</output></label>
                <label class="row"><span class="row__label">Низ головы</span><input type="range" id="head_bottom" min="-50" max="50" step="1" value="0" /><output id="head_bottom_out">0</output></label>
                <label class="row"><span class="row__label">Ширина головы</span><input type="range" id="head_width" min="50" max="150" step="1" value="100" /><output id="head_width_out">100</output></label>
                <label class="row"><span class="row__label">Радиус головы</span><input type="range" id="head_radius" min="50" max="150" step="1" value="100" /><output id="head_radius_out">100</output></label>
            </details>
            <details class="subgroup">
                <summary>Подбородок</summary>
                <label class="row"><span class="row__label">Высота</span><input type="range" id="chin_height" min="-50" max="50" step="1" value="0" /><output id="chin_height_out">0</output></label>
                <label class="row"><span class="row__label">Ширина</span><input type="range" id="chin_width" min="10" max="100" step="1" value="50" /><output id="chin_width_out">50</output></label>
                <label class="row"><span class="row__label">Скругление</span><input type="range" id="chin_round" min="0" max="50" step="1" value="10" /><output id="chin_round_out">10</output></label>
            </details>
            <details class="subgroup">
                <summary>Челюсть</summary>
                <label class="row"><span class="row__label">Высота крепления</span><input type="range" id="jaw_attach" min="-50" max="50" step="1" value="0" /><output id="jaw_attach_out">0</output></label>
                <label class="row"><span class="row__label">Длина</span><input type="range" id="jaw_length" min="-50" max="50" step="1" value="0" /><output id="jaw_length_out">0</output></label>
                <label class="row"><span class="row__label">Угол</span><input type="range" id="jaw_angle" min="0" max="100" step="1" value="50" /><output id="jaw_angle_out">50</output></label>
                <label class="row"><span class="row__label">Ширина</span><input type="range" id="jaw_width" min="10" max="100" step="1" value="80" /><output id="jaw_width_out">80</output></label>
            </details>
            <details class="subgroup">
                <summary>Шея</summary>
                <label class="row"><span class="row__label">Ширина</span><input type="range" id="neck_width" min="10" max="100" step="1" value="40" /><output id="neck_width_out">40</output></label>
            </details>
        </section>

        <section class="group">
            <h2>Подложка</h2>
            <div class="row row--file">
                <label class="file-btn">
                    <input type="file" id="bgFile" accept="image/*" />
                    <span>Выбрать изображение</span>
                </label>
            </div>
            <label class="row">
                <span class="row__label">Прозрачность</span>
                <input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1" disabled />
                <output id="bgOpacityOut">1</output>
            </label>
            <label class="row">
                <span class="row__label">Масштаб</span>
                <input type="range" id="bgScale" min="0.1" max="3" step="0.01" value="1" disabled />
                <output id="bgScaleOut">1</output>
            </label>
            <div class="row row--buttons">
                <button id="bgRemove" class="btn btn--danger" disabled>Удалить подложку</button>
            </div>
        </section>

        <section class="group">
            <h2>Пресеты</h2>
            <div class="row row--stack">
                <input type="text" id="presetName" placeholder="Имя пресета" />
                <button id="presetSave" class="btn btn--primary">Сохранить</button>
            </div>
            <ul id="presetList" class="preset-list"></ul>
        </section>
    </aside>

    <main class="stage">
        <div class="stage-toolbar">
            <button id="exportSvg" class="btn">SVG</button>
            <button id="exportPng" class="btn btn--primary">PNG</button>
        </div>

        <div class="canvas-wrap">
            <svg id="canvas"
                 xmlns="http://www.w3.org/2000/svg"
                 width="4096"
                 height="4096"
                 viewBox="0 0 4096 4096"
                 preserveAspectRatio="xMidYMid meet">
                <defs id="defs"></defs>
                <g id="layerBg"></g>
                <g id="layerGrid"></g>
                <g id="layerFigure">
                    <g id="figureHead"></g>
                    <g id="figureTorso"></g>
                    <g id="figureArms"></g>
                    <g id="figureLegs"></g>
                </g>
            </svg>
        </div>
    </main>
</div>

<script src="js/main.js" type="module"></script>
</body>
</html>
