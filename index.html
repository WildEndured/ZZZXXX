<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анекорды — конструктор пропорций</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Панель управления -->
    <aside class="panel" id="panel">
      <h1 class="panel__title">Анекорды</h1>

      <!-- ОБЩИЕ НАСТРОЙКИ -->
      <section class="group">
        <h2 class="group__title">Общие</h2>

        <label class="row">
          <span>Рост в головах: <b id="valHeads">5</b></span>
          <input type="range" id="heads" min="1" max="12" step="0.5" value="5" />
        </label>

        <label class="row">
          <span>Отступ сверху/снизу: <b id="valPad">0%</b></span>
          <input type="range" id="pad" min="0" max="10" step="0.5" value="0" />
        </label>

        <label class="row">
          <span>Толщина линий: <b id="valStroke">2</b></span>
          <input type="range" id="stroke" min="1" max="12" step="1" value="2" />
        </label>

        <label class="row row--inline">
          <span>Цвет линий</span>
          <input type="color" id="strokeColor" value="#000000" />
        </label>
      </section>

      <!-- ПОДЛОЖКА -->
      <section class="group">
        <h2 class="group__title">Подложка</h2>

        <label class="btn">
          Загрузить изображение
          <input type="file" id="bgFile" accept="image/*" hidden />
        </label>

        <label class="row">
          <span>Прозрачность: <b id="valBgAlpha">50%</b></span>
          <input type="range" id="bgAlpha" min="0" max="100" step="1" value="50" />
        </label>

        <label class="row">
          <span>Масштаб: <b id="valBgScale">100%</b></span>
          <input type="range" id="bgScale" min="10" max="300" step="1" value="100" />
        </label>

        <button class="btn btn--danger" id="bgRemove">Удалить подложку</button>
      </section>

      <!-- ПРЕСЕТЫ -->
      <section class="group">
        <h2 class="group__title">Пресеты</h2>

        <div class="row row--inline">
          <input type="text" id="presetName" placeholder="Название пресета" />
          <button class="btn" id="presetSave">Сохранить</button>
        </div>

        <ul class="presets" id="presetList"></ul>
      </section>

      <!-- ЭКСПОРТ -->
      <section class="group">
        <h2 class="group__title">Экспорт</h2>
        <div class="row row--inline">
          <button class="btn" id="exportSvg">SVG</button>
          <button class="btn" id="exportPng">PNG</button>
        </div>
      </section>
    </aside>

    <!-- Холст -->
    <main class="stage" id="stage">
      <svg
        id="canvas"
        xmlns="http://www.w3.org/2000/svg"
        width="4096"
        height="4096"
        viewBox="0 0 4096 4096"
        preserveAspectRatio="xMidYMid meet"
      >
        <!-- фон холста (белый) -->
        <rect id="canvasBg" x="0" y="0" width="4096" height="4096" fill="#ffffff" />

        <!-- подложка -->
        <image id="bgImage" x="0" y="0" width="0" height="0"
               preserveAspectRatio="xMidYMid meet" opacity="0.5" href="" />

        <!-- группа отрисовки фигуры -->
        <g id="figure"
           fill="none"
           stroke="#000000"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        </g>

        <!-- служебная сетка (не экспортируется) -->
        <g id="grid" fill="none" stroke="#c0c0c0" stroke-width="1"
           stroke-dasharray="8 8" opacity="0.6"></g>
      </svg>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
