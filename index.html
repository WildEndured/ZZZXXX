<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Адаптивный холст для рисования</title>
<link rel="stylesheet" href="style.css?v=1006">
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="zoomContainer">
      <div id="bgLayer"></div>
      <img id="underlayLayer" alt="" draggable="false">
      <svg id="drawLayer" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="gridGroup"></g>
        <g id="drawGroup"></g>
      </svg>
    </div>
  </div>

  <aside id="panel">
    <div class="panel-inner">
      <!-- ... верхние блоки без изменений ... -->

      <details class="accordion" open>
        <summary>Ноги</summary>
        <div class="accordion-content">
          <!-- внешние линии бедра и икры без изменений -->
          <section class="block border-none">
            <h4>Бедро левое</h4>
            <label>Высота крепления к тазу: <span id="thighLeftAttachYVal">50%</span>
              <input type="range" id="thighLeftAttachY" min="-50" max="150" value="50">
            </label>
            <label>Скругление линии: <span id="thighLeftRoundVal">50%</span>
              <input type="range" id="thighLeftRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="thighLeftAngleVal">25°</span>
              <input type="range" id="thighLeftAngle" min="-90" max="90" value="25">
            </label>
            <label>Длина линии: <span id="thighLeftLengthVal">50%</span>
              <input type="range" id="thighLeftLength" min="10" max="200" value="50">
            </label>
          </section>
          <section class="block border-none">
            <h4>Бедро правое</h4>
            <label>Высота крепления к тазу: <span id="thighRightAttachYVal">50%</span>
              <input type="range" id="thighRightAttachY" min="-50" max="150" value="50">
            </label>
            <label>Скругление линии: <span id="thighRightRoundVal">50%</span>
              <input type="range" id="thighRightRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="thighRightAngleVal">25°</span>
              <input type="range" id="thighRightAngle" min="-90" max="90" value="25">
            </label>
            <label>Длина линии: <span id="thighRightLengthVal">50%</span>
              <input type="range" id="thighRightLength" min="10" max="200" value="50">
            </label>
          </section>

          <section class="block border-none">
            <h4>Икра левая</h4>
            <label>Скругление линии: <span id="calfLeftRoundVal">50%</span>
              <input type="range" id="calfLeftRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="calfLeftAngleVal">10°</span>
              <input type="range" id="calfLeftAngle" min="-90" max="90" value="10">
            </label>
            <label>Длина линии: <span id="calfLeftLengthVal">50%</span>
              <input type="range" id="calfLeftLength" min="10" max="200" value="50">
            </label>
          </section>
          <section class="block border-none">
            <h4>Икра правая</h4>
            <label>Скругление линии: <span id="calfRightRoundVal">50%</span>
              <input type="range" id="calfRightRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="calfRightAngleVal">10°</span>
              <input type="range" id="calfRightAngle" min="-90" max="90" value="10">
            </label>
            <label>Длина линии: <span id="calfRightLengthVal">50%</span>
              <input type="range" id="calfRightLength" min="10" max="200" value="50">
            </label>
          </section>

          <section class="block border-none">
            <h4>Внутреннее бедро левое</h4>
            <label>Точка роста: <span id="innerThighLeftAttachXVal">20%</span>
              <input type="range" id="innerThighLeftAttachX" min="0" max="100" value="20">
            </label>
            <label>Скругление линии: <span id="innerThighLeftRoundVal">50%</span>
              <input type="range" id="innerThighLeftRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="innerThighLeftAngleVal">-25°</span>
              <input type="range" id="innerThighLeftAngle" min="-90" max="90" value="-25">
            </label>
            <label>Длина линии: <span id="innerThighLeftLengthVal">50%</span>
              <input type="range" id="innerThighLeftLength" min="10" max="200" value="50">
            </label>
          </section>
          <section class="block border-none">
            <h4>Внутреннее бедро правое</h4>
            <label>Точка роста: <span id="innerThighRightAttachXVal">20%</span>
              <input type="range" id="innerThighRightAttachX" min="0" max="100" value="20">
            </label>
            <label>Скругление линии: <span id="innerThighRightRoundVal">50%</span>
              <input type="range" id="innerThighRightRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="innerThighRightAngleVal">-25°</span>
              <input type="range" id="innerThighRightAngle" min="-90" max="90" value="-25">
            </label>
            <label>Длина линии: <span id="innerThighRightLengthVal">50%</span>
              <input type="range" id="innerThighRightLength" min="10" max="200" value="50">
            </label>
          </section>

          <section class="block border-none">
            <h4>Внутренняя икра левая</h4>
            <label>Скругление линии: <span id="innerCalfLeftRoundVal">50%</span>
              <input type="range" id="innerCalfLeftRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="innerCalfLeftAngleVal">-25°</span>
              <input type="range" id="innerCalfLeftAngle" min="-90" max="90" value="-25">
            </label>
            <label>Длина линии: <span id="innerCalfLeftLengthVal">50%</span>
              <input type="range" id="innerCalfLeftLength" min="10" max="200" value="50">
            </label>
          </section>
          <section class="block border-none">
            <h4>Внутренняя икра правая</h4>
            <label>Скругление линии: <span id="innerCalfRightRoundVal">50%</span>
              <input type="range" id="innerCalfRightRound" min="0" max="100" value="50">
            </label>
            <label>Угол: <span id="innerCalfRightAngleVal">-25°</span>
              <input type="range" id="innerCalfRightAngle" min="-90" max="90" value="-25">
            </label>
            <label>Длина линии: <span id="innerCalfRightLengthVal">50%</span>
              <input type="range" id="innerCalfRightLength" min="10" max="200" value="50">
            </label>
          </section>

          <!-- колени и лодыжки без изменений -->
          <section class="block border-none">
            <h4>Колени</h4>
            <label>Левое X: <span id="kneeLeftXVal">50%</span>
              <input type="range" id="kneeLeftX" min="-50" max="50" value="50">
            </label>
            <label>Левое Y: <span id="kneeLeftYVal">25%</span>
              <input type="range" id="kneeLeftY" min="-50" max="50" value="25">
            </label>
            <label>Левое радиус: <span id="kneeLeftRVal">15%</span>
              <input type="range" id="kneeLeftR" min="5" max="30" value="15">
            </label>
            <label>Правое X: <span id="kneeRightXVal">-50%</span>
              <input type="range" id="kneeRightX" min="-50" max="50" value="-50">
            </label>
            <label>Правое Y: <span id="kneeRightYVal">25%</span>
              <input type="range" id="kneeRightY" min="-50" max="50" value="25">
            </label>
            <label>Правое радиус: <span id="kneeRightRVal">15%</span>
              <input type="range" id="kneeRightR" min="5" max="30" value="15">
            </label>
          </section>
          <section class="block border-none">
            <h4>Лодыжки</h4>
            <label>Левое X: <span id="ankleLeftXVal">50%</span>
              <input type="range" id="ankleLeftX" min="-50" max="50" value="50">
            </label>
            <label>Левое Y: <span id="ankleLeftYVal">50%</span>
              <input type="range" id="ankleLeftY" min="-50" max="50" value="50">
            </label>
            <label>Левое радиус: <span id="ankleLeftRVal">10%</span>
              <input type="range" id="ankleLeftR" min="5" max="30" value="10">
            </label>
            <label>Правое X: <span id="ankleRightXVal">-50%</span>
              <input type="range" id="ankleRightX" min="-50" max="50" value="-50">
            </label>
            <label>Правое Y: <span id="ankleRightYVal">50%</span>
              <input type="range" id="ankleRightY" min="-50" max="50" value="50">
            </label>
            <label>Правое радиус: <span id="ankleRightRVal">10%</span>
              <input type="range" id="ankleRightR" min="5" max="30" value="10">
            </label>
          </section>
        </div>
      </details>

      <!-- ... нижние блоки (Кисть, Действия) ... -->
      <section class="block">
        <h3>Кисть</h3>
        <label>Цвет кисти
          <input type="color" id="brushColor" value="#000000">
        </label>
        <label>Толщина: <span id="brushWidthVal">3</span>
          <input type="range" id="brushWidth" min="1" max="20" value="3">
        </label>
      </section>

      <section class="block">
        <h3>Действия</h3>
        <div class="btn-row">
          <button id="undoBtn">Undo</button>
          <button id="clearBtn">Очистить всё</button>
        </div>
        <div class="btn-row">
          <button id="exportSvgBtn">Скачать SVG</button>
          <button id="exportPngBtn">Скачать PNG</button>
        </div>
      </section>
    </div>
  </aside>
</div>

<script src="main.js?v=1006"></script>
<script src="head.js?v=1006"></script>
<script src="torso.js?v=1006"></script>
<script src="arm.js?v=1006"></script>
<script src="leg.js?v=1006"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.App && App.init) {
      App.init();
    }
  });
</script>
</body>
</html>
