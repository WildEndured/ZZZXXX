<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Построение головы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="canvas" width="4096" height="4096"></canvas>

<div class="controls">
  <div class="control-group">
    <label>Рост в головах (X): <span id="x-val">7</span></label>
    <input type="range" id="x-slider" min="5" max="10" step="1" value="7">
  </div>
  <div class="control-group">
    <label>Ширина круга: <span id="circle-w-val">1.0</span></label>
    <input type="range" id="circle-w-slider" min="0.5" max="1.5" step="0.05" value="1.0">
  </div>
  <div class="control-group">
    <label>Высота круга: <span id="circle-h-val">1.0</span></label>
    <input type="range" id="circle-h-slider" min="0.5" max="1.5" step="0.05" value="1.0">
  </div>
  <div class="control-group">
    <label>Ширина подбородка: <span id="chin-w-val">0.3</span></label>
    <input type="range" id="chin-w-slider" min="0.1" max="1.0" step="0.05" value="0.3">
  </div>
  <div class="control-group">
    <label>Высота подбородка: <span id="chin-h-val">0.3</span></label>
    <input type="range" id="chin-h-slider" min="0.1" max="1.0" step="0.05" value="0.3">
  </div>
  <div class="control-group">
    <label>Высота крепления челюсти: <span id="jaw-h-val">0.6</span></label>
    <input type="range" id="jaw-h-slider" min="0.2" max="1.0" step="0.05" value="0.6">
  </div>
  <div class="control-group">
    <label>Угол челюсти: <span id="jaw-angle-val">60</span></label>
    <input type="range" id="jaw-angle-slider" min="30" max="150" step="1" value="60">
  </div>
  <div class="control-group">
    <label>Ширина челюсти: <span id="jaw-w-val">0.5</span></label>
    <input type="range" id="jaw-w-slider" min="0.1" max="1.0" step="0.05" value="0.5">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
