<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Векторный Редактор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Панель управления -->
    <div class="controls">
        <div class="control-group">
            <label>Кисть <input type="range" id="brushSize" min="0.00025" max="0.025" step="0.00025" value="0.005"></label>
        </div>
        <div class="control-group">
            <button id="undoBtn">Отменить</button>
            <button id="clearBtn">Очистить</button>
        </div>
        <div class="control-group">
            <button id="loadImgBtn">Загрузить картинку</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <div class="control-group">
            <label>Масштаб <input type="range" id="bgScale" min="10" max="300" value="100"></label>
            <label>Прозрачность <input type="range" id="bgOpacity" min="0" max="100" value="100"></label>
        </div>
        <div class="control-group">
            <label>Фон <input type="color" id="bgColor" value="#ffffff"></label>
        </div>
        <div class="control-group">
            <label>Отступ <input type="range" id="marginTop" min="0" max="10" value="5"></label>
            <label>Голов <input type="range" id="headsCount" min="2" max="8" value="4"></label>
        </div>
        <div class="control-group">
            <button id="downloadSvgBtn">Скачать SVG</button>
            <button id="downloadPngBtn">Скачать PNG</button>
        </div>
    </div>

    <!-- Обертка для центрирования квадратного холста -->
    <div class="canvas-wrapper">
        <!-- Контейнер зума (строго квадратный) -->
        <div class="zoom-container" id="zoomContainer">
            <!-- Слой фона (z-index: 1) -->
            <div class="bg-layer" id="bgLayer"></div>
            <!-- Слой подложки (z-index: 2) -->
            <img class="bg-image" id="bgImage" src="" alt="">
            <!-- Слой рисования (z-index: 3) -->
            <svg id="drawSvg" class="draw-layer" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
                <g id="drawGroup"></g>
                <g id="gridGroup"></g>
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
