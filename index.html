<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#26282c" />
    <title>Анекорды — конструктор фигуры</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">

    <button class="panel-toggle" id="panelToggle" aria-label="Открыть панель управления">
        <span class="panel-toggle__icon">☰</span>
        <span class="panel-toggle__label">Настройки</span>
    </button>

    <div class="panel-backdrop" id="panelBackdrop" hidden></div>

    <aside class="panel" id="panel" aria-label="Панель управления">

        <div class="panel__handle" aria-hidden="true"></div>

        <div class="panel__head">
            <h1 class="panel__title">Анекорды</h1>
            <button class="panel__close" id="panelClose" aria-label="Закрыть панель">✕</button>
        </div>

        <section class="group">
            <h2>Общее</h2>

            <label class="row">
                <span class="row__label">Рост в головах</span>
                <input type="range" id="growth" min="1" max="12" step="0.5" value="5" />
                <output id="growthOut">5</output>
            </label>

            <label class="row">
                <span class="row__label">Отступы сверху/снизу, %</span>
                <input type="range" id="padding" min="0" max="10" step="0.1" value="0" />
                <output id="paddingOut">0</output>
            </label>
        </section>

        <section class="group">
            <h2>Голова</h2>

            <label class="row">
                <span class="row__label">Верх головы</span>
                <input type="range" id="headTop" min="-0.5" max="0.5" step="0.01" value="0" />
                <output id="headTopOut">0.00</output>
            </label>

            <label class="row">
                <span class="row__label">Низ головы</span>
                <input type="range" id="headBottom" min="-0.5" max="0.5" step="0.01" value="0" />
                <output id="headBottomOut">0.00</output>
            </label>

            <label class="row">
                <span class="row__label">Ширина головы</span>
                <input type="range" id="headWidth" min="0.5" max="1.5" step="0.01" value="1" />
                <output id="headWidthOut">1.00</output>
            </label>

            <label class="row">
                <span class="row__label">Радиус головы</span>
                <input type="range" id="headRadius" min="0.7" max="1.3" step="0.01" value="1" />
                <output id="headRadiusOut">1.00</output>
            </label>

            <label class="row">
                <span class="row__label">Высота подбородка</span>
                <input type="range" id="chinHeight" min="-0.2" max="0.3" step="0.01" value="0" />
                <output id="chinHeightOut">0.00</output>
            </label>

            <label class="row">
                <span class="row__label">Ширина подбородка</span>
                <input type="range" id="chinWidth" min="0.1" max="0.6" step="0.01" value="0.4" />
                <output id="chinWidthOut">0.40</output>
            </label>

            <label class="row">
                <span class="row__label">Скругление подбородка</span>
                <input type="range" id="chinRounding" min="0" max="0.2" step="0.01" value="0" />
                <output id="chinRoundingOut">0.00</output>
            </label>

            <label class="row">
                <span class="row__label">Высота крепления челюсти</span>
                <input type="range" id="jawAttach" min="0" max="0.3" step="0.01" value="0" />
                <output id="jawAttachOut">0.00</output>
            </label>

            <label class="row">
                <span class="row__label">Длина челюсти</span>
                <input type="range" id="jawLength" min="0" max="0.4" step="0.01" value="0.1" />
                <output id="jawLengthOut">0.10</output>
            </label>

            <label class="row">
                <span class="row__label">Угол челюсти</span>
                <input type="range" id="jawAngle" min="0" max="1" step="0.01" value="0.5" />
                <output id="jawAngleOut">0.50</output>
            </label>

            <label class="row">
                <span class="row__label">Ширина челюсти</span>
                <input type="range" id="jawWidth" min="0.1" max="0.8" step="0.01" value="0.4" />
                <output id="jawWidthOut">0.40</output>
            </label>
        </section>

        <section class="group">
            <h2>Подложка</h2>

            <div class="row row--file">
                <label class="file-btn">
                    <input type="file" id="bgFile" accept="image/*" />
                    <span>Выбрать изображение</span>
                </label>
            </div>

            <label class="row">
                <span class="row__label">Прозрачность</span>
                <input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1" disabled />
                <output id="bgOpacityOut">1</output>
            </label>

            <label class="row">
                <span class="row__label">Масштаб</span>
                <input type="range" id="bgScale" min="0.1" max="3" step="0.01" value="1" disabled />
                <output id="bgScaleOut">1</output>
            </label>

            <div class="row row--buttons">
                <button id="bgRemove" class="btn btn--danger" disabled>Удалить подложку</button>
            </div>
        </section>

        <section class="group">
            <h2>Пресеты</h2>

            <div class="row row--stack">
                <input type="text" id="presetName" placeholder="Имя пресета" />
                <button id="presetSave" class="btn btn--primary">Сохранить</button>
            </div>

            <ul id="presetList" class="preset-list"></ul>
        </section>
    </aside>

    <main class="stage">
        <div class="stage-toolbar">
            <button id="exportSvg" class="btn">SVG</button>
            <button id="exportPng" class="btn btn--primary">PNG</button>
        </div>

        <div class="canvas-wrap">
            <svg id="canvas"
                 xmlns="http://www.w3.org/2000/svg"
                 width="4096"
                 height="4096"
                 viewBox="0 0 4096 4096"
                 preserveAspectRatio="xMidYMid meet">
                <defs id="defs"></defs>
                <g id="layerBg"></g>
                <g id="layerGrid"></g>
                <g id="layerFigure">
                    <g id="figureHead"></g>
                    <g id="figureTorso"></g>
                    <g id="figureArms"></g>
                    <g id="figureLegs"></g>
                </g>
            </svg>
        </div>
    </main>

</div>

<script src="js/main.js" type="module"></script>
</body>
</html>
