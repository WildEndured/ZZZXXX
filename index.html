<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Canvas 4096x4096</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <button id="btnClear" class="btn" title="Очистить">🗑</button>
            <button id="btnSave" class="btn" title="Сохранить">💾</button>
            <button id="btnEraser" class="btn" title="Ластик">⌫</button>
            <div class="colors" id="colors">
                <button class="color active" data-color="#000000" style="background:#000000"></button>
                <button class="color" data-color="#ff0000" style="background:#ff0000"></button>
                <button class="color" data-color="#00ff00" style="background:#00ff00"></button>
                <button class="color" data-color="#0000ff" style="background:#0000ff"></button>
                <button class="color" data-color="#ffff00" style="background:#ffff00"></button>
                <button class="color" data-color="#ff00ff" style="background:#ff00ff"></button>
                <button class="color" data-color="#00ffff" style="background:#00ffff"></button>
            </div>
            <input type="range" id="brushSize" min="1" max="100" value="10">
            <span id="sizeLabel">10</span>
        </header>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="canvas" width="4096" height="4096"></canvas>
        </div>

        <footer class="statusbar">
            <span id="status">4096 × 4096 · 300 DPI · 1:1</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
