<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head Builder</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <div class="canvas-wrap">
    <canvas id="canvas" width="4096" height="4096"></canvas>
  </div>
  
  <aside id="panel">
    <div class="tabs">
      <button class="tab active" data-tab="params">Параметры</button>
      <button class="tab" data-tab="style">Стиль и Фон</button>
    </div>

    <div id="tab-params" class="tab-content active">
      <label>Рост в головах (X)
        <input type="range" id="heads" min="4" max="12" value="8" step="0.5">
        <span id="headsVal">8</span>
      </label>

      <fieldset>
        <legend>Круг головы</legend>
        <label>Высота
          <input type="range" id="circleH" min="0.3" max="1" value="1" step="0.01">
          <span id="circleHVal">1.00</span>
        </label>
        <label>Ширина
          <input type="range" id="circleW" min="0.3" max="1" value="1" step="0.01">
          <span id="circleWVal">1.00</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Подбородок</legend>
        <label>Ширина
          <input type="range" id="chinW" min="0.05" max="0.6" value="0.25" step="0.01">
          <span id="chinWVal">0.25</span>
        </label>
        <label>Высота (смещение)
          <input type="range" id="chinH" min="-0.15" max="0.15" value="0" step="0.01">
          <span id="chinHVal">0.00</span>
        </label>
        <label>Стиль
          <select id="chinStyle">
            <option value="line">Линия</option>
            <option value="dot">Точка (аниме)</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Челюсть</legend>
        <label>Высота крепления
          <input type="range" id="jawY" min="0" max="0.4" value="0.12" step="0.01">
          <span id="jawYVal">0.12</span>
        </label>
        <label>Угол
          <input type="range" id="jawAngle" min="0" max="60" value="20" step="1">
          <span id="jawAngleVal">20°</span>
        </label>
        <label>Ширина
          <input type="range" id="jawW" min="0.2" max="1" value="0.7" step="0.01">
          <span id="jawWVal">0.70</span>
        </label>
      </fieldset>
    </div>

    <div id="tab-style" class="tab-content">
      <fieldset>
        <legend>Внешний вид линий</legend>
        <label>Цвет линий
          <input type="color" id="lineColor" value="#ff0000" style="width:100%; height:40px; cursor:pointer;">
        </label>
        <label>Толщина линий
          <input type="range" id="lineWidth" min="1" max="30" value="8" step="1">
          <span id="lineWidthVal">8 px</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Подложка (фон)</legend>
        <label>Загрузить изображение
          <input type="file" id="bgImage" accept="image/*" style="margin-top:8px; color:#fff;">
        </label>
        <button id="clearBg" style="background:#444; color:#fff; margin-top:10px;">Убрать подложку</button>
      </fieldset>
    </div>

    <button id="download" style="margin-top:20px;">Скачать PNG</button>
  </aside>
</div>
<script src="script.js?v=3"></script>
</body>
</html>
