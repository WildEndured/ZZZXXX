<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Построение головы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="canvas-wrap">
      <canvas id="c" width="4096" height="4096"></canvas>
    </div>
    <div class="panel">
      <h2>Параметры</h2>

      <label>Рост в головах (X): <span id="vX">7.5</span>
        <input type="range" id="X" min="4" max="12" step="0.5" value="7.5">
      </label>

      <fieldset>
        <legend>Череп</legend>
        <label>Высота круга: <span id="vCh">1.00</span>
          <input type="range" id="chH" min="0.5" max="1.3" step="0.01" value="1">
        </label>
        <label>Ширина круга: <span id="vCw">1.00</span>
          <input type="range" id="chW" min="0.5" max="1.3" step="0.01" value="1">
        </label>
      </fieldset>

      <fieldset>
        <legend>Подбородок</legend>
        <label>Тип:
          <select id="chinType">
            <option value="line">Линия</option>
            <option value="point">Точка (аниме)</option>
          </select>
        </label>
        <label>Ширина подбородка: <span id="vChW">1.00</span>
          <input type="range" id="chinW" min="0.2" max="1.2" step="0.01" value="1">
        </label>
        <label>Высота подбородка: <span id="vChH">1.00</span>
          <input type="range" id="chinH" min="0.2" max="1.5" step="0.01" value="1">
        </label>
      </fieldset>

      <fieldset>
        <legend>Челюсть</legend>
        <label>Высота крепления: <span id="vJh">0.50</span>
          <input type="range" id="jawH" min="0" max="1" step="0.01" value="0.5">
        </label>
        <label>Угол челюсти: <span id="vJa">20</span>°
          <input type="range" id="jawA" min="-60" max="80" step="1" value="20">
        </label>
        <label>Ширина челюсти: <span id="vJw">1.00</span>
          <input type="range" id="jawW" min="0.2" max="1.5" step="0.01" value="1">
        </label>
      </fieldset>

      <button id="reset">Сброс</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
