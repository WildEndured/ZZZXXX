<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 4096x4096</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Холст 4096×4096 (300 DPI)</h1>
        <div class="canvas-wrapper">
            <canvas id="mainCanvas" width="4096" height="4096"></canvas>
        </div>
        <div class="controls">
            <button id="clearBtn">Очистить</button>
            <button id="downloadBtn">Скачать PNG</button>
            <label>
                Цвет фона:
                <input type="color" id="bgColor" value="#ffffff">
            </label>
            <label>
                Цвет кисти:
                <input type="color" id="brushColor" value="#000000">
            </label>
            <label>
                Размер кисти:
                <input type="range" id="brushSize" min="1" max="100" value="10">
                <span id="brushSizeValue">10</span>
            </label>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
