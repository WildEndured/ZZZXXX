<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Голова и Торс Loomis — 4096×4096 @300dpi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1e1e1e; color: #eee;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .wrap { display: flex; gap: 16px; align-items: flex-start; width: 100%; max-width: 1600px; }
  .panel {
    flex: 0 0 320px; display: flex; flex-direction: column; gap: 10px;
    background: #2a2a2a; padding: 14px; border-radius: 10px;
    max-height: 88vh; overflow-y: auto;
  }
  .panel h3 { margin: 6px 0 2px; font-size: 14px; color: #8ec4ff; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .panel label .row { display: flex; justify-content: space-between; align-items: center; }
  .panel label .val { color: #8ec4ff; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; }
  input[type="color"] { width: 42px; height: 28px; border: none; background: none; cursor: pointer; }
  button { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; background: #4a90d9; color: #fff; font-size: 13px; }
  button:hover { background: #5aa0e9; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }
  .stage { flex: 1; min-width: 0; max-height: 88vh; overflow: auto; border: 1px solid #444; border-radius: 8px; background: #000; }
  canvas { display: block; max-width: 100%; height: auto; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <h3>Общее</h3>
    <label>
      <span class="row">Рост в головах <span class="val" id="vHeads">8</span></span>
      <input type="range" id="heads" min="3" max="12" step="0.1" value="8">
    </label>
    <label>
      <span class="row">Цвет линий</span>
      <input type="color" id="lineColor" value="#ff3b3b">
    </label>
    <label>
      <span class="row">Толщина линий <span class="val" id="vWidth">5</span></span>
      <input type="range" id="lineWidth" min="1" max="30" step="1" value="5">
    </label>
    <label class="chk"><input type="checkbox" id="showHeads" checked> Показывать линии голов</label>
    <label class="chk"><input type="checkbox" id="showSub" checked> Показывать подсекции</label>

    <h3>Череп (Круг)</h3>
    <label><span class="row">Высота <span class="val" id="vSkullH">1.00</span></span><input type="range" id="skullH" min="0.3" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Ширина <span class="val" id="vSkullW">1.00</span></span><input type="range" id="skullW" min="0.5" max="1.6" step="0.01" value="1.0"></label>
    <label><span class="row">Смещение по X <span class="val" id="vSkullX">0.00</span></span><input type="range" id="skullX" min="-0.5" max="0.5" step="0.01" value="0"></label>

    <h3>Подбородок (C)</h3>
    <label><span class="row">Высота <span class="val" id="vChinY">0.00</span></span><input type="range" id="chinY" min="-0.5" max="1.0" step="0.01" value="0"></label>
    <label><span class="row">Ширина <span class="val" id="vChinW">0.00</span></span><input type="range" id="chinW" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="row">Округлость <span class="val" id="vChinR">0.30</span></span><input type="range" id="chinR" min="0" max="1" step="0.01" value="0.3"></label>

    <h3>Челюсть (A-B-C)</h3>
    <label><span class="row">Высота крепления (A) <span class="val" id="vJawY">0.60</span></span><input type="range" id="jawY" min="0" max="1" step="0.01" value="0.6"></label>
    <label><span class="row">Ширина угла (B) <span class="val" id="vJawW">0.85</span></span><input type="range" id="jawW" min="0.3" max="1.2" step="0.01" value="0.85"></label>
    <label><span class="row">Высота угла (B) <span class="val" id="vJawB">0.50</span></span><input type="range" id="jawB" min="0" max="1" step="0.01" value="0.5"></label>

    <h3>Шея</h3>
    <label><span class="row">Ширина шеи <span class="val" id="vNeckW">0.30</span></span><input type="range" id="neckW" min="0.1" max="0.8" step="0.01" value="0.3"></label>
    <label><span class="row">Смещение по X <span class="val" id="vNeckX">0.00</span></span><input type="range" id="neckX" min="-0.5" max="0.5" step="0.01" value="0"></label>

    <h3>Торс (Яйцо)</h3>
    <label><span class="row">Высота <span class="val" id="vTorsoH">1.00</span></span><input type="range" id="torsoH" min="0.5" max="1.3" step="0.01" value="1.0"></label>
    <label><span class="row">Ширина <span class="val" id="vTorsoW">1.00</span></span><input type="range" id="torsoW" min="0.5" max="1.5" step="0.01" value="1.0"></label>
    <label><span class="row">Смещение по X <span class="val" id="vTorsoX">0.00</span></span><input type="range" id="torsoX" min="-0.5" max="0.5" step="0.01" value="0"></label>
    <label><span class="row">Сужение сверху <span class="val" id="vTorsoTop">0.60</span></span><input type="range" id="torsoTop" min="0.1" max="1" step="0.01" value="0.6"></label>
    <label><span class="row">Сужение снизу <span class="val" id="vTorsoBot">0.80</span></span><input type="range" id="torsoBot" min="0.1" max="1" step="0.01" value="0.8"></label>

    <button id="resetBtn" class="sec">Сбросить</button>
    <button id="downloadBtn">Скачать PNG</button>
  </div>

  <div class="stage">
    <canvas id="cv" width="4096" height="4096"></canvas>
  </div>
</div>

<script>
const SIZE = 4096;
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const ui = {
  heads: document.getElementById('heads'), lineColor: document.getElementById('lineColor'), lineWidth: document.getElementById('lineWidth'),
  showHeads: document.getElementById('showHeads'), showSub: document.getElementById('showSub'),
  skullH: document.getElementById('skullH'), skullW: document.getElementById('skullW'), skullX: document.getElementById('skullX'),
  chinY: document.getElementById('chinY'), chinW: document.getElementById('chinW'), chinR: document.getElementById('chinR'),
  jawY: document.getElementById('jawY'), jawW: document.getElementById('jawW'), jawB: document.getElementById('jawB'),
  neckW: document.getElementById('neckW'), neckX: document.getElementById('neckX'),
  torsoH: document.getElementById('torsoH'), torsoW: document.getElementById('torsoW'), torsoX: document.getElementById('torsoX'),
  torsoTop: document.getElementById('torsoTop'), torsoBot: document.getElementById('torsoBot')
};

const vals = {
  vHeads: document.getElementById('vHeads'), vWidth: document.getElementById('vWidth'),
  vSkullH: document.getElementById('vSkullH'), vSkullW: document.getElementById('vSkullW'), vSkullX: document.getElementById('vSkullX'),
  vChinY: document.getElementById('vChinY'), vChinW: document.getElementById('vChinW'), vChinR: document.getElementById('vChinR'),
  vJawY: document.getElementById('vJawY'), vJawW: document.getElementById('vJawW'), vJawB: document.getElementById('vJawB'),
  vNeckW: document.getElementById('vNeckW'), vNeckX: document.getElementById('vNeckX'),
  vTorsoH: document.getElementById('vTorsoH'), vTorsoW: document.getElementById('vTorsoW'), vTorsoX: document.getElementById('vTorsoX'),
  vTorsoTop: document.getElementById('vTorsoTop'), vTorsoBot: document.getElementById('vTorsoBot')
};

function draw() {
  const W = SIZE, H = SIZE;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const n = parseFloat(ui.heads.value) || 8;
  const color = ui.lineColor.value;
  const lw = parseInt(ui.lineWidth.value) || 5;

  const headStep = H / n;
  const headLines = [];
  for (let i = 0; i <= n; i++) headLines.push(i * headStep);

  // Подсекции секции 0 (5 частей)
  const subs0 = [];
  for (let i = 0; i <= 5; i++) subs0.push((headStep / 5) * i);
  
  // Подсекции секции 1 (3 части) - для торса
  const subs1 = [];
  for (let i = 0; i <= 3; i++) subs1.push(headLines[1] + (headStep / 3) * i);

  /* ---------- Сетка ---------- */
  if (ui.showHeads.checked) {
    ctx.save();
    ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 2; ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (const y of headLines) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  if (ui.showSub.checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100,150,255,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([8, 12]);
    ctx.beginPath();
    // Секция 0
    for (let i = 1; i <= 4; i++) { ctx.moveTo(0, subs0[i]); ctx.lineTo(W, subs0[i]); }
    // Секция 1 (Торс)
    for (let i = 1; i <= 2; i++) { ctx.moveTo(0, subs1[i]); ctx.lineTo(W, subs1[i]); }
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- Голова ---------- */
  const skullTopBase = subs0[0]; 
  const skullBotBase = subs0[3]; 
  const baseR = (skullBotBase - skullTopBase) / 2;
  const skullCyBase  = skullTopBase + baseR; 

  const skullH = parseFloat(ui.skullH.value) || 1;
  const skullW = parseFloat(ui.skullW.value) || 1;
  const skullX = parseFloat(ui.skullX.value) || 0;

  const rY = baseR * skullH;
  const rX = baseR * skullW;
  const cx = W / 2 + skullX * rX;
  const cy = skullCyBase;

  const skullBottom = cy + rY;

  const chinBaseY = subs0[4];
  const chinYOffset = parseFloat(ui.chinY.value) || 0;
  const chinCenterY = chinBaseY + chinYOffset * (headStep / 5);

  const chinWParam = parseFloat(ui.chinW.value) || 0;
  const chinRParam = parseFloat(ui.chinR.value) || 0;
  const chinHalfW = chinWParam * rX * 0.7;
  const chinRound = chinRParam * chinHalfW;

  const jawYParam = parseFloat(ui.jawY.value) || 0.6;
  const jawAttachY = skullBottom - (skullBottom - cy) * jawYParam;

  const jawWParam = parseFloat(ui.jawW.value) || 0.85;
  const jawBParam = parseFloat(ui.jawB.value) || 0.5;

  const attachDx = Math.sqrt(Math.max(0, 1 - Math.pow((jawAttachY - cy) / rY, 2)));
  const attachLeftX  = cx - rX * attachDx;
  const attachRightX = cx + rX * attachDx;
  const attachLeft  = { x: attachLeftX,  y: jawAttachY };
  const attachRight = { x: attachRightX, y: jawAttachY };

  const jawCornerLeftX = cx - rX * jawWParam;
  const jawCornerRightX = cx + rX * jawWParam;
  const jawCornerY = jawAttachY + (chinCenterY - jawAttachY) * jawBParam;
  
  const cornerLeft  = { x: jawCornerLeftX,  y: jawCornerY };
  const cornerRight = { x: jawCornerRightX, y: jawCornerY };

  let chinLeft, chinRight;
  if (chinHalfW < 1.5) {
    chinLeft = { x: cx, y: chinCenterY };
    chinRight = { x: cx, y: chinCenterY };
  } else {
    chinLeft  = { x: cx - chinHalfW, y: chinCenterY };
    chinRight = { x: cx + chinHalfW, y: chinCenterY };
  }

  /* ---------- Шея ---------- */
  const neckWParam = parseFloat(ui.neckW.value) || 0.3;
  const neckXParam = parseFloat(ui.neckX.value) || 0;
  const neckHalfW = rX * neckWParam;
  const neckCx = cx + neckXParam * rX;
  
  const neckTopY = cy; 
  const neckBotY = headLines[1]; // Заканчивается на границе 1-й головы

  /* ---------- Торс ---------- */
  const tH = parseFloat(ui.torsoH.value) || 1;
  const tW = parseFloat(ui.torsoW.value) || 1;
  const tX = parseFloat(ui.torsoX.value) || 0;
  const tTop = parseFloat(ui.torsoTop.value) || 0.6;
  const tBot = parseFloat(ui.torsoBot.value) || 0.8;

  const torsoTopY = subs1[0]; // s5 (начало секции 1)
  const torsoBotY = subs1[3]; // конец секции 1
  
  // Базовая высота и ширина торса
  const baseTorsoH = torsoBotY - torsoTopY;
  const baseTorsoW = rX * 1.5; // Ширина по умолчанию чуть шире головы

  const torsoCenterY = torsoTopY + (baseTorsoH * tH) / 2;
  const torsoRX = (baseTorsoW * tW) / 2;
  const torsoRY = (baseTorsoH * tH) / 2;
  const torsoCx = cx + tX * torsoRX;

  // Рисуем яйцо
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  ctx.beginPath();
  // Верхняя точка (сужение)
  ctx.moveTo(torsoCx, torsoCenterY - torsoRY);
  
  // Правая сторона (верхняя половина)
  ctx.bezierCurveTo(
    torsoCx + torsoRX * tTop, torsoCenterY - torsoRY,
    torsoCx + torsoRX, torsoCenterY - torsoRY * 0.2,
    torsoCx + torsoRX, torsoCenterY
  );
  // Правая сторона (нижняя половина)
  ctx.bezierCurveTo(
    torsoCx + torsoRX, torsoCenterY + torsoRY * 0.5,
    torsoCx + torsoRX * tBot, torsoCenterY + torsoRY,
    torsoCx, torsoCenterY + torsoRY
  );
  
  // Левая сторона (нижняя половина)
  ctx.bezierCurveTo(
    torsoCx - torsoRX * tBot, torsoCenterY + torsoRY,
    torsoCx - torsoRX, torsoCenterY + torsoRY * 0.5,
    torsoCx - torsoRX, torsoCenterY
  );
  // Левая сторона (верхняя половина)
  ctx.bezierCurveTo(
    torsoCx - torsoRX, torsoCenterY - torsoRY * 0.2,
    torsoCx - torsoRX * tTop, torsoCenterY - torsoRY,
    torsoCx, torsoCenterY - torsoRY
  );
  ctx.stroke();
  ctx.restore();

  /* ---------- Отрисовка шеи и головы (с маской) ---------- */
  
  // 1. Шея
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'miter'; 
  ctx.beginPath();
  ctx.moveTo(neckCx - neckHalfW, neckTopY);
  ctx.lineTo(neckCx - neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckBotY);
  ctx.lineTo(neckCx + neckHalfW, neckTopY);
  ctx.stroke();
  ctx.restore();

  // 2. Маска головы (стирает шею внутри круга)
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3. Контуры головы
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachLeft.x, attachLeft.y);
  ctx.lineTo(cornerLeft.x, cornerLeft.y);
  ctx.lineTo(chinHalfW < 1.5 ? cx : chinLeft.x, chinHalfW < 1.5 ? chinCenterY : chinLeft.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(attachRight.x, attachRight.y);
  ctx.lineTo(cornerRight.x, cornerRight.y);
  ctx.lineTo(chinHalfW < 1.5 ? cx : chinRight.x, chinHalfW < 1.5 ? chinCenterY : chinRight.y);
  ctx.stroke();

  if (chinHalfW < 1.5) {
    ctx.beginPath(); ctx.arc(cx, chinCenterY, Math.max(3, lw), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(chinLeft.x, chinLeft.y);
    if (chinRound < 1) ctx.lineTo(chinRight.x, chinRight.y);
    else ctx.quadraticCurveTo(cx, chinCenterY + (chinRound / chinHalfW) * chinHalfW * 0.8, chinRight.x, chinRight.y);
    ctx.stroke();
  }
  ctx.restore();

  updateLabels();
}

function updateLabels() {
  vals.vHeads.textContent  = parseFloat(ui.heads.value).toFixed(1);
  vals.vWidth.textContent  = ui.lineWidth.value;
  vals.vSkullH.textContent = parseFloat(ui.skullH.value).toFixed(2);
  vals.vSkullW.textContent = parseFloat(ui.skullW.value).toFixed(2);
  vals.vSkullX.textContent = parseFloat(ui.skullX.value).toFixed(2);
  vals.vChinY.textContent  = parseFloat(ui.chinY.value).toFixed(2);
  vals.vChinW.textContent  = parseFloat(ui.chinW.value).toFixed(2);
  vals.vChinR.textContent  = parseFloat(ui.chinR.value).toFixed(2);
  vals.vJawY.textContent   = parseFloat(ui.jawY.value).toFixed(2);
  vals.vJawW.textContent   = parseFloat(ui.jawW.value).toFixed(2);
  vals.vJawB.textContent   = parseFloat(ui.jawB.value).toFixed(2);
  vals.vNeckW.textContent  = parseFloat(ui.neckW.value).toFixed(2);
  vals.vNeckX.textContent  = parseFloat(ui.neckX.value).toFixed(2);
  vals.vTorsoH.textContent = parseFloat(ui.torsoH.value).toFixed(2);
  vals.vTorsoW.textContent = parseFloat(ui.torsoW.value).toFixed(2);
  vals.vTorsoX.textContent = parseFloat(ui.torsoX.value).toFixed(2);
  vals.vTorsoTop.textContent = parseFloat(ui.torsoTop.value).toFixed(2);
  vals.vTorsoBot.textContent = parseFloat(ui.torsoBot.value).toFixed(2);
}

Object.values(ui).forEach(el => { el.addEventListener('input', draw); el.addEventListener('change', draw); });

document.getElementById('resetBtn').addEventListener('click', () => {
  ui.heads.value = 8; ui.lineWidth.value = 5;
  ui.skullH.value = 1; ui.skullW.value = 1; ui.skullX.value = 0;
  ui.chinY.value = 0; ui.chinW.value = 0; ui.chinR.value = 0.3;
  ui.jawY.value = 0.6; ui.jawW.value = 0.85; ui.jawB.value = 0.5;
  ui.neckW.value = 0.3; ui.neckX.value = 0;
  ui.torsoH.value = 1; ui.torsoW.value = 1; ui.torsoX.value = 0;
  ui.torsoTop.value = 0.6; ui.torsoBot.value = 0.8;
  ui.showHeads.checked = true; ui.showSub.checked = true;
  draw();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `head_torso_4096_${ui.heads.value}heads.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

draw();
</script>
</body>
</html>
